<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<link rel="stylesheet" href="/carousel/week-series.css">
<!-- From the brand side 02: campaign math (keyword RATE -> buildwithvvish.com/#read-creator-campaign-math, has a calculator).
     Worked example and formulas from that guide; illustrative, not a benchmark. -->
<style>
.calc{position:absolute;left:72px;width:936px;border-radius:30px;background:#15130F;color:#F3EEE5;padding:40px 46px}
.calc .f{font:500 26px 'Geist Mono';color:#A39A8C;letter-spacing:.04em}
.calc .r{font-family:'Instrument Serif',serif;font-size:190px;line-height:1;color:var(--lamp);margin-top:12px}
.calc .s{font:500 32px/1.4 'Inter Tight';color:#D8D0C2;margin-top:10px}
.in{position:absolute;left:72px;width:936px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.in div{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:24px 28px;font:500 24px 'Geist Mono';color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.in div b{display:block;font:700 54px 'Inter Tight';color:var(--ink);letter-spacing:0;text-transform:none;margin-top:6px}
</style>
</head><body><div id="deck"></div>
<script src="/carousel/brandside-head.js"></script>
<script>
const F = "/carousel/assets/week02/vish.jpg";
const VALS = [["Reach", "600,000"], ["Engagements", "24,000"], ["CPM", "€33.33"], ["Per engagement", "€0.83"]];
const track = (k) => `<div class="in" style="top:960px;grid-template-columns:repeat(4,1fr);gap:12px">${VALS.map(([a, b], j) => `<div style="padding:18px 18px;font-size:17px;${j > k ? "opacity:.35" : j === k ? "border-color:var(--amber);border-width:3px" : ""}">${a}<b style="font-size:34px">${j <= k ? b : "?"}</b></div>`).join("")}</div>`;
const step = (n, name, f, r, s) => (i) => ["", `
  <div class="big" style="top:110px">${n}</div><div class="label" style="top:150px">Number ${n} · ${name}</div>
  <div class="h" style="top:205px;width:700px;font-size:96px">${name.replace(/(\S+)$/, "<em>$1.</em>")}</div>
  <div class="calc" style="top:520px"><div class="f">${f}</div><div class="r">${r}</div><div class="s">${s}</div></div>${track(+n - 1)}`];
deck("From the brand side", [
 (i) => ["", `
  <div class="label" style="top:150px">Campaign math · 4 numbers</div>
  <div class="h" style="top:205px;width:930px;font-size:116px">Every brand deal comes down to <em>four numbers.</em></div>
  <img class="face" src="${F}" style="left:72px;top:690px;width:300px;height:300px;object-position:52% 30%">
  <div class="sticker amber" style="left:330px;top:760px;transform:rotate(-3deg)">850+ creator deals, brand side</div>
  <div class="p" style="top:1040px;width:930px;font-size:36px">Learn them and you'll sound more senior than your title. Creator or marketer.</div>
  <div class="swipe" style="top:1200px">Swipe →</div>`],
 (i) => ["", `
  <div class="label" style="top:150px">The example campaign</div>
  <div class="h" style="top:205px;width:930px;font-size:100px">One budget, ten <em>creators.</em></div>
  <div class="in" style="top:500px">
   <div>Budget<b>€20,000</b></div><div>Creators<b>10</b></div>
   <div>Reach per post<b>60,000</b></div><div>Engagement rate<b>4%</b></div>
  </div>
  <div class="cap" style="left:72px;top:900px">Illustrative numbers. Real ones depend on platform, market and tier.</div>`],
 step("01", "Total reach", "creators × reach per post = 10 × 60,000", "600,000", "How many people might see it."),
 step("02", "Engagements", "reach × engagement rate = 600,000 × 4%", "24,000", "Likes, comments, saves and shares. Whether people cared."),
 step("03", "CPM", "budget ÷ reach × 1,000 = €20,000 ÷ 600,000 × 1,000", "€33.33", "What it costs to reach 1,000 people."),
 step("04", "Cost per engagement", "budget ÷ engagements = €20,000 ÷ 24,000", "€0.83", "What each like, comment, save or share cost."),
 (i) => ["dark", `
  <div class="label" style="top:150px">So, is €33 CPM good?</div>
  <div class="h" style="top:205px;width:930px;font-size:100px">Compare it with <em>paid social.</em></div>
  <div class="p" style="top:520px;width:930px;font-size:38px">Look up what the brand pays for ads in the same market.</div>
  <div class="p" style="top:700px;width:930px;font-size:38px">Creator content often costs <b>more per view</b>, but earns <b>more trust</b>, and the brand can reuse it in ads.</div>
  <div class="p" style="top:960px;width:930px;font-size:38px">That's the argument you take into the meeting.</div>`],
 (i) => ["", `
  <img class="face" src="${F}" style="left:72px;top:150px;width:210px;height:210px;object-position:52% 30%">
  <div class="h" style="top:180px;left:320px;width:690px;font-size:76px">Want the <em>calculator?</em></div>
  <div class="cta" style="top:470px">
   <div class="ex" style="color:#A39A8C">Comment</div>
   <div class="kw">RATE</div>
   <div class="p">and I'll DM you the free guide:</div>
   <div class="p" style="color:#F3EEE5;margin-top:18px">✓ all four formulas<br>✓ a calculator you can play with<br>✓ the worked example</div>
  </div>
  <div class="p" style="top:1110px;width:930px"><b>Save it</b> for your next pitch.</div>`],
]);
</script></body></html>
