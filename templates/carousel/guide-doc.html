<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="/video/fonts.css">
<style>
:root{--paper:#FBFAF8;--ink:#17141C;--night:#0F0D14;--muted:#5F5967;--violet:#7F77DD;--vink:#4A44C4;--line:#E2DDE6;--a:#4A44C4;--a2:#7F77DD;--soft:#F5F4FF}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#ccc;font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.slide,.preview{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--paper);color:var(--ink);margin-bottom:20px}
.serif{font-family:Newsreader,Georgia,serif;font-weight:500;letter-spacing:-.028em;line-height:1.04}
.serif em{font-style:italic;color:var(--a)}
.mono{font-family:'Geist Mono',monospace}
/* ---------- cover ---------- */
.cover{background:var(--night);color:#F6F4FA}
.cover .glow{position:absolute;border-radius:50%;filter:blur(120px);opacity:.55}
.cover .stack{position:absolute;left:80px;right:80px;top:500px;display:flex;flex-direction:column;gap:30px}
.cover .kick{font:600 24px 'Geist Mono',monospace;letter-spacing:.14em;color:var(--a2)}
.cover h1{width:900px;font-size:112px;color:#fff}
.cover h1 em{color:var(--a2)}
.cover .sub{width:800px;font:400 34px/1.45 Geist;color:#C9C4D2}
.cover .meta{position:absolute;left:80px;right:80px;bottom:150px;font:400 23px 'Geist Mono',monospace;color:#8E879A;line-height:1.6}
.cover .brand{position:absolute;left:80px;top:72px;display:flex;align-items:center;gap:16px;font:500 24px 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#C9C4D2}
.cover .brand i{width:38px;height:38px;border-radius:11px;background:var(--a2);display:inline-block}
.cover .pages{position:absolute;right:80px;top:76px;font:500 22px 'Geist Mono',monospace;color:#8E879A}
.cover .motif{position:absolute;right:70px;top:120px;width:360px;height:360px}
.cover .bar{position:absolute;left:80px;right:80px;bottom:80px;display:flex;justify-content:space-between;font:500 22px 'Geist Mono',monospace;color:#8E879A}
/* ---------- step ---------- */
.step .hdr{position:absolute;left:72px;right:72px;top:56px;display:flex;justify-content:space-between;align-items:center;font:500 22px 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.step .hdr b{display:flex;align-items:center;gap:14px;color:var(--ink);font-weight:500}
.step .hdr b i{width:32px;height:32px;border-radius:9px;background:var(--a);display:inline-block}
.step .col{position:absolute;left:72px;right:72px;top:140px;bottom:120px}
.step .inner{display:flex;flex-direction:column;gap:30px;transform-origin:0 0}
.step .inner>*{flex-shrink:0}
.step .top{display:flex;gap:26px;align-items:flex-start}
.step .badge{flex:none;width:84px;height:84px;border-radius:22px;background:var(--a);color:#fff;display:grid;place-items:center;font:600 46px Geist;box-shadow:0 18px 30px -16px var(--a)}
.step .kick{font:600 22px 'Geist Mono',monospace;letter-spacing:.12em;color:var(--a);margin:4px 0 12px}
.step h2{font-size:76px}
.step .body{font:400 36px/1.45 Geist;color:#2B2732}
.win{margin-top:auto;border-radius:24px;background:#fff;border:1.5px solid var(--line);box-shadow:0 40px 80px -44px rgba(40,20,110,.38);overflow:hidden;flex:none}
.win .wbar{height:58px;background:#F3F0F4;border-bottom:1.5px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:11px;font:500 21px 'Geist Mono',monospace;color:var(--muted)}
.win .wbar s{width:14px;height:14px;border-radius:50%;background:#D5CFDA;text-decoration:none}
.win .wbar span{margin-left:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win .wbody{padding:22px 26px}
table{width:100%;border-collapse:collapse;font:400 28px/1.35 Geist;color:#2B2732}
th{text-align:left;font:600 19px 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 12px 12px;border-bottom:1.5px solid var(--line)}
td{padding:14px 12px;border-bottom:1px solid #EFEBF1}
tr:last-child td{border-bottom:none}
td:first-child{font-weight:600}
.pill{display:inline-block;padding:4px 14px;border-radius:999px;background:var(--soft);color:var(--a);font:600 21px Geist}
.chat{display:flex;flex-direction:column;gap:14px}
.msg{max-width:86%;padding:18px 24px;border-radius:22px;font:400 28px/1.4 Geist}
.msg.u{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.msg.c{align-self:flex-start;background:var(--soft);color:#2B2732;border-bottom-left-radius:6px}
.msg.c b{color:var(--a)}
.check{display:flex;flex-direction:column;gap:14px}
.check div{display:flex;gap:18px;align-items:flex-start;font:400 29px/1.35 Geist;color:#2B2732}
.check i{flex:none;width:32px;height:32px;border-radius:9px;border:2px solid var(--a);display:grid;place-items:center;margin-top:1px}
.check i.on{background:var(--a)}
.check i.on:after{content:"";width:12px;height:7px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(-45deg) translate(1px,-2px)}
.bars{display:flex;flex-direction:column;gap:16px}
.bars .r{display:grid;grid-template-columns:280px 1fr 130px;gap:18px;align-items:center;font:400 27px Geist;color:#2B2732}
.bars .t{height:22px;border-radius:999px;background:#EFEBF1;overflow:hidden}
.bars .t i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--a2),var(--a))}
.bars .v{font:500 21px 'Geist Mono',monospace;color:var(--muted);text-align:right}
.page{display:flex;flex-direction:column;gap:14px;font:400 28px/1.45 Geist;color:#2B2732}
.page .h{font:600 30px Newsreader,serif}
.page mark{background:linear-gradient(transparent 55%,var(--soft) 55%);color:inherit;padding:0 2px}
.prompt{border-radius:22px;background:var(--ink);color:#EDEAF3;padding:22px 28px 26px;flex:none}
.prompt .pl{display:flex;justify-content:space-between;font:600 19px 'Geist Mono',monospace;letter-spacing:.12em;color:var(--a2);margin-bottom:12px}
.prompt .pl span{color:#8E879A;letter-spacing:.06em}
.prompt p{font:400 27px/1.5 'Geist Mono',monospace;white-space:pre-wrap}
.foot{position:absolute;left:72px;right:72px;bottom:50px;display:flex;justify-content:space-between;font:500 21px 'Geist Mono',monospace;letter-spacing:.04em;color:var(--muted)}
.foot b{color:var(--a)}
/* ---------- cta ---------- */
.cta{background:var(--night);color:#fff}
.cta h2{position:absolute;left:80px;top:300px;width:900px;font-size:104px}
.cta h2 em{color:var(--a2)}
.cta .sub{position:absolute;left:80px;top:640px;width:860px;font:400 34px/1.45 Geist;color:#C9C4D2}
.cta .kw{position:absolute;left:80px;top:830px;display:flex;align-items:center;gap:26px;font:500 40px Geist;color:#C9C4D2}
.cta .kw b{font:700 64px 'Geist Mono',monospace;letter-spacing:.06em;color:#fff;background:var(--a);padding:18px 34px;border-radius:20px;box-shadow:0 30px 60px -24px var(--a)}
.cta .url{position:absolute;left:80px;bottom:150px;font:500 25px 'Geist Mono',monospace;color:var(--a2)}
.cta .who{position:absolute;left:80px;bottom:80px;font:400 23px 'Geist Mono',monospace;color:#8E879A}
/* ---------- preview (the LinkedIn image) ---------- */
.preview{background:#08070B}
.viewer{position:absolute;left:28px;right:28px;top:28px;height:1092px;border-radius:26px;background:#1A1720;overflow:hidden;display:flex}
.side{width:236px;flex:none;background:#2A2631;padding:22px 18px;display:flex;flex-direction:column;gap:18px;overflow:hidden}
.th{position:relative;width:200px;height:250px;border-radius:10px;overflow:hidden;flex:none;box-shadow:0 10px 20px -10px #000}
.th.on{outline:5px solid var(--a2);outline-offset:3px}
.th>div{transform:scale(.185);transform-origin:0 0}
.th u{position:absolute;bottom:-1px;left:0;right:0;text-decoration:none}
.tn{font:500 17px 'Geist Mono',monospace;color:#8E879A;text-align:center;margin-top:-10px}
.main{flex:1;position:relative;overflow:hidden;padding:26px 0 0 26px}
.main .pg{width:740px;height:925px;overflow:hidden;border-radius:6px;margin-bottom:22px;box-shadow:0 30px 60px -30px #000}
.main .pg>div{transform:scale(.685);transform-origin:0 0}
.banner{position:absolute;left:0;right:0;bottom:0;height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.banner p{font:600 64px Geist;color:#fff;letter-spacing:-.01em;white-space:nowrap}
.banner p b{color:var(--a2)}
.banner span{font:400 25px 'Geist Mono',monospace;color:#8E879A}
</style></head>
<body>
<div id="deck"></div>
<script>
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const cells = r => Array.isArray(r) ? r : (r && typeof r === "object" ? Object.values(r) : [r]);
const THEMES = {  // one art direction per guide, inside the brand: violet always leads
  CITED:   {a: "#3D5AFE", a2: "#9AA8FF", soft: "#EEF1FF", glowA: "#3D5AFE", glowB: "#7F77DD", motif: "quote"},
  CREATOR: {a: "#C2552F", a2: "#F3A27E", soft: "#FDF1EB", glowA: "#E07A5C", glowB: "#7F77DD", motif: "cards"},
  YOUTUBE: {a: "#0E8C80", a2: "#6FE0D2", soft: "#EAF8F5", glowA: "#0E8C80", glowB: "#7F77DD", motif: "timeline"},
  DEFAULT: {a: "#4A44C4", a2: "#AFA9EC", soft: "#F5F4FF", glowA: "#7F77DD", glowB: "#3D5AFE", motif: "quote"}
};
function motif(kind, T) {
  if (kind === "cards") return `<svg class="motif" viewBox="0 0 420 420">${[0, 1, 2].map(i => `<g transform="translate(${60 + i * 46} ${40 + i * 70}) rotate(${-8 + i * 8} 120 80)"><rect width="250" height="150" rx="22" fill="${i === 2 ? T.a : "#2A2631"}" stroke="${T.a2}" stroke-opacity=".5"/><circle cx="52" cy="52" r="26" fill="${i === 2 ? "#fff" : T.a2}" fill-opacity="${i === 2 ? 1 : .5}"/><rect x="94" y="36" width="120" height="14" rx="7" fill="#fff" fill-opacity=".7"/><rect x="94" y="62" width="80" height="12" rx="6" fill="#fff" fill-opacity=".35"/><rect x="26" y="104" width="190" height="12" rx="6" fill="#fff" fill-opacity=".25"/></g>`).join("")}</svg>`;
  if (kind === "timeline") return `<svg class="motif" viewBox="0 0 420 420"><rect x="30" y="70" width="360" height="210" rx="26" fill="#2A2631" stroke="${T.a2}" stroke-opacity=".5"/>${[0, 1, 2, 3, 4, 5, 6, 7].map(i => `<rect x="${58 + i * 40}" y="${190 - [40, 70, 55, 95, 120, 80, 105, 60][i]}" width="22" height="${[40, 70, 55, 95, 120, 80, 105, 60][i]}" rx="6" fill="${i === 4 ? T.a : T.a2}" fill-opacity="${i === 4 ? 1 : .55}"/>`).join("")}<rect x="58" y="226" width="304" height="10" rx="5" fill="#fff" fill-opacity=".15"/><rect x="58" y="226" width="190" height="10" rx="5" fill="${T.a}"/><circle cx="248" cy="231" r="14" fill="#fff"/>${[0, 1, 2].map(i => `<rect x="${30 + i * 124}" y="306" width="112" height="44" rx="12" fill="#2A2631" stroke="${T.a2}" stroke-opacity=".4"/><rect x="${46 + i * 124}" y="324" width="${50 + i * 10}" height="9" rx="4" fill="#fff" fill-opacity=".5"/>`).join("")}</svg>`;
  return `<svg class="motif" viewBox="0 0 420 420"><text x="40" y="300" font-family="Newsreader,serif" font-style="italic" font-size="420" fill="${T.a}" fill-opacity=".9">“</text>${["[1]", "[2]", "[3]"].map((t, i) => `<g transform="translate(${200 + (i % 2) * 70} ${90 + i * 90})"><rect width="118" height="60" rx="16" fill="#2A2631" stroke="${T.a2}" stroke-opacity=".6"/><text x="59" y="40" text-anchor="middle" font-family="Geist Mono,monospace" font-size="28" font-weight="600" fill="${i === 0 ? "#fff" : T.a2}">${t}</text></g>`).join("")}</svg>`;
}
function ui(u, T) {
  if (!u) return "";
  const rows = (u.rows || []).map(cells);
  let inner = "";
  if (u.type === "table") {
    const [h, ...rest] = rows;
    inner = `<table><thead><tr>${h.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${rest.map(r => `<tr>${r.map((c, i) => `<td>${i === r.length - 1 && r.length > 2 ? `<span class="pill">${esc(c)}</span>` : esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  } else if (u.type === "chat") {
    inner = `<div class="chat">${rows.map((r, i) => {
      let who = r.length > 1 ? String(r[0]).toLowerCase() : (i % 2 ? "claude" : "you"), t = r.length > 1 ? r.slice(1).join(" ") : String(r[0]);
      const m = r.length === 1 && t.match(/^\s*(you|me|user|claude|ai|assistant)\s*:\s*/i);
      if (m) { who = m[1].toLowerCase(); t = t.slice(m[0].length); }
      return `<div class="msg ${/claude|ai|assistant/.test(who) ? "c" : "u"}">${esc(t)}</div>`; }).join("")}</div>`;
  } else if (u.type === "checklist") {
    inner = `<div class="check">${rows.map((r, i) => `<div><i class="${i < Math.ceil(rows.length / 2) ? "on" : ""}"></i><span>${esc(r.join(" · "))}</span></div>`).join("")}</div>`;
  } else if (u.type === "chart") {
    const body = rows.length > 1 && isNaN(parseFloat(String(rows[0][1]).replace(/[^0-9.]/g, ""))) ? rows.slice(1) : rows;
    const nums = body.map(r => parseFloat(String(r[1] ?? "").replace(/[^0-9.]/g, "")));
    const max = Math.max(...nums.filter(n => !isNaN(n)), 1);
    inner = `<div class="bars">${body.map((r, i) => { const n = nums[i]; const w = isNaN(n) ? 90 - i * 15 : Math.max(8, 100 * n / max); return `<div class="r"><span>${esc(r[0])}</span><div class="t"><i style="width:${w}%"></i></div><span class="v">${esc(r.slice(1).join(" "))}</span></div>`; }).join("")}</div>`;
  } else {  // browser / page
    inner = `<div class="page">${rows.map((r, i) => i === 0 ? `<div class="h">${esc(r.join(" "))}</div>` : `<div>${i === 1 ? `<mark>${esc(r.join(" "))}</mark>` : esc(r.join(" "))}</div>`).join("")}</div>`;
  }
  return `<div class="win"><div class="wbar"><s></s><s></s><s></s><span>${esc(u.title || "")}</span></div><div class="wbody">${inner}</div></div>`;
}
const em = t => esc(t).replace(/\*(.+?)\*/g, "<em>$1</em>");
function lastWordsEm(t) {  // italic violet emphasis on the last two words, the brand's headline signature
  const w = String(t).split(" ");
  if (String(t).includes("*") || w.length < 3) return em(t);
  return esc(w.slice(0, -2).join(" ")) + " <em>" + esc(w.slice(-2).join(" ")) + "</em>";
}
function pages(post, T) {
  const N = post.pages.length, url = `buildwithvish.netlify.app/#read-${post.slug}`;
  return post.pages.map((p, i) => {
    if (p.kind === "cover") return `<div class="slide cover"><div class="glow" style="width:700px;height:700px;left:-260px;top:-240px;background:${T.glowA}"></div><div class="glow" style="width:620px;height:620px;right:-240px;bottom:-200px;background:${T.glowB}"></div>
      <div class="brand"><i></i>Build with Vish</div><div class="pages">${N} pages</div>${motif(T.motif, T)}
      <div class="stack"><div class="kick">${esc(p.kicker)}</div><h1 class="serif">${lastWordsEm(p.title)}</h1><div class="sub">${esc(p.sub)}</div></div>
      <div class="meta">${post.subtitle && post.subtitle !== p.sub ? esc(post.subtitle) : ""}</div><div class="bar"><span>Vish Kumbhar · AI x marketing</span><span>Comment ${esc(post.keyword)}</span></div></div>`;
    if (p.kind === "cta") return `<div class="slide cta"><div class="glow" style="position:absolute;border-radius:50%;filter:blur(120px);opacity:.5;width:760px;height:760px;right:-260px;top:-200px;background:${T.glowA}"></div>
      <h2 class="serif">${lastWordsEm(p.title)}</h2><div class="sub">${esc(p.sub)}</div><div class="kw">Comment <b>${esc(p.keyword || post.keyword)}</b></div>
      <div class="url">${esc(url)}</div><div class="who">Vish Kumbhar · 850+ creator deals · AI x marketing</div></div>`;
    return `<div class="slide step"><div class="hdr"><b><i></i>Build with Vish</b><span>Step ${p.n} / 7</span></div>
      <div class="col"><div class="inner"><div class="top"><div class="badge">${p.n}</div><div><div class="kick">${esc(p.kicker)}</div><h2 class="serif">${lastWordsEm(p.title)}</h2></div></div>
      <div class="body">${esc(p.body)}</div>${ui(p.ui, T)}
      ${p.prompt ? `<div class="prompt"><div class="pl">COPY THIS PROMPT<span>Claude</span></div><p>${esc(p.prompt)}</p></div>` : ""}</div></div>
      <div class="foot"><span>${String(i + 1).padStart(2, "0")} / ${String(N).padStart(2, "0")}</span><span>Full guide: comment <b>${esc(post.keyword)}</b></span></div></div>`;
  }).join("");
}
function fit(el) {  // scale a step's content down until it fits above the footer; short pages keep the window at the bottom
  const col = el.querySelector(".col");
  if (!col) return;
  const inner = col.firstElementChild, H = col.clientHeight;
  inner.style.minHeight = "0px";
  const h = inner.scrollHeight;
  const s = h > H ? Math.max(0.6, H / h) : 1;
  inner.style.transform = `scale(${s})`;
  inner.style.width = `${100 / s}%`;
  inner.style.minHeight = `${H / s}px`;
}
function fitBanner(pv) {
  const b = pv.querySelector(".banner p");
  let f = 64;
  while (b.scrollWidth > 1010 && f > 36) { f -= 2; b.style.fontSize = f + "px"; }
}
window.setup = async post => {
  const T = THEMES[post.keyword] || THEMES.DEFAULT;
  const r = document.documentElement.style;
  r.setProperty("--a", T.a); r.setProperty("--a2", T.a2); r.setProperty("--soft", T.soft);
  const deck = document.getElementById("deck");
  deck.innerHTML = pages(post, T);
  const slides = [...deck.querySelectorAll(".slide")];
  await document.fonts.ready;  // fonts load only once text uses them: measure after, or real text overflows
  await new Promise(r => setTimeout(r, 300));
  slides.forEach(fit);
  // the LinkedIn image: the guide open in a document viewer, page thumbnails down the side, comment banner
  const pv = document.createElement("div");
  pv.className = "preview";
  pv.innerHTML = `<div class="viewer"><div class="side">${slides.slice(0, 4).map((s, i) => `<div class="th ${i ? "" : "on"}"><div>${s.outerHTML}</div></div><div class="tn">${i + 1}</div>`).join("")}</div>
    <div class="main"><div class="pg"><div>${slides[0].outerHTML}</div></div><div class="pg"><div>${slides[1].outerHTML}</div></div></div></div>
    <div class="banner"><p>Comment "<b>${esc(post.keyword)}</b>" to get the guide</p><span>${esc(post.pages.length)}-page mini guide · free · Build with Vish</span></div>`;
  deck.appendChild(pv);
  fitBanner(pv);
  window.READY = true;
};
window.STAGE_LOADED = true;
</script>
</body></html>
