<!doctype html>
<html><head><meta charset="utf-8"><title>night video</title>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<link rel="stylesheet" href="/video/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:#08070D;color:#F5F5F7;font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#c{position:absolute;inset:0;width:1080px;height:1350px}
.wash{position:absolute;inset:0;background:radial-gradient(60% 45% at 80% 30%,rgba(169,156,255,.14),transparent 70%),radial-gradient(50% 40% at 10% 90%,rgba(111,224,210,.08),transparent 70%)}
.grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.top{position:absolute;left:84px;right:84px;top:80px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.handle{display:flex;align-items:center;gap:16px;font-size:24px;font-weight:600}
.avatar{width:54px;height:54px;border-radius:50%;background:#7F77DD;color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700}
.handle small{display:block;font-size:19px;font-weight:400;color:#A1A1A6}
.pill{font:500 20px 'Geist Mono',monospace;border:.5px solid #2A2A2E;border-radius:999px;padding:10px 20px;color:#A1A1A6;background:#121214}
.scene{position:absolute;left:84px;right:84px;bottom:190px;opacity:0;z-index:4}
.kick{font:500 22px 'Geist Mono',monospace;color:#A99CFF;letter-spacing:.04em;margin-bottom:22px;text-transform:uppercase}
h1{font-size:84px;line-height:1.02;letter-spacing:-.042em;font-weight:700;text-wrap:balance}
h1 em,h2 em{font-style:normal;color:#A99CFF}
h2{font-size:64px;line-height:1.06;letter-spacing:-.035em;font-weight:700;text-wrap:balance}
p{font-size:36px;line-height:1.4;color:#CFCDD6;margin-top:22px;text-wrap:pretty}
.big{font-size:220px;font-weight:700;letter-spacing:-.06em;line-height:.9;color:#F3C584}
.src{font:400 20px 'Geist Mono',monospace;color:#A1A1A6;margin-top:22px}
.w{display:inline-block;opacity:0}
.bar{position:absolute;left:84px;right:84px;bottom:100px;height:3px;background:#1E1D2B;border-radius:3px;z-index:5}
.bar i{display:block;height:100%;width:0;background:#A99CFF;border-radius:3px}
.mascot{position:absolute;right:70px;bottom:330px;width:230px;opacity:0;z-index:6}
.cap{position:absolute;left:84px;bottom:128px;font:500 20px 'Geist Mono',monospace;color:#A1A1A6;z-index:5}
</style></head><body>
<canvas id="c"></canvas><div class="wash"></div>
<div class="top"><div class="handle"><div class="avatar">VK</div><div>Vish Kumbhar<small>Build with Vish</small></div></div><div class="pill" id="pill">AI x Marketing</div></div>
<div id="scenes"></div>
<img class="mascot" id="mascot" src="/video/mascot.png" alt="">
<div class="cap" id="cap"></div>
<div class="bar"><i id="bar"></i></div>
<div class="grain"></div>
<script type="module">
import * as THREE from "three";
import { createStage, objects, mat, C } from "/three/kit.js";

const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));

let S, tiles, stars, D;
window.setup = async (spec) => {
  D = spec;
  const html = spec.scenes.map((s, i) => {
    const words = (t, tag) => { let on = false; return `<${tag}>${t.split(" ").map((w) => { const st = w.startsWith("*"); if (st) on = true; const inner = w.replace(/\*/g, ""); const out = `<span class="w">${on ? `<em>${inner}</em>` : inner}</span>`; if (w.endsWith("*") || w.endsWith("*.") ) on = false; return out; }).join(" ")}</${tag}>`; };
    return `<div class="scene" id="s${i}">${s.kick ? `<div class="kick">${s.kick}</div>` : ""}${s.big ? `<div class="big">${s.big}</div>` : ""}${s.h1 ? words(s.h1, "h1") : ""}${s.h2 ? words(s.h2, "h2") : ""}${s.p ? `<p>${s.p}</p>` : ""}${s.src ? `<div class="src">${s.src}</div>` : ""}</div>`;
  }).join("");
  document.getElementById("scenes").innerHTML = html;
  S = createStage(document.getElementById("c"), { width: 1080, height: 1350, background: 0x08070d, exposure: 0.95, warm: 0.8, cool: 0.9 });
  S.scene.background = null;
  S.renderer.setClearColor(0x08070d, 0);
  tiles = objects.imageTiles({ count: 5, sponsored: 4 });
  S.scene.add(tiles);
  // Video budget: no transmission pass (software GPU), 3D layer at reduced resolution under crisp HTML text.
  tiles.traverse((o) => { if (o.material && o.material.transmission > 0) { o.material.transmission = 0; o.material.transparent = true; o.material.opacity = 0.9; o.material.roughness = 0.3; } });
  const q = spec.quality ?? 0.6;
  S.renderer.setSize(Math.round(1080 * q), Math.round(1350 * q), false);
  S.renderer.domElement.style.width = "1080px"; S.renderer.domElement.style.height = "1350px";
  const g = new THREE.BufferGeometry(); const n = 700; const pos = new Float32Array(n * 3);
  let r = 11; const rnd = () => ((r = (r * 9301 + 49297) % 233280) / 233280);
  for (let i = 0; i < n; i++) { pos[i * 3] = (rnd() - 0.5) * 18; pos[i * 3 + 1] = (rnd() - 0.5) * 22; pos[i * 3 + 2] = -rnd() * 14 - 1; }
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  stars = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xb9b2ff, size: 0.035, transparent: true, opacity: 0.7 }));
  S.scene.add(stars);
  await document.fonts.ready;
  window.READY = true;
};

window.frame = (t) => {
  const T = D.duration;
  // text scenes
  D.scenes.forEach((s, i) => {
    const el = document.getElementById("s" + i);
    const a = clamp((t - s.at) / 0.6), b = clamp((s.until - t) / 0.35);
    const vis = Math.min(ease(a), ease(b));
    el.style.opacity = vis;
    el.style.transform = `translateY(${(1 - ease(a)) * 40 - (1 - ease(b)) * 20}px)`;
    el.querySelectorAll(".w").forEach((w, k) => {
      const wa = ease(clamp((t - s.at - k * 0.06) / 0.5));
      w.style.opacity = wa; w.style.transform = `translateY(${(1 - wa) * 0.4}em)`; w.style.filter = `blur(${(1 - wa) * 8}px)`;
    });
  });
  document.getElementById("bar").style.width = (t / T) * 100 + "%";
  const cap = D.captions.find((c) => t >= c.at && t < c.until);
  document.getElementById("cap").textContent = cap ? cap.text : "";
  const m = document.getElementById("mascot"); const ma = ease(clamp((t - D.mascotAt) / 0.7));
  m.style.opacity = ma; m.style.transform = `translateY(${(1 - ma) * 60 + Math.sin(t * 2.2) * 6}px)`;
  // 3D: tiles start stacked, fan out, ad tile lifts in scene 3, camera drifts
  const fan = ease(clamp((t - 0.2) / 2.4));
  const lift = ease(clamp((t - D.liftAt) / 1.2)) * (1 - ease(clamp((t - D.liftEnd) / 1.0)));
  tiles.userData.tiles.forEach((tile, i) => {
    const k = i - 2;
    tile.position.set(k * 0.78 * fan, (tile.userData.isAd ? 0.1 + lift * 0.22 : 0) - Math.abs(k) * 0.1 * fan + 2.6, i * 0.3);
    tile.rotation.set(0, (tile.userData.isAd ? -0.1 : -0.35) * fan, k * -0.1 * fan);
    tile.scale.setScalar(tile.userData.isAd ? 1 + lift * 0.1 : 1 - lift * 0.08);
  });
  tiles.rotation.y = Math.sin(t * 0.35) * 0.18;
  tiles.position.y = Math.sin(t * 1.1) * 0.06;
  stars.rotation.y = t * 0.012; stars.position.y = -t * 0.04;
  S.camera.position.set(Math.sin(t * 0.2) * 0.6, 1.55, 14.2 - t * 0.05);
  S.camera.lookAt(0, 1.05, 0);
  S.renderer.render(S.scene, S.camera);
  return true;
};
window.STAGE_LOADED = true;
</script></body></html>
