<!doctype html>
<html><head><meta charset="utf-8"><title>cover</title>
<style>
/* Reel covers, two looks from research/viral/attention-playbook-2026-10-15.md:
   punch = giant hook + key word in a colour box + Vish's real face + two tiles acting out the metaphor + offer badge
   minimal = one or two giant words on a dark grid with an italic serif accent.
   Key content stays inside the centre 1080x1440 (the profile grid crop). No real logos. */
@font-face{font-family:'Geist';font-weight:900;src:url(/templates/node_modules/@fontsource/geist-sans/files/geist-sans-latin-900-normal.woff2) format('woff2')}
@font-face{font-family:'Geist';font-weight:600;src:url(/templates/node_modules/@fontsource/geist-sans/files/geist-sans-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Geist Mono';font-weight:500;src:url(/templates/node_modules/@fontsource/geist-mono/files/geist-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Newsreader';font-weight:500;font-style:italic;src:url(/templates/node_modules/@fontsource/newsreader/files/newsreader-latin-500-italic.woff2) format('woff2')}
:root{--night:#0F1014;--lamp:#E7A15A;--neon:#C6F432;--paper:#F4F5F7;--red:#FF4D4D}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:var(--H,1920px);overflow:hidden;background:var(--night);color:var(--paper);font-family:Geist,sans-serif}
#c{position:absolute;inset:0;background:
 radial-gradient(ellipse 70% 45% at 50% 62%,rgba(231,161,90,.22),transparent 70%),
 linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px) 0 0/54px 54px,
 linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px) 0 0/54px 54px,var(--night)}
.hook{position:absolute;left:60px;right:60px;top:var(--hookTop,300px);text-align:center;font:900 var(--hookSize,132px)/0.98 Geist;letter-spacing:-.035em;text-transform:none}
.hook .k{display:inline-block;background:var(--neon);color:#0F1014;padding:0 .14em .04em;border-radius:18px;transform:rotate(-2deg);margin:.06em 0}
.hook .k.lamp{background:var(--lamp)}
.face{position:absolute;left:0;top:0;transform-origin:0 0;filter:drop-shadow(0 30px 60px rgba(0,0,0,.6))}
.tile{position:absolute;width:210px;height:210px;border-radius:44px;background:#1A1C22;border:3px solid rgba(244,245,247,.18);display:grid;place-items:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.tile.dead{border-color:rgba(255,77,77,.7);filter:saturate(.3)}
.tile.live{border-color:var(--neon);box-shadow:0 0 50px rgba(198,244,50,.35)}
.tile b{position:absolute;bottom:-58px;left:50%;transform:translateX(-50%);font:500 30px 'Geist Mono';letter-spacing:.08em;white-space:nowrap}
.tile.dead b{color:var(--red)} .tile.live b{color:var(--neon)}
.badge{position:absolute;left:50%;transform:translateX(-50%);top:var(--badgeTop,1560px);font:500 46px 'Geist Mono';letter-spacing:.1em;padding:20px 40px;border:3px solid var(--neon);color:var(--neon);background:rgba(15,16,20,.85);border-radius:18px;white-space:nowrap}
.min{position:absolute;left:0;right:0;top:640px;text-align:center}
.min .big{font:900 230px/0.9 Geist;letter-spacing:-.04em}
.min .big em{font:500 italic 1.05em Newsreader,serif;color:var(--lamp);letter-spacing:-.01em}
.min .sub{margin-top:50px;font:500 40px 'Geist Mono';color:#9AA0AE;letter-spacing:.06em;text-transform:uppercase}
</style></head><body><div id="c"></div><div id="root"></div>
<script>
const ICON = {
  film:'<svg viewBox="0 0 24 24" width="110" height="110" fill="none" stroke="#F4F5F7" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 9h4M3 13h4M17 9h4M17 13h4"/></svg>',
  spark:'<svg viewBox="0 0 24 24" width="110" height="110"><g stroke="#E7A15A" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></g></svg>',
  doc:'<svg viewBox="0 0 24 24" width="110" height="110" fill="none" stroke="#F4F5F7" stroke-width="1.6"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>',
  chat:'<svg viewBox="0 0 24 24" width="110" height="110" fill="none" stroke="#F4F5F7" stroke-width="1.6"><path d="M4 5h16v11H9l-5 4z"/></svg>'
};
window.render = async spec => {
  const r = document.getElementById('root');
  const L = spec.layout === '4x5' ? {H:1350, hookTop:90, hookSize:112, badgeTop:1170, tileY:640, faceTop:520, faceScale:.92}
                                  : {H:1920, hookTop:330, hookSize:132, badgeTop:1580, tileY:1000, faceTop:760, faceScale:1.22};
  for(const [k,v] of Object.entries({H:L.H+'px', hookTop:L.hookTop+'px', hookSize:L.hookSize+'px', badgeTop:L.badgeTop+'px'})) document.documentElement.style.setProperty('--'+k, v);
  spec.faceTop = spec.faceTop || L.faceTop; spec.faceScale = spec.faceScale || L.faceScale;
  if(spec.style === 'minimal'){
    r.innerHTML = `<div class="min"><div class="big">${spec.big}</div><div class="sub">${spec.sub || ''}</div></div>`;
  } else {
    const h = spec.hook.replace(/\[(.+?)\]/g, `<span class="k${spec.keyColor === 'lamp' ? ' lamp' : ''}">$1</span>`);
    r.innerHTML = `<div class="hook">${h}</div>
      ${spec.face ? `<img class="face" src="${spec.face}">` : ''}
      ${(spec.tiles||[]).map((t,i)=>`<div class="tile ${t.state||''}" style="left:${i ? 800 : 70}px;top:${L.tileY + (i ? -40 : 30)}px;transform:rotate(${i ? 6 : -6}deg)">${ICON[t.icon]||''}<b>${t.label}</b></div>`).join('')}
      ${spec.badge ? `<div class="badge">${spec.badge}</div>` : ''}`;
    if(spec.face){ const im = r.querySelector('.face'); await im.decode(); const s = spec.faceScale; im.style.transform = `translate(${540 - s*spec.cx}px,${spec.faceTop - s*spec.top}px) scale(${s})`; }
  }
  await document.fonts.ready; window.DONE = true;
};
window.READY = true;
</script></body></html>
