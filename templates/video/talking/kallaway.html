<!doctype html>
<html><head><meta charset="utf-8"><title>reel</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
/* Kallaway/Justyn system in the night-studio palette (research/creators/style-guide-2026-10-14.md):
   three shots (full-frame talk, split = graphics canvas + speaker box, full-screen B-roll), one-word captions,
   type-on titles with one italic serif word, pop-in cards, whip pans, a Justyn text-behind-subject hook. */
@font-face{font-family:'Geist';font-weight:500;src:url(/templates/node_modules/@fontsource/geist-sans/files/geist-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Geist';font-weight:700;src:url(/templates/node_modules/@fontsource/geist-sans/files/geist-sans-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Geist';font-weight:900;src:url(/templates/node_modules/@fontsource/geist-sans/files/geist-sans-latin-900-normal.woff2) format('woff2')}
@font-face{font-family:'Geist Mono';font-weight:500;src:url(/templates/node_modules/@fontsource/geist-mono/files/geist-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Newsreader';font-weight:500;font-style:italic;src:url(/templates/node_modules/@fontsource/newsreader/files/newsreader-latin-500-italic.woff2) format('woff2')}
@font-face{font-family:'Newsreader';font-weight:500;font-style:normal;src:url(/templates/node_modules/@fontsource/newsreader/files/newsreader-latin-500-normal.woff2) format('woff2')}
:root{--night:#0F1014;--lamp:#E7A15A;--accent:#3049E0;--paper:#F4F5F7;--mute:#8E94A2;--card:#191B21;--line:rgba(244,245,247,.12);--red:#FF4D4D;--green:#7BE0A0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;background:var(--night);color:var(--paper);font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#root{position:relative;overflow:hidden}
.layer{position:absolute;inset:0;overflow:hidden}
/* canvas: near-black with a faint square grid and a warm lamp glow */
#canvas{background:
  radial-gradient(ellipse 70% 40% at 50% 30%,rgba(231,161,90,.07),transparent 70%),
  linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/48px 48px,
  linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/48px 48px,var(--night)}
#full img,#broll img{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#broll img{width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
#box{position:absolute;overflow:hidden;border-radius:36px;box-shadow:0 0 0 2px rgba(244,245,247,.10),0 30px 80px rgba(0,0,0,.6)}
#box img{position:absolute;left:0;top:0;transform-origin:0 0}
#hook{background:radial-gradient(ellipse 80% 60% at 50% 40%,#1D2027,#0B0C0F 75%)}
#hook .giant{position:absolute;left:0;right:0;text-align:center;font:500 248px/0.86 Newsreader,serif;letter-spacing:-.02em;text-transform:uppercase;color:#EDE6DA}
#hook img{position:absolute;left:0;top:0;transform-origin:0 0;filter:drop-shadow(0 20px 40px rgba(0,0,0,.6))}
#title{position:absolute;left:0;right:0;text-align:center;font:700 var(--ts,54px)/1.12 Geist;letter-spacing:-.01em;z-index:12;padding:0 50px}
#title em,.cap em{font:500 italic 1.12em Newsreader,serif;letter-spacing:0}
#title .w{display:inline-block;opacity:0;filter:blur(8px);margin-right:.22em}
#title .hl{background:var(--lamp);color:#14161B;padding:0 .2em;border-radius:6px}
#zone{position:absolute;transform-origin:0 0;z-index:8}
.g{position:absolute;left:0;top:0;width:960px;height:900px;opacity:0}
#g-capt{overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent)}
#cap{position:absolute;left:0;right:0;text-align:center;z-index:20;transform:translateY(-50%)}
.cap{display:inline-block;font:700 var(--cs,80px)/1 Geist;letter-spacing:-.01em;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.65),0 2px 4px rgba(0,0,0,.6)}
.cap em{font-size:1.15em}
.card{position:absolute;background:var(--card);border:2px solid rgba(244,245,247,.85);border-radius:28px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.6)}
.card.soft{border-color:var(--line)}
.mono{font:500 26px 'Geist Mono',monospace;color:var(--mute);letter-spacing:.02em}
.pill{position:absolute;padding:10px 22px;border:2px solid rgba(244,245,247,.75);border-radius:14px;font:700 30px Geist;background:rgba(15,16,20,.85);white-space:nowrap}
.dot{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--lamp);box-shadow:0 0 0 6px rgba(231,161,90,.25),0 0 24px var(--lamp)}
.stamp{position:absolute;display:grid;place-items:center;width:150px;height:150px;border-radius:50%;font:900 92px Geist;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.term{font:500 33px/1.75 'Geist Mono',monospace;color:#D7DCE6;padding:26px 30px}
.term .ok{color:var(--green)} .term .cmd{color:var(--lamp)}
.code{font:500 21px/1.55 'Geist Mono',monospace;color:#AEB6C6;padding:22px 26px;white-space:pre}
.code b{color:#E7A15A;font-weight:500} .code i{color:#7086FF;font-style:normal} .code u{color:#7BE0A0;text-decoration:none}
.bar3{height:56px;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:1px solid var(--line);font:600 24px Geist;color:#C9CED9}
.bar3 i{width:15px;height:15px;border-radius:50%;background:#3A3F4C}
.wv{position:absolute;display:flex;align-items:center}
.wv i{display:block;flex:0 0 auto;border-radius:3px;background:var(--paper);margin-right:2px}
.tw{position:absolute;left:0;right:0;font:700 46px/1.35 Geist;color:#555B68;text-align:center}
.tw span{display:block}
.tw span.on{color:#fff}
.frm{position:absolute;border:3px dashed rgba(244,245,247,.35);border-radius:22px;overflow:hidden;background:#15171C}
.frm img{position:absolute;opacity:0}
.frm .lbl{position:absolute;left:50%;bottom:-70px;transform:translateX(-50%);opacity:0}
.gh{position:absolute;width:660px;height:600px;border-radius:24px;overflow:hidden;border:2px solid rgba(244,245,247,.85);background:#fff;box-shadow:0 30px 70px rgba(0,0,0,.6)}
.gh img{position:absolute;left:0;top:0;width:100%}
#focus{position:absolute;z-index:15;opacity:0}
#focus i{position:absolute;width:80px;height:80px;border:7px solid #fff}
#focus i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:16px 0 0 0}
#focus i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 16px 0 0}
#focus i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 16px}
#focus i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 16px 0}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:30;pointer-events:none}
</style></head>
<body>
<div id="root">
  <div class="layer" id="canvas"></div>
  <div class="layer" id="full"><img id="fullimg" class="room" alt=""></div>
  <div class="layer" id="hook"><div class="giant" id="giant">I didn't<br>edit.</div><img id="hookcut" class="cut" alt=""></div>
  <div class="layer" id="broll"><img id="brollimg" alt=""></div>
  <div id="zone"></div>
  <div id="box"><img id="boximg" class="room" alt=""></div>
  <div id="title"></div>
  <div id="focus"><i></i><i></i><i></i><i></i></div>
  <div id="cap"></div>
  <div id="flash"></div>
</div>
<script>
const LAYOUT = new URLSearchParams(location.search).get('layout') || '9x16';
const [W,H] = {'9x16':[1080,1920],'4x5':[1080,1350]}[LAYOUT];
const root = document.getElementById('root');
Object.assign(root.style,{width:W+'px',height:H+'px'}); Object.assign(document.body.style,{width:W+'px',height:H+'px'});
// per layout: title top + size, graphics zone, speaker box, caption y per shot, full-frame offset (face height)
const L = {
  '9x16': {title:[140,64], zone:[30,300,1020,980], box:[60,1330,960,530], cap:{full:1190, split:1268, broll:960, hook:1190}, cs:82, faceFull:790, giantTop:200, giantSize:248},
  '4x5':  {title:[40,48], zone:[60,150,960,720], box:[60,905,960,400], cap:{full:860, split:868, broll:675, hook:860}, cs:66, faceFull:560, giantTop:24, giantSize:196},
}[LAYOUT];
const $ = (s,el=document)=>el.querySelector(s), $$=(s,el=document)=>[...el.querySelectorAll(s)];
const norm = s => s.toLowerCase().replace(/[^a-z0-9']/g,'');
const ease = x => 1 - Math.pow(1 - x, 3);
const fmt = s => { s = Math.round(s); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
const pad = n => String(n).padStart(5,'0');
let S, T = {}, SH = [], tl, SFX = [], G = {};
const fx = (t, s, g) => SFX.push(g ? {t:+t.toFixed(3), s, g} : {t:+t.toFixed(3), s});
function wt(p, after=0){ const w = S.words.find(w => w.t >= after - 1e-3 && norm(w.x).startsWith(p)); if(!w) throw new Error('cue word not found: '+p+' after '+after); return w.t; }
function snap(t){ let b=t,d=.45; for(const k of S.keeps){ if(Math.abs(k-t)<d){d=Math.abs(k-t);b=k;} } return b; }

/* ---------- graphics (960x900 base, scaled into the layout's zone) ---------- */
function g(id, html){ const el = document.createElement('div'); el.className='g'; el.id='g-'+id; el.innerHTML = html; $('#zone').appendChild(el); G[id]=el; return el; }
function build(){
  const R = S.raw_s, pct = s => (100*s/R).toFixed(2)+'%';
  const mk = [...S.wave.retakes.map(r=>[r[0],'retake']), ...S.wave.fillers.map(f=>[f.src[0],'filler'])].sort((a,b)=>a[0]-b[0]);
  g('take', `
    <div class="card" style="left:250px;top:0;width:460px;height:780px;border-radius:48px"><img class="room" style="position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover" alt="">
      <div class="mono rt" style="position:absolute;left:20px;top:20px;color:#fff;background:rgba(0,0,0,.55);padding:6px 12px;border-radius:10px"><span style="color:var(--red)">●</span> <span class="rtt">00:00</span></div></div>
    <div style="position:absolute;left:0;top:850px;width:960px;height:5px;background:rgba(244,245,247,.35)"></div>
    <div class="tick" style="position:absolute;left:0;top:850px;width:0;height:5px;background:var(--paper)"></div>
    ${mk.map(([t,k],i)=>`<div class="dot md" style="left:${pct(t)};top:852px;transform:scale(0)"></div><div class="mono ml" style="position:absolute;left:${pct(t)};top:${i%2?878:792}px;transform:translateX(-50%);color:var(--lamp);opacity:0;font-size:22px">${k}</div>`).join('')}
    `);
  g('folder', `
    <div class="card soft" style="left:0;top:60px;width:960px;height:640px">
      <div class="bar3"><i></i><i></i><i></i><span style="margin-left:12px">Raw videos</span></div>
      <div style="position:absolute;left:40px;top:120px;width:420px;height:360px;border:3px dashed #343947;border-radius:22px"></div>
      <div style="position:absolute;left:500px;top:120px;width:420px;height:360px;border:3px dashed #343947;border-radius:22px"></div></div>
    <div class="card file" style="left:40px;top:180px;width:420px;height:360px;border-radius:22px"><img class="room" style="position:absolute;left:12px;top:12px;width:396px;height:240px;object-fit:cover;object-position:50% 32%;border-radius:12px" alt="">
      <div style="position:absolute;left:22px;top:266px;font:700 34px Geist">First Video.mov</div><div class="mono" style="position:absolute;left:22px;top:312px;font-size:24px">34.3 MB · 1:32</div></div>
    <svg class="cur" viewBox="0 0 24 24" style="position:absolute;left:0;top:0;width:70px;height:70px"><path d="M4 2l16 9.5-7 1.6-3.8 6.4z" fill="#F4F5F7" stroke="#14161B" stroke-width="1.4"/></svg>`);
  g('term', `
    <div class="card soft" style="left:0;top:40px;width:960px;height:760px">
      <div class="bar3"><i></i><i></i><i></i><span style="margin-left:12px">Terminal · Claude Code</span></div>
      <div class="term">${S.term.map((l,i)=>`<div class="tl" style="opacity:0" data-full="${l.replace(/"/g,'&quot;')}"><span class="${i==0?'cmd':l.startsWith('✓')?'ok':''}"></span></div>`).join('')}</div></div>`);
  const nb = S.wave.bars.length, bw = 960/nb - 2;
  const kept = S.wave.bars.map((b,i)=>{const t=i*S.wave.bar_s+S.wave.bar_s/2; return S.wave.kept.some(k=>t>=k[0]-.1&&t<=k[1]+.1);});
  window.WAVE_KW = 960/kept.filter(Boolean).length - 2;
  g('wave', `
    <div class="mono" style="position:absolute;left:0;top:120px">raw audio · ${fmt(R)}</div>
    <div class="cnt" style="position:absolute;right:0;top:90px;font:900 84px Geist;color:var(--lamp);opacity:0">−${Math.round(S.cut_s - S.retake_s)}s</div>
    <div class="wv" style="left:0;top:200px;height:380px;width:960px">${S.wave.bars.map((b,i)=>`<i class="${kept[i]?'k':'p'}" style="width:${bw.toFixed(2)}px;height:${Math.max(12,b*370).toFixed(0)}px"></i>`).join('')}</div>
    <div class="fl" style="position:absolute;left:0;right:0;top:680px;display:flex;gap:18px;justify-content:center">${S.wave.fillers.map(f=>`<span class="pill" style="position:relative;opacity:0">“${f.words.replace(/[.]/g,'').toLowerCase()}” <b style="color:var(--red)">✕</b></span>`).join('')}</div>`);
  g('takes', `
    <div class="card k1" style="left:0;top:20px;width:460px;height:818px"><img class="b-take1" style="position:absolute;width:100%;height:100%;object-fit:cover" alt=""><div class="pill" style="left:20px;top:20px">Take 1</div></div>
    <div class="card k2" style="left:500px;top:20px;width:460px;height:818px"><img class="b-take2" style="position:absolute;width:100%;height:100%;object-fit:cover" alt=""><div class="pill" style="left:20px;top:20px">Take 2</div></div>
    <div class="stamp s1" style="left:155px;top:355px;background:var(--red);color:#fff;transform:scale(0)">✕</div>
    <div class="stamp s2" style="left:655px;top:355px;background:var(--green);color:#0F1014;transform:scale(0)">✓</div>`);
  const tw = S.words.filter(w => w.t >= T.l5 - .1 && w.t < T.picked + 2.0).map(w => w.x.replace(/[.,]/g,''));
  g('capt', `<div class="tw" style="top:0">${S.words.map((w,i)=>`<span data-t="${w.t}">${w.x.replace(/[.,]/g,'')}</span>`).join('')}</div>`);
  g('code', `
    <div class="card soft" style="left:0;top:40px;width:960px;height:780px">
      <div class="bar3"><i></i><i></i><i></i><span style="margin-left:12px">${S.pageName}</span></div>
      <div class="code cs">${S.code}</div></div>`);
  g('vers', `
    <div class="frm f1" style="left:40px;top:40px;width:380px;height:676px"><img class="room" alt=""><div class="pill lbl">9:16 · Reels</div></div>
    <div class="frm f2" style="left:470px;top:40px;width:450px;height:253px"><img class="room" alt=""><div class="pill lbl" style="bottom:auto;top:268px">16:9 · YouTube</div></div>
    <div class="frm f3" style="left:560px;top:400px;width:300px;height:375px"><img class="room" alt=""><div class="pill lbl">4:5 · LinkedIn</div></div>`);
  const pg = Object.entries(S.pages || {});
  g('tools', pg.map(([k,src],i)=>`<div class="gh t${i}" style="left:${[0,300,20,290][i]}px;top:${[0,80,280,300][i]}px;transform:rotate(${[-4,3,-2,4][i]}deg);opacity:0"><img src="${src}" alt=""></div>`).join(''));
  g('cta', `
    <div class="card" style="left:0;top:90px;width:960px;height:540px"><img class="room" style="position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:50% 34%;filter:brightness(.55)" alt="">
      <div style="position:absolute;left:40px;bottom:40px;font:900 76px/0.95 Geist;text-transform:uppercase">The exact<br><span style="color:var(--lamp)">setup</span></div>
      <div style="position:absolute;right:40px;top:40px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center"><svg viewBox="0 0 24 24" width="56" height="56"><path d="M8 5v14l11-7z" fill="#0F1014"/></svg></div></div>
    <div class="mono" style="position:absolute;left:0;right:0;text-align:center;top:670px;color:#C9CED9;font-size:30px">free guide · tools, prompts, the whole pipeline</div>`);
}

/* ---------- titles: type on word by word, one italic serif word ---------- */
const TITLES = [];
function title(a, b, html){ TITLES.push({a, b, html}); }
function setTitle(t){
  const cur = TITLES.find(x => t >= x.a && t < x.b);
  const el = $('#title');
  const key = cur ? cur.a : -1;
  if(el.dataset.k != key){ el.dataset.k = key; el.innerHTML = cur ? cur.html.split(/(<em>.*?<\/em>|<span class="hl">.*?<\/span>|<br>)/).filter(Boolean).flatMap(p => p.startsWith('<') ? [p] : p.trim().split(/\s+/)).map(p => p === '<br>' ? p : `<span class="w">${p}</span>`).join(' ') : ''; }
  if(cur) $$('.w', el).forEach((w,i) => { const k = Math.min(1, Math.max(0, (t - cur.a - i*.075) / .16)); w.style.opacity = k; w.style.filter = `blur(${(1-k)*8}px)`; });
}

function timeline(){
  const w = wt;
  T.edit = w('edit'); T.l2 = snap(w('filmed') - .3); T.mistakes = w('mistakes');
  T.l3 = snap(w('then')); T.drop = w('dropped'); T.give = snap(w('gave')); T.claude1 = w('claude', T.give); T.and = snap(w('and', T.claude1)); T.coffee = w('coffee');
  T.l4 = snap(w('claude', T.coffee)); T.pause = w('pause'); T.um = w('um'); T.line = snap(w('every', w('um') + .1)); T.twice = w('twice');
  T.l5 = snap(w('it', T.twice)); T.capt = w('these'); T.picked = snap(w('picked')); T.zoom = w('zoom');
  T.built = snap(w('and', T.zoom)); T.graphic = w('graphic'); T.seeing = w('seeing');
  T.l6 = snap(w('it', T.seeing)); T.three = w('three', T.l6); T.reels = w('reels'); T.yt = w('youtube'); T.li = w('linkedin');
  T.l7 = snap(w('the', T.li)); T.tools = w('tools'); T.free = w('free'); T.open = w('open'); T.source = w('source');
  T.l8 = snap(w('the', T.source + .2)); T.film = w('film');
  T.l9 = snap(w('comment')); T.edit2 = w('edit', T.l9); T.exact = w('exact'); T.end = S.duration;
  T.inthis = w('in', T.edit);
  SH = [[0,'hook'],[T.inthis - .04,'broll:editor'],[T.l2,'split:take'],[T.l3,'split:folder'],[T.give,'split:term'],[T.and,'broll:latte'],
        [T.l4,'split:wave'],[T.line,'split:takes'],[T.l5,'split:capt'],[T.picked,'full'],[T.built,'split:code'],[T.l6,'split:vers'],
        [T.l7,'split:tools'],[T.l8,'full'],[T.l9,'split:cta']];
  title(T.l2, T.l3, 'One Take, <em>Mistakes</em> And All');
  title(T.l3, T.give, 'Dropped It In A <em>Folder</em>');
  title(T.give, T.and, 'And Gave It To <em>Claude</em>');
  title(T.l4, T.line, 'Claude Cut Every <em>Pause</em>');
  title(T.line, T.l5, 'Every Line I Said <em>Twice</em>');
  title(T.l5, T.picked, 'It Wrote These <em>Captions</em>');
  title(T.built, T.l6, 'Built Every <em>Graphic</em> You See');
  title(T.l6, T.l7, 'It Made Three <em>Versions</em>');
  title(T.l7, T.l8, 'Every Tool Is <em>Free</em>');
  title(T.l9, T.end + 1, 'Comment <em>“EDIT”</em><br><span class="hl">To Get The Setup</span>');

  tl = gsap.timeline({paused:true});
  const on = (id, a, b) => { tl.set(G[id], {opacity:1}, a); tl.set(G[id], {opacity:0}, b); };
  const pop = (sel, t, s='pop') => { tl.fromTo(sel, {scale:.6, opacity:0}, {scale:1, opacity:1, duration:.3, ease:'back.out(1.8)'}, t); if(s) fx(t, s); };
  // hook: giant words land, then a whip to the B-roll
  fx(T.inthis - .5, 'impact-bass-1', .5);  // after the first words, never on them
  tl.fromTo('#giant', {scale:1.25, opacity:0}, {scale:1, opacity:1, duration:.35, ease:'power3.out'}, 0);
  fx(T.inthis - .08, 'whoosh-short');
  // take
  on('take', T.l2, T.l3); fx(T.l2 - .05, 'whoosh-short');
  pop('#g-take .card', T.l2 + .05, null);
  tl.to('#g-take .tick', {width:960, duration:T.l3 - T.l2 - .2, ease:'none'}, T.l2);
  $$('#g-take .md').forEach((d,i) => { tl.to(d, {scale:1, duration:.22, ease:'back.out(3)'}, T.mistakes - .1 + i*.1); if(i<3) fx(T.mistakes - .1 + i*.1, ['click','click-soft','click'][i]); });
  tl.to('#g-take .ml', {opacity:1, duration:.2, stagger:.1}, T.mistakes + .05);
  // folder
  on('folder', T.l3, T.give); fx(T.l3 - .05, 'whoosh-short');
  tl.from('#g-folder .card.soft', {y:60, opacity:0, duration:.3, ease:'power3.out'}, T.l3);
  tl.fromTo('#g-folder .file', {x:620, y:520, rotation:6, opacity:1}, {x:620, y:520, duration:.01}, T.l3);
  tl.fromTo('#g-folder .cur', {x:860, y:680}, {x:860, y:680, duration:.01}, T.l3);
  tl.to('#g-folder .file', {x:0, y:0, rotation:0, duration:.45, ease:'power2.inOut'}, T.drop - .2);
  tl.to('#g-folder .cur', {x:260, y:380, duration:.45, ease:'power2.inOut'}, T.drop - .2); fx(T.drop + .25, 'pop');
  // terminal: real commands and numbers from this run
  on('term', T.give, T.and); fx(T.give - .05, 'whoosh-short'); fx(T.give + .1, 'typing', .8);
  tl.from('#g-term .card', {y:60, opacity:0, duration:.3, ease:'power3.out'}, T.give);
  const lines = $$('#g-term .tl'); const per = Math.min(.2, (T.and - T.give - .45) / lines.length);
  lines.forEach((l,i) => tl.set(l, {opacity:1}, T.give + .2 + i*per));
  // wave
  on('wave', T.l4, T.line); fx(T.l4 - .05, 'whoosh-short');
  tl.from('#g-wave .wv i', {scaleY:0, duration:.3, stagger:.0015, ease:'power2.out'}, T.l4);
  tl.to('#g-wave .wv i.p', {background:'#E7A15A', duration:.12}, T.pause - .3);
  tl.to('#g-wave .wv i.p', {width:0, marginRight:0, opacity:0, duration:.5, ease:'power2.inOut'}, T.pause + .1);
  tl.to('#g-wave .wv i.k', {width:()=>window.WAVE_KW, duration:.5, ease:'power2.inOut'}, T.pause + .1); fx(T.pause + .1, 'whoosh');
  tl.to('#g-wave .cnt', {opacity:1, duration:.2}, T.pause + .3);
  $$('#g-wave .fl .pill').forEach((c,i) => { pop(c, T.um - .15 + i*.12, i%2 ? 'click-soft' : 'click'); });
  // takes: Vish's real first and second take
  on('takes', T.line, T.l5); fx(T.line - .05, 'whoosh-short');
  pop('#g-takes .k1', T.line + .05, 'pop'); pop('#g-takes .k2', T.line + .2, null);
  tl.to('#g-takes .s1', {scale:1, duration:.25, ease:'back.out(2.5)'}, T.twice - .1); fx(T.twice - .1, 'impact-bass-2', .6);
  tl.to('#g-takes .s2', {scale:1, duration:.25, ease:'back.out(2.5)'}, T.twice + .3); fx(T.twice + .3, 'ping');
  tl.to('#g-takes .k1', {opacity:.45, duration:.2}, T.twice);
  // captions: the transcript scrolls word by word
  on('capt', T.l5, T.picked); fx(T.l5 - .05, 'whoosh-short'); fx(T.capt, 'click-soft');
  // zoom: full shot, camera punches in on "zoom"
  tl.fromTo('#focus', {opacity:0, scale:1.3}, {opacity:1, scale:1, duration:.25, ease:'power3.out'}, T.zoom); fx(T.zoom - .08, 'whoosh-cinematic', .8);
  tl.to('#focus', {opacity:0, duration:.15}, T.built - .1);
  // code: the real source of this page
  on('code', T.built, T.l6); fx(T.built - .05, 'whoosh-short'); fx(T.graphic, 'key-press');
  tl.from('#g-code .card', {y:60, opacity:0, duration:.3, ease:'power3.out'}, T.built);
  tl.fromTo('#g-code .cs', {y:0}, {y:-900, duration:T.l6 - T.built, ease:'power1.in'}, T.built);
  // versions
  on('vers', T.l6, T.l7); fx(T.l6 - .05, 'whoosh-short');
  tl.from('#g-vers .frm', {opacity:0, scale:.85, duration:.3, stagger:.07, ease:'power3.out'}, T.three - .2);
  [['.f1',T.reels,'pop'],['.f2',T.yt,'click'],['.f3',T.li,'ping']].forEach(([c,t,s]) => {
    tl.to(`#g-vers ${c}`, {borderStyle:'solid', borderColor:'rgba(244,245,247,.9)', duration:.01}, t - .05);
    tl.to(`#g-vers ${c} img, #g-vers ${c} .lbl`, {opacity:1, duration:.18}, t - .05); fx(t - .05, s); });
  // tools: real README pages pop in on each beat
  on('tools', T.l7, T.l8); fx(T.l7 - .05, 'whoosh-short');
  [T.tools, T.free, T.open, T.source].forEach((t,i) => { tl.fromTo(`#g-tools .t${i}`, {opacity:0, scale:.6}, {opacity:1, scale:1, duration:.28, ease:'back.out(1.7)'}, t - .08); fx(t - .08, i%2 ? 'click' : 'pop');
    tl.to(`#g-tools .t${i} img`, {y:-260, duration:2.4, ease:'none'}, t); });
  // CTA
  on('cta', T.l9, T.end + 1); fx(T.l9 - .05, 'whoosh-short');
  pop('#g-cta .card', T.l9 + .15, 'pop'); fx(T.edit2, 'sparkle', .7);
}

function shotAt(t){ let s = SH[0]; for(const x of SH) if(t >= x[0]) s = x; return s; }

window.setup = async spec => {
  S = spec; build(); timeline(); window.SFX = SFX.sort((a,b)=>a.t-b.t);
  const z = L.zone, k = Math.min(z[2]/960, z[3]/900);
  Object.assign($('#zone').style, {left:(z[0] + (z[2]-960*k)/2)+'px', top:z[1]+'px', transform:`scale(${k})`});
  const b = L.box; Object.assign($('#box').style, {left:b[0]+'px', top:b[1]+'px', width:b[2]+'px', height:b[3]+'px'});
  $('#title').style.top = L.title[0]+'px'; $('#title').style.setProperty('--ts', L.title[1]+'px');
  $('#cap').style.setProperty('--cs', L.cs+'px');
  $('#giant').style.top = L.giantTop+'px'; $('#giant').style.fontSize = L.giantSize+'px';
  await document.fonts.ready; window.READY = true;
};

window.frame = async i => {
  const t = i / S.fps, P = S.person, imgs = [];
  tl.seek(t, false);
  const set = (im, u) => { if(!im.src.endsWith(u)){ im.src = u; imgs.push(im); } };
  const [t0, shot] = shotAt(t);
  const [kind, name] = shot.split(':');
  for(const im of $$('.room')) set(im, `${S.base}/frames/f_${pad(i)}.jpg`);
  for(const id of ['canvas','full','hook','broll']) $('#'+id).style.display = 'none';
  $('#box').style.display = 'none'; $('#zone').style.display = 'none';
  const push = 1 + Math.min(.06, .02 * (t - t0));
  if(kind === 'hook'){
    $('#hook').style.display = 'block';
    const im = $('#hookcut'); set(im, `${S.base}/cut/c_${pad(i)}.webp`);
    const s = (W/1080) * push, y = L.faceFull - s*P.face;
    im.style.transform = `translate(${(W - 1080*s)/2}px,${y}px) scale(${s})`;
  } else if(kind === 'full'){
    $('#full').style.display = 'block';
    let s = (W/1080) * push;
    if(t >= T.zoom - .08 && t < T.built){ const k = ease(Math.min(1, (t - T.zoom + .08)/.3)); s *= 1 + .38*k; }
    const im = $('#fullimg'); im.style.width = '1080px';
    const x = W/2 - s*P.cx, y = L.faceFull - s*P.face;
    im.style.transform = `translate(${x}px,${y}px) scale(${s})`;
    if(t >= T.zoom - .08 && t < T.built){ const fw = 560*s/1.4, fh = 640*s/1.4; Object.assign($('#focus').style, {left:(W/2 - fw/2)+'px', top:(L.faceFull - fh/2 - 30)+'px', width:fw+'px', height:fh+'px'}); }
  } else if(kind === 'broll'){
    $('#broll').style.display = 'block';
    const c = S.broll[name], k = Math.min(c.n - 1, Math.floor((t - t0) * S.fps));
    const im = $('#brollimg'); set(im, `${S.brollBase}/${name}/b_${pad(k)}.jpg`);
    im.style.transform = `scale(${1 + .05*(t - t0)})`;
  } else {
    $('#canvas').style.display = 'block'; $('#zone').style.display = 'block'; $('#box').style.display = 'block';
    const b = L.box, s = b[2]/1080 * 1.02 * push, im = $('#boximg');
    im.style.width = '1080px';
    im.style.transform = `translate(${b[2]/2 - s*P.cx}px,${b[3]*.47 - s*P.face}px) scale(${s})`;
  }
  // live B-roll inside cards
  for(const nm of ['take1','take2']){ const c = S.broll[nm]; if(!c) continue; const k = Math.min(c.n - 1, Math.max(0, Math.floor((t - T.line) * S.fps))); for(const im of $$('.b-'+nm)) set(im, `${S.brollBase}/${nm}/b_${pad(k)}.jpg`); }
  // the raw clip's own timer and progress on the "one take" card
  const st = S.src[Math.min(i, S.src.length-1)]; const rt = $('#g-take .rtt'); if(rt) rt.textContent = fmt(st);
  // terminal typing
  const tls = $$('#g-term .tl'), per = Math.min(.2, (T.and - T.give - .45) / tls.length);
  tls.forEach((l,j) => { const st0 = T.give + .2 + j*per, full = l.dataset.full; const n = Math.max(0, Math.min(full.length, Math.floor((t - st0) / per * full.length * 1.4))); $('span', l).textContent = full.slice(0, n); l.style.opacity = t >= st0 ? 1 : 0; });
  // transcript column follows the spoken word
  const tw = $('#g-capt .tw'); if(tw && t >= T.l5 - .1 && t < T.picked){ const sp = $$('span', tw); let cur = 0; sp.forEach((s,j)=>{ if(+s.dataset.t <= t) cur = j; s.classList.toggle('on', +s.dataset.t <= t && j === cur); }); tw.style.transform = `translateY(${430 - cur*62}px)`; }
  // version frames: mini layouts of the same footage
  for(const [c,w,h] of [['.f1',380,676],['.f2',450,253],['.f3',300,375]]){ const im = $(`#g-vers ${c} img`); if(!im) continue; const s = Math.max(w/1080, h/1920); im.style.width = '1080px'; im.style.transformOrigin = '0 0'; im.style.transform = `translate(${w/2 - s*1.0*P.cx}px,${h*.42 - s*P.face}px) scale(${s})`; }
  // captions: one word at a time
  const capY = L.cap[kind === 'split' ? 'split' : kind] || L.cap.full;
  $('#cap').style.top = capY + 'px';
  const wd = S.words.filter(w => w.t <= t + 2/S.fps).pop();
  const nx = wd ? S.words[S.words.indexOf(wd) + 1] : null;
  const showW = wd && t < (nx ? Math.min(nx.t, wd.e + .45) : wd.e + .45);
  const key = showW ? wd.t : -1;
  if($('#cap').dataset.k != key){ $('#cap').dataset.k = key; $('#cap').innerHTML = showW ? `<span class="cap">${S.keyWords.includes(norm(wd.x)) ? '<em>'+wd.x.replace(/[,]/g,'')+'</em>' : wd.x.replace(/[,]/g,'')}</span>` : ''; }
  setTitle(t);
  await Promise.all(imgs.map(im => im.decode().catch(()=>{})));
};
window.STAGE_LOADED = true;
</script>
</body></html>
