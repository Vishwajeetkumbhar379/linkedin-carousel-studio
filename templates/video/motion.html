<!doctype html>
<html><head><meta charset="utf-8"><title>motion video</title>
<link rel="stylesheet" href="/video/fonts.css">
<style>
/* Motion-graphics template (round 4). Every narration line is a "beat": new background, a transition
   (whip, zoom, click, pop), its own B-roll, and a slow camera push. Pure DOM, so frames render fast and
   every frame is a function of t. Shades: violet (brand), cobalt and peach (support), ink and ivory. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0E0C16;font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#cam{position:absolute;inset:0;transform-origin:50% 45%}
.beat{position:absolute;inset:0;overflow:hidden;visibility:hidden}
.bg{position:absolute;inset:0}
.glow{position:absolute;border-radius:50%}
.content{position:absolute;inset:0;padding:190px 84px 300px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.serif{font-family:Newsreader,Georgia,serif;font-weight:500;letter-spacing:-.022em;line-height:1.04;text-wrap:balance}
.serif em{font-style:italic}
.t1{font-size:118px}.t2{font-size:92px}.t3{font-size:70px}
.kick{font:500 24px 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase;margin-bottom:30px;opacity:.75}
.sub{font-size:36px;line-height:1.38;margin-top:28px;max-width:820px;opacity:.82;text-wrap:balance}
.src{font:400 21px 'Geist Mono',monospace;margin-top:30px;opacity:.6}
.in{opacity:0}
.sprite{position:absolute;filter:drop-shadow(0 30px 40px rgba(20,10,60,.28))}
/* chat B-roll: a generic AI chat window, no real product UI */
.win{width:820px;border-radius:40px;background:rgba(255,255,255,.88);border:1px solid #fff;box-shadow:0 60px 120px -50px rgba(40,20,120,.55),inset 0 1px 0 #fff;padding:30px;text-align:left;color:#1F1C24;position:relative;backdrop-filter:blur(20px)}
.win .bar{display:flex;gap:10px;margin-bottom:24px}.win .bar i{width:14px;height:14px;border-radius:50%;background:#DDD8EE}
.msg{margin-left:auto;max-width:560px;background:#ECEAFB;border-radius:26px 26px 6px 26px;padding:20px 26px;font-size:30px;line-height:1.35;min-height:82px}
.caret{display:inline-block;width:3px;height:1em;background:#4A44C4;vertical-align:-4px;margin-left:2px}
.gen{margin-top:24px;width:430px;height:430px;border-radius:30px;position:relative;overflow:hidden;background:#E9E5FB}
.gen .shim{position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%)}
.gen .art{position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,#FFD8C4,transparent 55%),radial-gradient(circle at 75% 70%,#8FA8FF,transparent 55%),linear-gradient(160deg,#C4BCFF,#4A3FD6);opacity:0}
.gen .art::after{content:"";position:absolute;left:34%;top:30%;width:32%;height:32%;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 20px 40px rgba(30,20,90,.3)}
.ad{position:absolute;right:30px;bottom:40px;width:300px;border-radius:26px;background:#fff;box-shadow:0 30px 60px -20px rgba(40,20,120,.45);padding:18px;opacity:0}
.ad .pic{height:150px;border-radius:18px;background:linear-gradient(150deg,#FFD8C4,#E07A5C)}
.ad b{display:inline-block;margin-top:14px;font:600 18px Geist;letter-spacing:.08em;text-transform:uppercase;background:#1F1C24;color:#fff;border-radius:999px;padding:6px 14px}
.ad span{display:block;margin-top:10px;font-size:22px;color:#4A4458}
.chips{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin-top:34px}
.chip{font:600 40px Geist;border-radius:999px;padding:18px 34px;background:rgba(255,255,255,.9);color:#1F1C24;box-shadow:0 24px 50px -24px rgba(40,20,120,.5)}
.stamp{font:600 30px 'Geist Mono',monospace;letter-spacing:.12em;border:4px solid currentColor;border-radius:18px;padding:14px 28px;margin-bottom:34px}
.big{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:270px;letter-spacing:-.05em;line-height:.9}
.dots{position:absolute;inset:0;opacity:.55}
.bars{display:flex;gap:60px;align-items:flex-end;height:360px;margin-top:40px}
.bars div{width:190px;border-radius:26px 26px 10px 10px;position:relative;transform-origin:bottom}
.bars label{position:absolute;bottom:-56px;left:0;right:0;font:500 24px Geist;opacity:.8}
.vs{display:flex;gap:30px;margin-top:40px}
.vs .card{width:380px;border-radius:34px;padding:26px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(16px)}
.vs .card .pic{height:300px;border-radius:24px}
.vs .card p{font:500 28px Geist;margin-top:20px}
.btn{display:inline-flex;align-items:center;gap:14px;font:600 40px Geist;border-radius:999px;padding:28px 54px;background:#fff;color:#1F1C24;margin-top:46px;box-shadow:0 30px 60px -24px rgba(0,0,0,.5);position:relative}
.cursor{position:absolute;width:96px;z-index:30;filter:drop-shadow(0 14px 18px rgba(20,10,60,.35))}
/* phone feed B-roll: scrolls, lands on the labelled ad, a 3D cursor taps it */
.phone{width:470px;height:820px;border-radius:64px;background:#15121F;padding:16px;box-shadow:0 60px 120px -40px rgba(20,10,60,.6),inset 0 0 0 2px rgba(255,255,255,.08);position:relative}
.screen{width:100%;height:100%;border-radius:50px;overflow:hidden;background:#F4F0E8;position:relative}
.feed{position:absolute;left:0;right:0;top:0;padding:22px 18px;display:flex;flex-direction:column;gap:18px}
.pc{background:#fff;border-radius:26px;padding:14px;box-shadow:0 12px 30px -18px rgba(40,20,90,.35);text-align:left;position:relative}
.pc .ph{display:flex;align-items:center;gap:10px;margin-bottom:12px}.pc .ph i{width:34px;height:34px;border-radius:50%;background:linear-gradient(150deg,#FFD8C4,#E07A5C)}.pc .ph b{height:10px;width:140px;border-radius:6px;background:#2A2540}
.pc .pic{height:300px;border-radius:18px}
.pc .tagad{position:absolute;left:24px;bottom:26px;font:700 18px Geist;letter-spacing:.06em;text-transform:uppercase;background:#F6C453;color:#2A1A05;border-radius:999px;padding:8px 14px;opacity:0}
.badge3d{position:absolute;filter:drop-shadow(0 30px 40px rgba(20,10,60,.3))}
.ripple{position:absolute;width:140px;height:140px;margin:-70px;border-radius:50%;border:4px solid #fff;opacity:0;z-index:29}
/* chrome */
.top{position:absolute;left:84px;right:84px;top:80px;display:flex;justify-content:space-between;align-items:center;z-index:50;transition:none}
.handle{display:flex;align-items:center;gap:16px;font-size:24px;font-weight:600}
.mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(160deg,#9C94F0,#5B4FE0);position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.mark::before{content:"";position:absolute;inset:12px;border:3px solid #fff;border-radius:4px;transform:rotate(45deg)}
.mark::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:#fff}
.handle small{display:block;font-size:19px;font-weight:400;opacity:.7}
.pill{font:500 20px 'Geist Mono',monospace;border-radius:999px;padding:10px 20px;border:1px solid currentColor;opacity:.75}
.cap{position:absolute;left:60px;right:60px;bottom:150px;text-align:center;z-index:50;font:600 44px/1.25 Geist,sans-serif;letter-spacing:-.01em}
.cap span{display:inline-block;margin:0 6px;padding:2px 8px;border-radius:12px}
.prog{position:absolute;left:84px;right:84px;bottom:96px;height:4px;border-radius:4px;z-index:50;background:rgba(127,119,221,.25)}
.prog i{display:block;height:100%;width:0;border-radius:4px;background:#7F77DD}
.grain{position:absolute;inset:0;z-index:60;opacity:.08;mix-blend-mode:overlay;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}

/* avatar actions (round 7): Vish reacts in context */
.av{position:absolute;z-index:40;pointer-events:none}
.av img{display:block;width:100%;filter:drop-shadow(0 26px 34px rgba(20,10,60,.32))}
.av .st{position:absolute;inset:0;overflow:visible}
.av .drop{position:absolute;width:26px;height:38px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:linear-gradient(160deg,#BFE3FF,#5BA8F5);box-shadow:inset -3px -4px 0 rgba(255,255,255,.5)}
.av .zig{position:absolute;font:800 46px Geist;color:#E5484D}
.av .burst{position:absolute;left:50%;top:50%;width:150%;height:150%;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,rgba(246,196,83,.9) 0 6deg,transparent 6deg 30deg);-webkit-mask:radial-gradient(circle,transparent 46%,#000 47%,#000 62%,transparent 63%);mask:radial-gradient(circle,transparent 46%,#000 47%,#000 62%,transparent 63%);z-index:-1}
.av .think{position:absolute;display:flex;gap:10px;background:#fff;border-radius:999px;padding:16px 22px;box-shadow:0 16px 30px -14px rgba(20,10,60,.4)}
.av .think i{width:16px;height:16px;border-radius:50%;background:#5B4FE0}
.av .spark{position:absolute;font:800 40px Geist;color:#F6C453}
.av .ptr{position:absolute;width:120px}

/* clip: a real web page (scripts/screen_record.py) scrolling inside a browser frame */
.browser{width:100%;max-width:900px;height:900px;border-radius:30px;background:#fff;box-shadow:0 60px 120px -40px rgba(20,10,60,.55),0 0 0 1px rgba(0,0,0,.06);overflow:hidden;position:relative;text-align:left}
.browser .bbar{height:62px;background:#F1EEF6;display:flex;align-items:center;gap:10px;padding:0 22px;border-bottom:1px solid #E4E0EC}
.browser .bbar i{width:14px;height:14px;border-radius:50%;background:#E5484D}.browser .bbar i:nth-child(2){background:#F6C453}.browser .bbar i:nth-child(3){background:#3DDC97}
.browser .url{margin-left:18px;flex:1;font:500 22px 'Geist Mono',monospace;color:#4A4458;background:#fff;border-radius:999px;padding:8px 18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.browser .vp{position:absolute;left:0;right:0;top:62px;bottom:0;overflow:hidden}
.browser .vp img{width:100%;display:block;will-change:transform}
.browser .cur{position:absolute;width:84px;z-index:3;filter:drop-shadow(0 10px 14px rgba(20,10,60,.35))}

/* ui: an AI app walkthrough. The cursor clicks the real steps (sidebar item, button), types the prompt, then the result appears */
.ui{width:100%;max-width:920px;height:880px;border-radius:30px;background:#FBFAFE;box-shadow:0 60px 120px -40px rgba(20,10,60,.55),0 0 0 1px rgba(0,0,0,.06);overflow:hidden;position:relative;text-align:left;color:#1F1C24;display:flex}
.ui .side{width:230px;background:#F1EEF6;border-right:1px solid #E4E0EC;padding:26px 16px;display:flex;flex-direction:column;gap:8px}
.ui .app{font:600 24px Geist,sans-serif;display:flex;align-items:center;gap:10px;margin:0 8px 18px}.ui .app i{width:18px;height:18px;border-radius:50%;background:#5B4FE0}
.ui .nav{font:500 22px Geist,sans-serif;padding:12px 14px;border-radius:14px;color:#4A4458}
.ui .main{flex:1;position:relative;padding:30px 30px 0;display:flex;flex-direction:column;gap:16px}
.ui .h{font:600 30px Geist,sans-serif}
.ui .row{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #E4E0EC;border-radius:18px;padding:18px 20px;font:500 24px Geist,sans-serif;opacity:0}
.ui .row b{font:600 20px Geist;background:#5B4FE0;color:#fff;border-radius:999px;padding:8px 18px}
.ui .row.done b{background:#1F9D63}
.ui .hit{box-shadow:0 0 0 4px rgba(91,79,224,.45)!important;background:#ECEAFB!important}
.ui .compose{position:absolute;left:30px;right:30px;bottom:28px;min-height:86px;background:#fff;border:1px solid #DCD6F0;border-radius:22px;padding:22px 24px;font:400 26px/1.35 Geist,sans-serif;color:#1F1C24;box-shadow:0 10px 30px -18px rgba(20,10,60,.35)}
.ui .compose:empty::before{content:"Message";color:#A39DB5}
.ui .reply{background:#fff;border:1px solid #E4E0EC;border-radius:20px;padding:20px 22px;font:400 25px/1.4 Geist,sans-serif;opacity:0}
.ui .site{position:absolute;left:30px;right:30px;top:96px;bottom:140px;border-radius:22px;overflow:hidden;background:linear-gradient(160deg,#16132A,#3F33C9);opacity:0;color:#fff;padding:34px}
.ui .site .sn{display:flex;gap:14px;margin-bottom:40px}.ui .site .sn i{width:70px;height:10px;border-radius:6px;background:rgba(255,255,255,.35)}
.ui .site h4{font:500 46px/1.05 Newsreader,serif;margin:0 0 16px;max-width:60%}.ui .site p{font:400 22px Geist;opacity:.75;max-width:55%;margin:0 0 24px}
.ui .site .cta{display:inline-block;background:#fff;color:#3F33C9;font:600 20px Geist;border-radius:999px;padding:12px 24px}
.ui .orb{position:absolute;right:40px;top:120px;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0,#C4BCFF 18%,#7F77DD 45%,#2A1F8F 80%);box-shadow:0 40px 80px -20px rgba(0,0,0,.6),inset -20px -30px 60px rgba(0,0,0,.35)}
.ui .toast{position:absolute;right:30px;top:24px;background:#1F9D63;color:#fff;font:600 22px Geist;border-radius:999px;padding:12px 22px;opacity:0}
.ui .ucur{position:absolute;width:76px;z-index:5;filter:drop-shadow(0 10px 14px rgba(20,10,60,.35));left:0;top:0}
.ui .urip{position:absolute;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;border:4px solid #5B4FE0;z-index:4;opacity:0}
</style></head><body>
<div id="cam"></div>
<div class="top" id="top"><div class="handle"><div class="mark"></div><div>Vish Kumbhar<small>Build with Vish</small></div></div><div class="pill" id="pill"></div></div>
<div class="cap" id="cap"></div>
<div class="prog"><i id="prog"></i></div>
<div class="grain"></div>
<script>
const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const back = (x) => { x = Math.max(0, Math.min(1, x)); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const T_IN = 0.42;

// Backgrounds: two brand-led shades plus the two round-4 support shades, light and dark.
const BG = {
  ink:    { fg: "#F4F2FA", acc: "#B3A9FF", base: "#0E0C16", glows: [["#4B3FD6", .7, 760, 120], ["#1E3A9E", .55, 260, 1100]] },
  violet: { fg: "#FFFFFF", acc: "#FFD8C4", base: "#3F33C9", glows: [["#7F77DD", .8, 820, 160], ["#241C8F", .8, 200, 1150], ["#B8644A", .25, 900, 1200]] },
  cobalt: { fg: "#FFFFFF", acc: "#FFD8C4", base: "#1F3FB8", glows: [["#5B7CF0", .8, 800, 200], ["#122A7A", .8, 160, 1150]] },
  peach:  { fg: "#2A1A18", acc: "#3F33C9", base: "#F6C9B2", glows: [["#FFE6D8", .9, 820, 160], ["#E9906F", .6, 180, 1150]] },
  ivory:  { fg: "#1F1C24", acc: "#4A44C4", base: "#F4F0E8", glows: [["#DCD6FF", .8, 860, 200], ["#FFDCCB", .7, 160, 1150]] },
};
const em = (s) => s.replace(/\*(.+?)\*/g, "<em>$1</em>");
const sprite = (name, style) => `<img class="sprite in" data-a="float" src="/video/sprites/${name}.png" style="${style}">`;

// B-roll builders: each returns inner HTML; animated elements carry data-a (animation) and data-d (delay).
const LOOK = {
  hook: (b) => `${b.kick ? `<div class="kick in" data-d="0">${b.kick}</div>` : ""}<div class="serif t1 words">${wordSpans(b.title)}</div>${b.sprite ? sprite(b.sprite, b.spriteStyle || "right:40px;bottom:260px;width:300px") : ""}`,
  text: (b) => `${b.kick ? `<div class="kick in" data-d="0">${b.kick}</div>` : ""}<div class="serif ${b.size || "t2"} words">${wordSpans(b.title)}</div>${b.sub ? `<div class="sub in" data-d=".35">${em(b.sub)}</div>` : ""}${b.sprite ? sprite(b.sprite, b.spriteStyle || "right:50px;bottom:250px;width:260px") : ""}${b.badge ? `<img class="badge3d in" data-a="badge" data-d=".15" src="/video/sprites/${b.badge}.png" style="${b.badgeStyle || "left:60px;top:220px;width:230px"}">` : ""}${b.full ? `<img class="badge3d in" data-a="slideR" data-d=".1" src="/video/sprites/vish-3d-full-cut.png" style="${b.fullStyle || "right:30px;bottom:200px;height:760px"}">` : ""}`,
  chat: (b) => `<div class="win in" data-a="rise" data-d="0"><div class="bar"><i></i><i></i><i></i></div>
      <div class="msg" data-type="${b.prompt}" data-d=".2"></div>
      <div class="gen"><div class="art" data-a="reveal" data-d="${b.genAt ?? 1.5}"></div><div class="shim" data-a="shimmer"></div></div>
      ${b.ad ? `<div class="ad" data-a="slidein" data-d="${b.adAt ?? 0.4}"><div class="pic"></div><b>Sponsored</b><span>Ad sits beside your image</span></div>` : ""}</div>
      ${b.sprite ? sprite(b.sprite, b.spriteStyle || "left:30px;bottom:230px;width:230px") : ""}`,
  stamp: (b) => `<div class="stamp in" data-a="slam" data-d="0" style="color:var(--acc)">${b.stamp}</div><div class="serif t2 words">${wordSpans(b.title)}</div>${b.sub ? `<div class="sub in" data-d=".4">${em(b.sub)}</div>` : ""}`,
  chips: (b) => `<div class="serif t2 words">${wordSpans(b.title)}</div><div class="chips">${b.chips.map((c, i) => `<div class="chip in" data-a="pop" data-d="${0.35 + i * 0.22}">${c}</div>`).join("")}</div>${b.sprite ? sprite(b.sprite, b.spriteStyle || "right:60px;bottom:240px;width:220px") : ""}`,
  versus: (b) => `<div class="serif t3 words">${wordSpans(b.title)}</div><div class="vs">
      <div class="card in" data-a="rise" data-d=".25"><div class="pic" style="background:linear-gradient(160deg,#C4BCFF,#4A3FD6)"></div><p>${b.left}</p></div>
      <div class="card in" data-a="rise" data-d=".5"><div class="pic" style="background:linear-gradient(150deg,#FFD8C4,#E07A5C)"></div><p>${b.right}</p></div></div>`,
  stat: (b) => `<canvas class="dots" width="1080" height="1350" data-dots="${b.dots || 0}"></canvas><div class="big" data-count="${b.value}" style="color:var(--acc)">${b.value}</div><div class="serif t3 words" style="margin-top:20px">${wordSpans(b.title)}</div>${b.src ? `<div class="src in" data-d=".6">${b.src}</div>` : ""}`,
  bars: (b) => `<div class="serif t3 words">${wordSpans(b.title)}</div><div class="bars">${b.bars.map((x, i) => `<div data-a="grow" data-d="${0.3 + i * 0.25}" style="height:${x.h}%;background:${x.c}"><label>${x.label}</label></div>`).join("")}</div>${b.src ? `<div class="src in" data-d=".9" style="margin-top:80px">${b.src}</div>` : ""}`,
  ui: (b) => { const st = b.steps || [], nav = b.nav || ["New chat", "Projects", "Connectors", "Settings"];
      const rows = st.filter((x) => x.click && !nav.includes(x.click)).map((x) => x.click);
      return `${b.title ? `<div class="serif t3 words" style="margin-bottom:22px">${wordSpans(b.title)}</div>` : ""}<div class="ui in" data-a="uiwalk" data-d="0" data-steps='${JSON.stringify(st).replace(/'/g, "&#39;")}'>
      <div class="side"><div class="app"><i></i>${b.app || "AI assistant"}</div>${nav.map((n) => `<div class="nav" data-k="${n}">${n}</div>`).join("")}</div>
      <div class="main"><div class="h">${b.screen || ""}</div>${rows.map((r) => `<div class="row" data-k="${r}">${r}<b>${b.button || "Add"}</b></div>`).join("")}
      ${st.some((x) => x.result === "reply") ? `<div class="reply" data-r="reply">${b.reply || ""}</div>` : ""}
      ${st.some((x) => x.result === "site") ? `<div class="site" data-r="site"><div class="sn"><i></i><i></i><i></i></div><h4>${b.siteTitle || "Your new site"}</h4><p>${b.siteSub || "Built from one prompt"}</p><span class="cta">${b.siteCta || "Get started"}</span><div class="orb"></div></div>` : ""}
      <div class="toast" data-r="connected">✓ ${b.toast || "Connected"}</div>
      <div class="compose" data-k="__compose"></div></div>
      <img class="ucur" src="/video/sprites/cursor-3d.png"><div class="urip"></div></div>`; },
  cta: (b) => `<div class="serif t2 words">${wordSpans(b.title)}</div><div class="btn in" data-a="pop" data-d=".35" id="btn${b.i}">${b.button}</div>
      <img class="cursor" data-a="cursor" data-d=".5" src="/video/sprites/cursor-3d.png"><div class="ripple" data-a="ripple" data-d="1.05"></div>
      ${b.sprite ? sprite(b.sprite, b.spriteStyle || "left:60px;bottom:250px;width:240px") : ""}${b.badge ? `<img class="badge3d in" data-a="badge" data-d=".1" src="/video/sprites/${b.badge}.png" style="${b.badgeStyle || "left:70px;top:230px;width:220px"}">` : ""}`,
  clip: (b) => `${b.title ? `<div class="serif t3 words" style="margin-bottom:26px">${wordSpans(b.title)}</div>` : ""}<div class="browser in" data-a="rise" data-d="0"><div class="bbar"><i></i><i></i><i></i><div class="url">${(b.clip && b.clip.url || "").replace(/^https?:\/\//, "")}</div></div>

// Avatar actions: beat.avatar = surprised | smirk | laugh | stressed | point | thinking.

function animateAvatar(root, lt) {

  else if (a === "wave") { const kk = back(clamp(x / 0.6)); tf = `translateX(${(av.style.left ? -1 : 1) * (1 - kk) * 420}px)`; const seq = x < 0.5 ? 0 : x < 0.75 ? 1 : 2 + (Math.floor((x - 0.75) / 0.18) % 3); av.querySelectorAll("img").forEach((im) => (im.style.opacity = +im.dataset.k === seq ? 1 : 0)); }
  else if (a === "stressed") tf = `scale(${0.4 + 0.6 * k}) translateX(${Math.sin(lt * 38) * 5 * clamp(x / 0.3)}px) rotate(${Math.sin(lt * 21) * 2}deg)`;
  else if (a === "laugh") tf = `scale(${0.4 + 0.6 * k}) translateY(${-Math.abs(Math.sin(lt * 9)) * 16}px) rotate(${Math.sin(lt * 9) * 3}deg)`;
  else if (a === "surprised") tf = `scale(${(0.4 + 0.6 * k) * (1 + 0.06 * Math.exp(-lt * 3) * Math.sin(lt * 20))}) rotate(${(1 - k) * -18}deg)`;
  else if (a === "thinking") { tf = `scale(${0.4 + 0.6 * k}) rotate(${Math.sin(lt * 1.4) * 4}deg)`; av.querySelectorAll(".think i").forEach((d, j) => (d.style.transform = `translateY(${Math.sin(lt * 7 - j) * 6}px)`)); }
  else tf = `scale(${0.4 + 0.6 * k}) rotate(${-6 + Math.sin(lt * 1.6) * 3}deg)`;
  av.style.transform = tf;
  const burst = av.querySelector(".burst"); if (burst) burst.style.transform = `translate(-50%,-50%) rotate(${lt * 40}deg) scale(${0.8 + 0.2 * k})`;

let W_COUNT = 0;
function wordSpans(t) { let on = false; return t.split(" ").map((w) => { if (w.startsWith("*")) on = true; const inner = w.replace(/\*/g, ""); const out = `<span class="w" style="display:inline-block">${on ? `<em style="color:var(--acc)">${inner}</em>` : inner}</span>`; if (/\*[.,!?]?$/.test(w)) on = false; return out; }).join(" "); }

let D, beats = [], words = [];
window.setup = async (spec) => {
  D = spec;
  const cam = document.getElementById("cam");
  cam.innerHTML = spec.beats.map((b, i) => {
    const c = BG[b.bg || "ink"];
    const glows = c.glows.map(([col, a, x, y]) => `<div class="glow" data-gx="${x}" data-gy="${y}" style="left:${x - 450}px;top:${y - 450}px;width:900px;height:900px;background:radial-gradient(circle,${col},transparent 66%);opacity:${a}"></div>`).join("");
    return `<div class="beat" id="b${i}" style="--acc:${c.acc};color:${c.fg}"><div class="bg" style="background:${c.base}">${glows}</div><div class="content" style="${["point", "explaining", "thumbs", "crossed", "thinkingbody", "pointup", "wave"].includes(b.avatar) ? ((b.avSide || (i % 2 ? "left" : "right")) === "left" ? "padding-left:330px;padding-right:60px" : "padding-right:330px;padding-left:60px") : ""}">${LOOK[b.look || "text"]({ ...b, i })}</div>${avatarHTML(b, i)}</div>`;
  }).join("");
  document.getElementById("pill").textContent = spec.tag || "AI x Marketing";
  beats = spec.beats.map((b, i) => ({ b, el: document.getElementById("b" + i), anim: [...document.querySelectorAll(`#b${i} [data-a], #b${i} .in`)], words: [...document.querySelectorAll(`#b${i} .w`)] }));

  document.querySelectorAll("canvas.dots").forEach((cv) => {
    const n = +cv.dataset.dots; if (!n) return; const g = cv.getContext("2d"); let r = 7; const rnd = () => ((r = (r * 9301 + 49297) % 233280) / 233280);
    cv._pts = Array.from({ length: n }, () => [rnd() * 1080, rnd() * 1350, 2 + rnd() * 4, rnd()]); cv._g = g;
  });

};


// ui walkthrough: steps share the beat evenly; the cursor glides to each target, presses, and the screen reacts.
function uiOffset(node, root) { let x = 0, y = 0; while (node && node !== root) { x += node.offsetLeft; y += node.offsetTop; node = node.offsetParent; } return [x, y]; }
function uiWalk(root, x, beatDur) {
  const k0 = ease(clamp(x / 0.6)); root.style.opacity = k0; root.style.transform = `translateY(${(1 - k0) * 100}px)`;
  const st = JSON.parse(root.dataset.steps || "[]"); if (!st.length) return;
  const span = Math.max(1.6, beatDur - 0.9), slot = span / st.length, t0 = 0.45;
  const cur = root.querySelector(".ucur"), rip = root.querySelector(".urip"), comp = root.querySelector(".compose");
  root.querySelectorAll(".row").forEach((r, i) => { r.style.opacity = clamp((x - 0.3 - i * 0.12) / 0.3); });
  root.querySelectorAll(".hit").forEach((n) => n.classList.remove("hit"));
  let px = root.offsetWidth * 0.7, py = root.offsetHeight * 0.85, typed = "";
  st.forEach((s, i) => {
    const a = t0 + i * slot, lx = x - a; if (lx < 0) return;
    const tgt = s.type ? comp : s.click ? root.querySelector(`[data-k="${s.click}"]`) : null;
    if (tgt) {
      const [ox, oy] = uiOffset(tgt, root), tx = ox + Math.min(tgt.offsetWidth * 0.6, 160), ty = oy + tgt.offsetHeight * 0.55;
      const m = ease(clamp(lx / 0.45)); px = px + (tx - px) * m; py = py + (ty - py) * m;
      if (lx > 0.5) { tgt.classList.add("hit"); if (s.click && tgt.classList.contains("row") && st.some((q) => q.result === "connected")) tgt.classList.add("done"); }
      const pr = clamp((lx - 0.45) / 0.5); rip.style.left = tx + "px"; rip.style.top = ty + "px"; rip.style.opacity = lx > 0.45 && pr < 1 ? 1 - pr : (rip.style.opacity || 0) * 0; rip.style.transform = `scale(${0.3 + pr * 1.4})`;
      cur.style.transform = `scale(${1 - 0.16 * clamp(1 - Math.abs(lx - 0.5) / 0.12)})`;
    }
    if (s.type) typed = s.type.slice(0, Math.floor(clamp((lx - 0.5) / Math.max(0.8, slot - 0.8)) * s.type.length));
    if (s.result) { const r = root.querySelector(`[data-r="${s.result}"]`); if (r) { const q = back(clamp(lx / 0.6)); r.style.opacity = clamp(lx / 0.25); r.style.transform = `translateY(${(1 - q) * 40}px) scale(${0.94 + 0.06 * q})`; } }
  });
  comp.innerHTML = typed + (typed && Math.floor(x * 2) % 2 ? '<span class="caret"></span>' : "");
  const orb = root.querySelector(".orb"); if (orb) orb.style.transform = `translateY(${Math.sin(x * 2) * 10}px) rotate(${x * 20}deg)`;
  cur.style.left = px + "px"; cur.style.top = py + "px"; cur.style.opacity = clamp((x - 0.3) / 0.2);
}
function animate(el, lt, beatDur) {
  const d = parseFloat(el.dataset.d || 0), a = el.dataset.a || "fade", x = lt - d;
  if (a === "fade" || el.classList.contains("in") && !el.dataset.a) { const k = ease(clamp(x / 0.5)); el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * 30}px)`; return; }
  if (a === "rise") { const k = ease(clamp(x / 0.6)); el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * 120}px) scale(${0.94 + 0.06 * k})`; return; }
  if (a === "pop") { const k = back(clamp(x / 0.45)); el.style.opacity = clamp(x / 0.15); el.style.transform = `scale(${0.4 + 0.6 * k})`; return; }
  if (a === "slam") { const k = clamp(x / 0.28); el.style.opacity = k; el.style.transform = `scale(${2.4 - 1.4 * ease(k)}) rotate(${-8 * (1 - k)}deg)`; return; }
  if (a === "float") { const k = back(clamp(x / 0.6)); el.style.opacity = clamp(x / 0.2); el.style.transform = `perspective(900px) translateY(${(1 - k) * 160 + Math.sin(lt * 2.2) * 10}px) rotateY(${Math.sin(lt * 1.1) * 12}deg) rotate(${Math.sin(lt * 1.3) * 2}deg) scale(${0.7 + 0.3 * k})`; return; }
  if (a === "slideR") { const k = back(clamp(x / 0.7)); el.style.opacity = clamp(x / 0.2); el.style.transform = `translateX(${(1 - k) * 520}px) rotate(${(1 - k) * 6 + Math.sin(lt * 1.4) * 1.2}deg)`; return; }
  if (a === "badge") { const k = back(clamp(x / 0.5)); el.style.opacity = clamp(x / 0.15); el.style.transform = `perspective(900px) scale(${0.3 + 0.7 * k}) rotate(${(1 - k) * -25 + Math.sin(lt * 1.6) * 3}deg) rotateY(${Math.sin(lt * 1.2) * 10}deg)`; return; }
  if (a === "uiwalk") { uiWalk(el, x, beatDur); }
  if (a === "pagescroll") { const k = ease(clamp(x / Math.max(1.2, beatDur - 0.6))); el.style.transform = `translateY(${-k * (+el.dataset.to)}px)`; return; }
  if (a === "cursorwander") { el.style.opacity = clamp(x / 0.2); el.style.left = (520 + Math.sin(lt * 0.9) * 180) + "px"; el.style.top = (380 + Math.cos(lt * 0.7) * 160) + "px"; return; }
  if (a === "scroll") { const k = back(clamp(x / 0.85)); el.style.transform = `translateY(${-k * (+el.dataset.to)}px)`; return; }
  if (a === "adpop") { const k = back(clamp(x / 0.35)); el.style.opacity = clamp(x / 0.1); el.style.transform = `scale(${0.4 + 0.6 * k})`; return; }
  if (a === "tap") { const k = ease(clamp(x / 0.5)); const press = clamp(1 - Math.abs(x - 0.6) / 0.12); el.style.opacity = clamp(x / 0.15); el.style.transform = `translate(${(1 - k) * 240}px,${(1 - k) * 280}px) scale(${1 - 0.15 * press}) rotate(${(1 - k) * 12}deg)`; return; }
  if (a === "reveal") { el.style.opacity = ease(clamp(x / 0.7)); el.style.filter = `blur(${(1 - ease(clamp(x / 0.7))) * 30}px)`; return; }
  if (a === "shimmer") { el.style.transform = `translateX(${((lt * 0.9) % 1.4 - 0.7) * 200}%)`; el.style.opacity = 1 - ease(clamp((lt - 1.5) / 0.5)); return; }
  if (a === "slidein") { const k = back(clamp(x / 0.55)); el.style.opacity = clamp(x / 0.2); el.style.transform = `translateX(${(1 - k) * 420}px) rotate(${(1 - k) * 8}deg)`; return; }
  if (a === "grow") { const k = back(clamp(x / 0.7)); el.style.transform = `scaleY(${k})`; return; }
  if (a === "cursor") { const btn = el.parentElement.querySelector(".btn"); const r = btn.getBoundingClientRect(); const k = ease(clamp(x / 0.55)); const tx = r.left + r.width * 0.62, ty = r.top + r.height * 0.55; el.style.opacity = clamp(x / 0.15); el.style.left = (tx + (1 - k) * 260) + "px"; el.style.top = (ty + (1 - k) * 300) + "px"; const press = clamp(1 - Math.abs(x - 0.6) / 0.12); el.style.transform = `scale(${1 - 0.18 * press})`; btn.style.transform = `scale(${1 - 0.06 * press})`; return; }
  if (a === "ripple") { const btn = el.parentElement.querySelector(".btn"); const r = btn.getBoundingClientRect(); el.style.left = (r.left + r.width * 0.62) + "px"; el.style.top = (r.top + r.height * 0.55) + "px"; const k = clamp(x / 0.6); el.style.opacity = x > 0 ? 1 - k : 0; el.style.transform = `scale(${0.2 + k * 1.6})`; return; }
}

window.frame = (t) => {
  const n = beats.length;
  let cur = 0;
  beats.forEach((B, i) => { if (t >= B.b.at - T_IN) cur = i; });
  beats.forEach((B, i) => {
    const b = B.b, el = B.el;
    const next = beats[i + 1] ? beats[i + 1].b.at - T_IN : D.duration;
    const end = next + T_IN + 0.05;
    const vis = (i === cur || (i === cur - 1 && t < beats[cur].b.at + 0.05)) && t >= b.at - T_IN - 0.01 && t < end;
    el.style.visibility = vis ? "visible" : "hidden";
    if (!vis) return;
    const lt = t - b.at; // local time; transition runs over [-T_IN, 0]
    const p = ease(clamp((lt + T_IN) / T_IN));
    el.style.zIndex = i;
    const tr = i === 0 ? "none" : b.trans || "whip";
    el.style.clipPath = "none"; el.style.filter = "none"; el.style.opacity = 1;
    let tf = "";
    if (tr === "whip") { tf = `translateX(${(1 - p) * 100}%)`; el.style.filter = `blur(${(1 - p) * 26}px)`; }
    else if (tr === "zoom") { tf = `scale(${1 + (1 - p) * 0.9})`; el.style.opacity = p; }
    else if (tr === "out") { tf = `scale(${0.6 + 0.4 * p})`; el.style.opacity = clamp(p * 1.5); }
    else if (tr === "pop") { tf = `scale(${0.82 + 0.18 * back(clamp((lt + T_IN) / T_IN))})`; el.style.opacity = clamp(p * 2); }
    else if (tr === "click") { const [cx, cy] = b.from || [540, 700]; el.style.clipPath = `circle(${p * 1800}px at ${cx}px ${cy}px)`; }
    else if (tr === "rise") { tf = `translateY(${(1 - p) * 100}%)`; el.style.filter = `blur(${(1 - p) * 20}px)`; }
    // camera: punch on entry, then a slow push for the rest of the beat
    const dur = Math.max(0.5, next - b.at);
    const punch = (1 - ease(clamp(lt / 0.5))) * 0.035 * (lt > 0 ? 1 : 0);
    const push = 1 + 0.045 * clamp(lt / dur) + punch;
    el.style.transform = `${tf} scale(${push})`;
    el.querySelectorAll(".glow").forEach((g, k) => { g.style.transform = `translate(${Math.sin(t * 0.3 + k) * 60}px,${Math.cos(t * 0.25 + k) * 50}px)`; });
    // words: blur-rise stagger
    B.words.forEach((w, k) => { const a = ease(clamp((lt - k * 0.05) / 0.45)); w.style.opacity = a; w.style.transform = `translateY(${(1 - a) * 0.45}em)`; w.style.filter = `blur(${(1 - a) * 10}px)`; });

    el.querySelectorAll(".msg[data-type]").forEach((m) => { const s = m.dataset.type, k = Math.floor(clamp((lt - parseFloat(m.dataset.d)) / 1.1) * s.length); m.innerHTML = s.slice(0, k) + (k < s.length || Math.floor(lt * 2) % 2 ? '<span class="caret"></span>' : ""); });
    el.querySelectorAll("[data-count]").forEach((c) => { const v = c.dataset.count, m = v.match(/^([^\d]*)([\d.]+)(.*)$/); if (!m) return; const k = ease(clamp(lt / 1.1)); const num = parseFloat(m[2]) * k; const dec = (m[2].split(".")[1] || "").length; c.textContent = m[1] + num.toFixed(dec) + m[3]; c.style.transform = `scale(${0.85 + 0.15 * back(clamp(lt / 0.5))})`; });
    el.querySelectorAll("canvas.dots").forEach((cv) => { if (!cv._pts) return; const g = cv._g; g.clearRect(0, 0, 1080, 1350); const k = clamp(lt / 1.4); const col = getComputedStyle(el).getPropertyValue("--acc"); g.fillStyle = col; cv._pts.forEach(([x, y, r, s], j) => { if (s < k) { g.globalAlpha = 0.25 + 0.5 * clamp((k - s) * 5); g.beginPath(); g.arc(x, y + Math.sin(t + j) * 4, r, 0, 7); g.fill(); } }); });
  });
  // chrome colour follows the current background
  const fg = BG[beats[cur].b.bg || "ink"].fg;
  document.getElementById("top").style.color = fg;
  // karaoke caption: the current line, current word lit
  const cap = document.getElementById("cap"), B = beats.find((x) => t >= x.b.at - 0.05 && t < x.b.until + 0.05);
  if (B && B.b.say) {
    const ws = B.b.say.split(" "), total = ws.reduce((s, w) => s + w.length + 1, 0), span = B.b.until - B.b.at;
    let acc = 0;
    cap.innerHTML = ws.map((w) => { const s = B.b.at + (acc / total) * span; acc += w.length + 1; const lit = t >= s; const dark = ["ivory", "peach"].includes(B.b.bg); return `<span style="color:${lit ? (dark ? "#1F1C24" : "#fff") : dark ? "rgba(31,28,36,.35)" : "rgba(255,255,255,.4)"};background:${t >= s && t < B.b.at + (acc / total) * span ? (dark ? "rgba(255,255,255,.75)" : "rgba(127,119,221,.55)") : "transparent"}">${w}</span>`; }).join(" ");
  } else cap.innerHTML = "";
  document.getElementById("prog").style.width = (t / D.duration) * 100 + "%";
  return true;
};
window.STAGE_LOADED = true;
