<!doctype html><html><head><meta charset="utf-8"><style>
/* Series reel ("Nobody Tells You"): the canvas reel (one paper canvas, a camera that lands on each card on its word) with
   Vish's mascot as the presenter (the real 3D PNGs in brand/avatar/pack, posed per beat, never redrawn), plus real screen
   recordings, maps, photos, code and dialogs. scripts/canvas_reel.py resolves every spoken phrase to a time. */
@font-face{font-family:IT;font-weight:700;src:url(__FONTS__/inter-tight-latin-700-normal.woff2)}
@font-face{font-family:IT;font-weight:500;src:url(__FONTS__/inter-tight-latin-500-normal.woff2)}
@font-face{font-family:IS;src:url(__FONTS__/instrument-serif-latin-400-normal.woff2)}
@font-face{font-family:IS;font-style:italic;src:url(__FONTS__/instrument-serif-latin-400-italic.woff2)}
@font-face{font-family:GM;src:url(__FONTS__/geist-mono-latin-500-normal.woff2)}
:root{--paper:#F1ECE3;--ink:#15130F;--muted:#8A8172;--amber:#E7A15A;--red:#D9473A;--green:#2F6B3F;--card:#FFFDF8;--line:#E4DDD0;--night:#14161B}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
#world{position:absolute;left:0;top:0;width:2160px;height:16000px;transform-origin:0 0;
background-image:linear-gradient(rgba(21,19,15,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(21,19,15,.06) 1px,transparent 1px);background-size:60px 60px}
.el{position:absolute;font-family:IT;color:var(--ink)}
.card{background:var(--card);border-radius:28px;box-shadow:0 30px 60px rgba(21,19,15,.16),0 4px 10px rgba(21,19,15,.08);padding:44px 48px;box-sizing:border-box}
.lbl{font:700 27px IT;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ttl{font:700 76px/1.06 IT;margin-top:16px}
.sub{font:700 40px/1.25 IT;color:var(--muted);margin-top:14px}
.num{font:700 128px/1 IT;font-variant-numeric:tabular-nums;margin-top:20px;white-space:nowrap}
.row{display:flex;gap:22px;align-items:center}
.ic{flex:none;width:112px;height:112px;border-radius:24px;background:var(--amber);display:grid;place-items:center;font:700 60px IT;color:var(--ink)}
.chip{background:var(--ink);color:var(--paper);font:700 34px IT;padding:14px 28px;border-radius:999px;white-space:nowrap}
.stamp{border:6px solid var(--red);color:var(--red);font:700 46px IT;letter-spacing:.08em;padding:4px 20px;border-radius:14px;background:rgba(255,253,248,.7);white-space:nowrap}
.seg{display:inline-block;height:40px;border-radius:10px;background:var(--line);margin-right:12px;overflow:hidden}
.seg i{display:block;height:100%;width:0;background:var(--ink)}
.li{display:flex;gap:20px;align-items:center;font:700 50px/1.2 IT;padding:18px 0;border-top:2px solid var(--line)}
.li:first-of-type{border-top:0}
.ck{flex:none;width:52px;height:52px;border-radius:50%;border:4px solid var(--line);display:grid;place-items:center;font:700 32px IT;color:var(--card)}
.ck.on{background:var(--ink);border-color:var(--ink)}
.ck.x.on{background:var(--red);border-color:var(--red)}
.quote{font:400 150px/1.02 IS;text-align:center;width:max-content;max-width:1000px}
.quote i{color:var(--red)}
.tag{display:inline-block;background:var(--card);border-radius:999px;padding:16px 32px;margin:12px;font:700 52px IT;box-shadow:0 12px 24px rgba(21,19,15,.12)}
/* screen recordings: a browser or phone frame with the real page inside, scrolled and clicked on the words */
.shot{background:#0E0F13;border-radius:30px;overflow:hidden;box-shadow:0 40px 80px rgba(21,19,15,.28)}
.shot .bar{height:66px;background:#1E2128;display:flex;align-items:center;gap:12px;padding:0 24px}
.shot .bar i{width:16px;height:16px;border-radius:50%;background:#3A3F4B;flex:none}
.shot .bar span{flex:1;text-align:center;background:#2A2E37;border-radius:12px;padding:9px 0;margin:0 30px 0 18px;font:500 24px GM;color:#C9CDD6}
.shot.phone{border-radius:76px;padding:22px}
.shot.phone .vp{border-radius:56px}
.shot.photo{background:var(--card);padding:18px 18px 0;border-radius:14px}
.shot.photo .cap{font:400 46px IS;font-style:italic;text-align:center;padding:12px 0 16px}
.vp{position:relative;overflow:hidden;background:#fff}
.vp>img{position:absolute;left:0;top:0;width:100%;will-change:transform}
.cur{position:absolute;left:0;top:0;width:46px;z-index:3;opacity:0;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.rip{position:absolute;width:100px;height:100px;border-radius:50%;border:7px solid var(--amber);margin:-50px 0 0 -50px;opacity:0;z-index:2}
.credit{font:500 18px GM;color:var(--muted);margin-top:10px}
.code{background:var(--night);color:#D6D9E0;border-radius:28px;padding:30px 36px;box-sizing:border-box;overflow:hidden;box-shadow:0 40px 80px rgba(21,19,15,.28)}
.code .cl{font:500 25px/1.6 GM;white-space:pre}
.code .cl div.hl{background:rgba(231,161,90,.22);border-radius:6px}
.code .k{color:#E7A15A}.code .s{color:#8FC48C}.code .c{color:#6E7584}
.wave{display:flex;align-items:center;gap:9px;height:200px;margin-top:22px}
.wave i{flex:1;border-radius:6px;background:var(--amber);height:10%}
.dlg{width:660px;background:rgba(250,248,244,.98);border-radius:38px;text-align:center;overflow:hidden;box-shadow:0 40px 80px rgba(21,19,15,.25)}
.dlg h3{font:700 42px IT;margin:44px 34px 12px}.dlg p{font:500 32px/1.35 IT;color:#6B665D;margin:0 44px 34px}
.dlg .b{display:flex;border-top:2px solid #DDD7CC}.dlg .b div{flex:1;padding:28px 10px;font:700 36px IT;color:#2F6FE0}.dlg .b div+div{border-left:2px solid #DDD7CC}
.dlg .b .red{color:var(--red)}.dlg .b .on{background:#E6E0D6}
.doc .dl{position:relative;font:700 42px/1.3 IT;padding:16px 0;border-top:2px solid var(--line)}
.doc .dl:first-of-type{border-top:0}
.doc .dl s{position:absolute;left:0;top:50%;height:7px;width:0;background:var(--red);border-radius:4px;text-decoration:none}
.doc .dl em{display:block;font:400 50px/1.1 IS;font-style:italic;color:var(--red);opacity:0}
/* the presenter, the reaction bubble, the series bug, the progress line */
#mas{position:absolute;right:-40px;bottom:-30px;width:540px;height:810px;z-index:5;transform-origin:50% 100%}
#mas img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0}
#mas img.on{opacity:1}
#mas:after{content:"";position:absolute;left:18%;right:18%;bottom:22px;height:26px;border-radius:50%;background:rgba(21,19,15,.18);filter:blur(8px);z-index:-1}
#react{position:absolute;left:600px;top:880px;width:300px;height:300px;border-radius:50%;background:var(--card);overflow:hidden;z-index:6;border:9px solid var(--amber);box-shadow:0 20px 40px rgba(21,19,15,.25);opacity:0}
#react img{width:100%;height:100%;object-fit:cover}
#bug{position:absolute;left:44px;top:62px;z-index:7;font:700 26px IT;letter-spacing:.12em;background:var(--ink);color:var(--paper);padding:13px 24px;border-radius:999px}
#bug b{color:var(--amber)}
#prog{position:absolute;left:0;top:0;height:10px;width:0;background:var(--amber);z-index:7}
#hook{position:absolute;left:56px;right:56px;top:190px;text-align:center;font:400 112px/1.02 IS;color:var(--ink);z-index:4}
#hook i{color:var(--red)}
#cap{position:absolute;left:44px;width:600px;top:1500px;z-index:6}
#cap span{display:inline;background:var(--amber);color:var(--ink);font:700 58px/1.32 IT;padding:6px 18px;border-radius:14px;-webkit-box-decoration-break:clone;box-decoration-break:clone;box-shadow:0 10px 24px rgba(21,19,15,.18)}
</style></head><body>
<div id="world"></div><div id="hook"></div><div id="bug"></div><div id="prog"></div>
<div id="mas"></div><div id="react"></div><div id="cap"><span id="capt"></span></div>
<script>
const D = __DATA__;  // {words, chunks, hook, hookEnd, end, ep, series, root, mascot:[[t,pose]], react:[[t,expr,dur]], els:[{type, at, ...}]}
const R = D.root, src = (s) => `${R}/${s}`;
const cl = (x) => Math.max(0, Math.min(1, x)), eo = (x) => 1 - Math.pow(1 - cl(x), 3);
const eio = (x) => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };

  if (i === keys.length - 1) return f(keys[i], keys[i], 1); const k = eio((t - keys[i + 1][0] + 0.6) / 0.6); return f(keys[i], keys[i + 1], k); };
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const PK = "brand/avatar/pack/";
const POSE = {point_left: "03_gestures/01_point_screen_left.png", point_up: "03_gestures/03_point_up.png", explain: "03_gestures/05_explaining.png",
  think: "03_gestures/06_thinking.png", arms: "03_gestures/07_arms_crossed.png", thumbs: "03_gestures/08_thumbs_up.png", front: "01_angles/01_front.png",
  rest: "04_wave_keyframes/01_rest.png", w1: "04_wave_keyframes/03_wave_center.png", w2: "04_wave_keyframes/04_wave_out.png", w3: "04_wave_keyframes/05_wave_in.png",
  side: "01_angles/08_front_facing_screen_left.png"};
const EXPR = {smile: "01_confident_smile.png", laugh: "02_laughing.png", thought: "03_thoughtful.png", surprised: "04_surprised.png", skeptical: "05_skeptical.png",
  focused: "06_focused.png", concerned: "07_concerned.png", pleased: "08_pleased.png", wink: "09_winking.png"};
const W = document.getElementById("world"), M = document.getElementById("mas"), MI = {};
Object.entries(POSE).forEach(([k, f]) => { const im = document.createElement("img"); im.src = src(PK + f); M.appendChild(im); MI[k] = im; });
const RX = {}, RE = document.getElementById("react"); Object.entries(EXPR).forEach(([k, f]) => { const im = document.createElement("img"); im.src = src(PK + "02_expressions/" + f); im.style.display = "none"; RE.appendChild(im); RX[k] = im; });
document.getElementById("bug").innerHTML = `${esc(D.series)} · <b>EP ${D.ep}</b>`;
const CUR = `<svg class="cur" viewBox="0 0 24 24"><path d="M3 2l17 9.5-7.2 1.7L9.6 20z" fill="#15130F" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg><i class="rip"></i>`;
const html = (e) => {
  const lbl = e.label ? `<div class="lbl" style="${e.labelColor ? `color:${e.labelColor}` : ""}">${e.label}</div>` : "";
  const body = {
    card: () => `${lbl}${e.title ? `<div class="ttl">${e.title}</div>` : ""}${e.sub ? `<div class="sub">${e.sub}</div>` : ""}`,
    counter: () => `${lbl}<div class="num"><span class="n">${e.prefix || ""}${e.from || 0}${e.suffix || ""}</span></div>`,
    bar: () => `${lbl}<div style="margin-top:34px;white-space:nowrap">${Array.from({length: e.n}, () => `<span class="seg" style="width:${Math.floor(560 / e.n) - 12}px"><i></i></span>`).join("")}</div><div class="lbl n" style="margin-top:20px;color:var(--ink)"></div>`,
    list: () => `${lbl}<div style="margin-top:14px">${e.rows.map((r) => `<div class="li"><div class="ck${r.x ? " x" : ""}">${r.x ? "✕" : "✓"}</div><div>${r.t}</div></div>`).join("")}</div>`,
    wave: () => `${lbl}${e.title ? `<div class="ttl" style="font-size:52px">${e.title}</div>` : ""}<div class="wave">${Array.from({length: 34}, () => "<i></i>").join("")}</div>`,
    doc: () => `${lbl}<div style="margin-top:12px">${e.lines.map((l) => `<div class="dl">${l.t}<s></s>${l.nw ? `<em>${l.nw}</em>` : ""}</div>`).join("")}</div>`,
  }[e.type];

  if (e.type === "shot") {

    return `<div class="card" style="width:${e.w || 900}px;padding:22px">${lbl ? `<div style="padding:8px 14px 18px">${lbl}</div>` : ""}<div class="vp" style="height:${e.h}px;border-radius:18px"><img src="${src(e.src)}" style="filter:saturate(.55) sepia(.18) contrast(1.02)"><svg viewBox="0 0 ${e.iw} ${e.ih}" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%">${paths}${pins}</svg></div><div class="credit" style="padding:0 10px 4px">© OpenStreetMap contributors</div></div>`;
  }
  if (e.type === "code") return `<div class="code" style="width:${e.w || 900}px;height:${e.h || 900}px"><div class="lbl" style="color:#7E8594;margin-bottom:18px">${esc(e.file || "")}</div><div class="cl">${e.lines.map((l) => `<div>${l}</div>`).join("")}</div></div>`;
  if (e.type === "dlg") return `<div class="dlg"><h3>${e.title}</h3><p>${e.body}</p><div class="b">${e.btns.map((b, i) => `<div class="${i === e.red ? "red" : ""}">${b}</div>`).join("")}</div></div>`;
  if (e.type === "chip") return `<div class="chip">${e.text}</div>`;
  if (e.type === "stamp") return `<div class="stamp"${e.color ? ` style="border-color:${e.color};color:${e.color}"` : ""}>${e.text}</div>`;
  if (e.type === "quote") return `<div class="quote">${e.text}</div>`;
  if (e.type === "tags") return `<div style="width:${e.w || 900}px;text-align:center">${e.items.map((x) => `<span class="tag">${x}</span>`).join("")}</div>`;
};
// layout: stack down the canvas, zig-zag left and right; "beside" stacks under the previous card in the same shot; stamps and chips attach
const B = [];
let y = 360, side = 0;
D.els.forEach((e, i) => {
  const d = document.createElement("div"); d.className = "el"; d.innerHTML = html(e); W.appendChild(d); e.node = d;
  const w = d.offsetWidth, h = d.offsetHeight; e.w0 = w; e.h0 = h;
  if (e.type === "stamp" || e.type === "chip") {
    e.parent = [...D.els.slice(0, i)].reverse().find((q) => q.type !== "stamp" && q.type !== "chip");
  } else if (e.beside && B.length) {
    const blk = B[B.length - 1], p = blk.items[blk.items.length - 1];
    e.x = blk.cx - w / 2; e.y = p.y + p.h0 + 44; blk.items.push(e);
    y = Math.max(y, e.y + h + 420);
  } else { const cx = side++ % 2 ? 1560 : 600; e.x = cx - w / 2; e.y = y; y += h + 420; B.push({at: e.at, items: [e], reveal: e.reveal, cx, zoom: e.zoom || 1}); }
});
D.els.forEach((e) => { if (!e.parent) return; const p = e.parent; e.x = p.x + (e.type === "chip" ? p.w0 - e.w0 * 0.6 : (p.w0 - e.w0) / 2) + (e.dx || 0); e.y = p.y + (e.type === "chip" ? -e.h0 * 0.55 : (p.h0 - e.h0) / 2) + (e.dy || 0); });

const box = (items) => { const x0 = Math.min(...items.map((q) => q.x)), x1 = Math.max(...items.map((q) => q.x + q.w0)), y0 = Math.min(...items.map((q) => q.y)), y1 = Math.max(...items.map((q) => q.y + q.h0)); return {x: (x0 + x1) / 2, y: (y0 + y1) / 2, w: x1 - x0, h: y1 - y0}; };

const fit = (b, m = 1) => Math.min(1.6, 980 / b.w, 940 / b.h) * m;
const K = [];

  const x = x0 + (x1 - x0) * k, yy = y0 + (y1 - y0) * k, z = z0 * Math.pow(z1 / z0, k);

}
function anim(e, t) {
  const k = (t - e.at) / (e.dur || 0.45), n = e.node, a = e.anim || {stamp: "slam", chip: "pop", tags: "fade", quote: "rise", dlg: "pop"}[e.type] || "rise";

  if (a === "left") tr = `translateX(${-(1 - eo(k)) * 800}px)`;
  if (a === "right") tr = `translateX(${(1 - eo(k)) * 800}px)`;
  if (a === "pop") tr = `scale(${0.4 + 0.6 * back(k)})`;
  if (a === "slam") tr = `rotate(${e.rot === undefined ? -9 : e.rot}deg) scale(${1 + 1.4 * (1 - eo(k * 1.6))})`;
  if (a === "drop") tr = `translateY(${-(1 - eo(k)) * 700}px) rotate(${(1 - eo(k)) * (e.spin || 8)}deg)`;

  if (e.out !== undefined && t > e.out) { const o = eo((t - e.out) / 0.5); n.style.opacity = 1 - 0.65 * o; n.style.filter = `grayscale(${o})`; }
  if (e.type === "counter") { const v = e.from + (e.to - e.from) * (e.until !== undefined ? cl((t - e.at) / Math.max(0.3, e.until - e.at)) : eo((t - e.at) / (e.count || 0.9))); n.querySelector(".n").textContent = `${e.prefix || ""}${Math.round(v).toLocaleString("en-GB")}${e.suffix || ""}`; }
  if (e.type === "bar") { const m = cl((t - (e.fill || e.at)) / (e.count || 0.9)); n.querySelectorAll(".seg i").forEach((s, j) => { s.style.width = `${cl(m * e.n - j) * 100}%`; }); n.querySelector(".n").textContent = `${Math.round(m * e.n)} ${e.unit || ""}`; }
  if (e.type === "list") n.querySelectorAll(".li").forEach((r, j) => { const q = (t - e.rows[j].at) / 0.35; r.style.opacity = cl(q * 2); r.style.transform = `translateX(${(1 - eo(q)) * 60}px)`; r.querySelector(".ck").classList.toggle("on", t > e.rows[j].at + 0.15); });
  if (e.type === "tags") n.querySelectorAll(".tag").forEach((g, j) => { const q = (t - e.at - j * (e.gap || 0.14)) / 0.35; g.style.opacity = cl(q * 2); g.style.transform = `scale(${0.4 + 0.6 * back(q)})`; });
  if (e.type === "shot") {
    const im = n.querySelector(".vp>img"), vp = n.querySelector(".vp");
