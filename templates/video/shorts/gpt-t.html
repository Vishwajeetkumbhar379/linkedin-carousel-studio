  T.material.emissiveIntensity = fl;
  if (t >= wt(0, 'isn') && t < wt(0, 'isn') + 0.5) { const k = seg(t, wt(0, 'isn'), wt(0, 'isn') + 0.5); T.rotation.z = Math.sin(k * Math.PI * 4) * 0.12 * (1 - k); }
  // G creates
  const g0 = S(1), g1 = N(1);
  if (t >= g0 - 0.2 && t < N(2)) {
    G.material.emissiveIntensity = 0.28 * seg(t, g0, g0 + 0.4) * (1 - seg(t, g1, g1 + 0.6));
    const k = eio(seg(t, wt(1, 'creates') - 0.2, E(1))), o = seg(t, g0, g0 + 0.3) * (1 - seg(t, N(1) + 0.2, N(1) + 0.8));
    partsMat.opacity = o; const a = partsG.attributes.position.array;
    for (let i = 0; i < PN; i++) {
      const burst = 1 + 2.4 * Math.sin(Math.min(1, seg(t, g0, g0 + 1.2)) * Math.PI) * (1 - k);
      a[i * 3] = -2.25 + lerp(pFrom[i * 3] * burst, pTo[i * 3], k) + Math.sin(t + i) * 0.01; a[i * 3 + 1] = 1.95 + lerp(pFrom[i * 3 + 1] * burst, pTo[i * 3 + 1], k); a[i * 3 + 2] = 0.8 + lerp(pFrom[i * 3 + 2] * burst, pTo[i * 3 + 2], k);
    }
    partsG.attributes.position.needsUpdate = true;
    const parts = partsG; parts.rotateY; // rotation of the formed knot
  } else partsMat.opacity = 0;
  // P reads the internet
  const p0 = S(2), p1 = N(2);
  P.material.emissiveIntensity = 0.26 * seg(t, p0 + 0.3, p0 + 0.8) * (1 - seg(t, p1, p1 + 0.4));
  pages.children.forEach((m, i) => {
    const d = pageData[i], st = p0 + 0.1 + d.d * (p1 - p0 - 0.9), k = seg(t, st, st + 0.9), e = k * k;
    m.material.opacity = k > 0 && k < 1 ? Math.min(1, k * 4) : 0;
    m.position.set(lerp(d.x, 0, e), lerp(d.y, 0.3, e), lerp(d.z, 0, e));
    m.rotation.set(d.rx * (1 - e), d.ry * (1 - e) + t, 0); m.scale.setScalar(1 - e * 0.8);
  });
  // But T? spotlight, darkness
  const d0 = S(3), d1 = N(4);
  if (t >= d0 && t < d1 + 0.3) {
    const k = seg(t, d0, d0 + 0.15), out = seg(t, d1, d1 + 0.3);
    key.intensity = 260 * (1 - k * 0.92 * (1 - out)); fill.intensity = 0.25 * (1 - k * (1 - out)); rim.intensity = 1.2 * (1 - k * 0.8 * (1 - out));
    spotT.target.position.set(2.25, 0, 0); spotT.position.set(2.25, 8, 3); spotT.intensity = 420 * k * (1 - out);
    G.material.emissiveIntensity = 0; P.material.emissiveIntensity = 0;
  }
  // invented at Google: four colours orbit the T
  if (t >= S(4) && t < N(4) + 0.4) {
    const k = seg(t, S(4), S(4) + 0.4) * (1 - seg(t, N(4), N(4) + 0.4));
    gl4.forEach((p, i) => { const a = t * 2.2 + i * Math.PI / 2; p.position.set(2.25 + Math.cos(a) * 1.6, 0.2 + Math.sin(a * 0.7) * 0.6, Math.sin(a) * 1.6); p.intensity = 12 * k; });
    T.rotation.y = eio(seg(t, S(4), S(4) + 1.2)) * Math.PI * 2;
  }
  // 2017: the paper, eight inventors, T stands on it
  const showPaper = t >= S(5) - 0.1 && t < N(8) + 0.2;
  paper.visible = showPaper;
  if (showPaper) {
    G.visible = P.visible = false;
    const k = eo(seg(t, S(5), S(5) + 0.8));
    T.position.set(lerp(2.25, 0, k), lerp(0.2, -0.45, k), lerp(0, -1.6, k)); T.scale.setScalar(lerp(1, 0.55, k)); T.rotation.y = 0;
    T.material.emissiveIntensity = 0.7 * seg(t, wt(5, 'transformer'), wt(5, 'transformer') + 0.4);
  }
  ov('o2017', t, S(5) + 0.2, wt(5, 'paper') + 0.1);
  ov('opaper', t, wt(5, 'paper'), N(5) - 0.05);
  const ringPos = [[-1.4, 1.3], [-0.5, 1.6], [0.5, 1.6], [1.4, 1.3], [-1.6, 2.4], [-0.55, 2.7], [0.55, 2.7], [1.6, 2.4]];
  pawns.forEach((g, i) => {
    const on = showPaper && t >= wt(5, 'eight') + i * 0.07;
    g.visible = on; if (!on) return;
    const up = eo(seg(t, wt(5, 'eight') + i * 0.07, wt(5, 'eight') + i * 0.07 + 0.4));
    let x = ringPos[i][0], z = ringPos[i][1] - 1.2, y = -1.55 + 0.38 * up;
    // they leave one by one (line 8), the last one stays for line 9
    const leaveStart = S(8) + 0.8 + i * (E(8) - S(8) - 0.8) / 8;
    if (i < 7) { const lk = eio(seg(t, leaveStart, leaveStart + 0.9)); x += (i % 2 ? 1 : -1) * lk * 7; z += lk * 2; g.visible = lk < 1; }
    g.position.set(x, y, z); g.rotation.y = Math.sin(t * 3 + i) * 0.2;
  });
  // counter 8 -> 1 -> 0 (the last leaves in line 9)
  let left = 8; for (let i = 0; i < 7; i++) if (t >= S(8) + 0.8 + i * (E(8) - S(8) - 0.8) / 8 + 0.6) left--;
  if (t >= wt(9, 'june')) left = 0;
  document.getElementById('cntn').textContent = left;
  ov('ocnt', t, S(8) + 0.1, N(8) + 0.4);
  // engine: rings + three apps
  const e0 = S(6), e1 = N(6);
  const showEng = t >= e0 - 0.1 && t < N(7) + 0.1;
  rings.forEach((r, i) => { r.visible = showEng && t < wt(7, 'then'); if (!r.visible) return; const k = eo(seg(t, e0, e0 + 0.6)); r.position.set(0, 0.5, 0); r.scale.setScalar(k * 0.55); r.rotation.set(t * (0.8 + i * 0.4), t * (0.5 - i * 0.3), i); });
  if (showEng) {
    G.visible = P.visible = false; paper.visible = false;
    T.position.set(0, 0.5, 0); T.scale.setScalar(0.55); T.rotation.set(0, t * 0.8, 0); T.material.emissiveIntensity = 0.9;
    pawns.forEach(p => p.visible = false);
    apps.forEach((g, i) => { const st = wt(6, ['chatgpt', 'gemini', 'claude'][i]) - 0.1; const k = eo(seg(t, st, st + 0.45)); g.visible = t >= st && t < wt(7, 'then') + 0.2;
      g.position.set((i - 1) * 1.15, -1.25 + k * 0.2, 2.4); g.scale.setScalar(k * 0.72); g.rotation.y = Math.sin(t + i) * 0.35; g.children[1].rotation.y = t * 1.5; });
    // patented stamp
    const sp = wt(7, 'patented'); stamp.visible = t >= sp - 0.2 && t < wt(7, 'then') + 0.2;
    const sk = seg(t, sp - 0.2, sp + 0.2);
    stamp.position.set(0, lerp(6, 0.5, sk * sk), 1.8); stamp.rotation.set(Math.PI / 2 * 0 + 0.0, 0, -0.12); stamp.scale.setScalar(lerp(1.6, 1, sk));
    if (sk >= 1) stamp.position.z = 1.8;
    // the world uses it
    const w0 = wt(7, 'then'); globe.visible = copies.visible = t >= w0 - 0.1;
    if (globe.visible) {
      const gk = eo(seg(t, w0, w0 + 0.6)); globe.position.set(0, 0.5, 0); globe.scale.setScalar(gk); globe.rotation.y = t * 0.4;
      T.scale.setScalar(0.55 * (1 - gk * 0.4));
      copyData.forEach((c, i) => { const k = eo(seg(t, w0 + 0.2 + c.d, w0 + 1.4 + c.d)); const r = 0.3 + k * 2.6;
        tmpP.set(Math.sin(c.b) * Math.cos(c.a + t * 0.3) * r, 0.5 + Math.cos(c.b) * r, Math.sin(c.b) * Math.sin(c.a + t * 0.3) * r);
        tmpQ.setFromEuler(tmpE.set(0, t + i, 0)); tmpS.setScalar(k > 0 ? 1 : 0.0001); tmpM.compose(tmpP, tmpQ, tmpS); copies.setMatrixAt(i, tmpM); });
      copies.instanceMatrix.needsUpdate = true;
    }
  } else { apps.forEach(g => g.visible = false); stamp.visible = false; globe.visible = copies.visible = false; }
  // line 9: the last inventor, $2.7B, crosses to OpenAI
  if (t >= S(9) - 0.1 && t < N(9) + 0.2) {
    G.visible = P.visible = T.visible = false; paper.visible = true;
    const g = pawns[7]; g.visible = true;
    const k = eio(seg(t, wt(9, 'june') - 0.1, wt(9, 'june') + 0.9));
    g.position.set(lerp(0, 3.2, k), -1.17, 0.6 + lerp(0, 0.6, k)); g.scale.setScalar(1.4);
    spotT.target.position.copy(g.position); spotT.position.set(g.position.x, 8, 3); spotT.intensity = 90;
    googL.position.set(-2.5, 0.5, 1); googL.intensity = 14 * (1 - k); tealL.position.set(3.4, 0.5, 1.5); tealL.intensity = 16 * k;
    key.intensity = 60;
  }
  ov('oprice', t, wt(9, '2.7') - 0.1, wt(9, 'june') - 0.05);
  ov('ojune', t, wt(9, 'june'), N(9) + 0.1);
  // line 10: the question, T between two sides
  if (t >= S(10) - 0.1) {
    paper.visible = false; pawns.forEach(p => p.visible = false);
    const k = Math.sin((t - S(10)) * 2.4);

  ov('oq', t, wt(10, 'should'), D + 1);
  const cb = document.getElementById('cbub'); cb.style.opacity = cl((t - wt(10, 'secret') - 0.1) / 0.3) * (1 - seg(t, D - 0.35, D - 0.1));
  composer.render();
  Captions.draw(t);
};
