<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="/video/shorts/shorts.css">
<style>
/* Inside AI Shorts cover: a clean frame from the episode, a provocative 3-line headline with one amber pill word,
   a hand-drawn circle + arrow on the thing the headline is about. 1080x1920; the 4:5 safe area is kept clear. */
:root{--amb:#FDB33E}
#root{background:#000}
#bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.06)}
#shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,8,16,.92) 0%,rgba(0,8,16,.6) 30%,rgba(0,8,16,0) 52%,rgba(0,8,16,0) 78%,rgba(0,8,16,.75) 100%)}
#hl{position:absolute;left:56px;right:56px;top:300px;text-align:center;font:700 152px/0.9 'Inter Tight';letter-spacing:-.045em;text-transform:uppercase;color:#fff;
  text-shadow:0 6px 0 rgba(0,0,0,.35),0 18px 60px rgba(0,0,0,.7);text-wrap:balance}
#hl .ln{display:block;white-space:nowrap}
#hl .pill{display:inline-block;background:var(--amb);color:#140d02;padding:0 26px 6px;border-radius:22px;transform:rotate(-3deg);text-shadow:none;box-shadow:0 18px 50px -10px rgba(253,179,62,.7);margin:10px 0}
#kick{position:absolute;left:0;right:0;text-align:center;font:600 46px 'Inter Tight';color:#fff;letter-spacing:-.01em;text-shadow:0 4px 30px rgba(0,0,0,.8)}
#kick b{color:var(--amb)}
svg{position:absolute;inset:0;width:1080px;height:1920px;overflow:visible}
#ep{position:absolute;left:0;right:0;bottom:150px;text-align:center;font:500 30px 'Geist Mono';letter-spacing:.22em;color:#fff;opacity:.85}
#ep b{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--amb);box-shadow:0 0 14px var(--amb);margin-right:16px;vertical-align:2px}
</style></head>
<body><div id="root">
<div id="bg"></div><div id="shade"></div>
<svg id="ink"></svg>
<div id="hl"></div><div id="kick"></div>
<div id="ep"><b></b><span id="ept"></span></div>
</div>
<script>
// a slightly wobbly hand-drawn ellipse and arrow, deterministic
function wobble(cx, cy, rx, ry) {
  let d = '', n = 64;
  for (let i = 0; i <= n + 6; i++) {
    const a = (i / n) * Math.PI * 2 - 0.6, k = 1 + 0.03 * Math.sin(a * 2 + 0.4) + 0.02 * Math.sin(a * 3 + 1.3) + 0.07 * Math.max(0, (i - n + 8) / 14);
    d += (i ? 'L' : 'M') + (cx + Math.cos(a) * rx * k).toFixed(1) + ' ' + (cy + Math.sin(a) * ry * k).toFixed(1);
  }
  return d;
}
window.setup = function (c) {
  const bgEl = document.getElementById('bg'); bgEl.style.backgroundImage = `url(${c.bg})`; bgEl.style.transform = `translateY(${c.bgY || 0}px) scale(${c.bgScale || 1.06})`;
  const hl = document.getElementById('hl');
  hl.innerHTML = c.lines.map(l => `<span class="ln">${l.replace(/\[(.+?)\]/g, '<span class="pill">$1</span>')}</span>`).join('');
  const kick = document.getElementById('kick');
  kick.innerHTML = c.kicker || '';
  document.getElementById('ept').textContent = c.ep;
  const svg = document.getElementById('ink');
  let s = '<defs><filter id="gl"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
  if (c.circle) { const {x, y, rx, ry} = c.circle; s += `<path d="${wobble(x, y, rx, ry)}" fill="none" stroke="#FDB33E" stroke-width="12" stroke-linecap="round" filter="url(#gl)"/>`; }
  if (c.arrow) { const [x1, y1, x2, y2] = c.arrow, mx = (x1 + x2) / 2 + (c.bend || 120), my = (y1 + y2) / 2;
    const ang = Math.atan2(y2 - my, x2 - mx), h = 46;
    s += `<path d="M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}" fill="none" stroke="#FDB33E" stroke-width="12" stroke-linecap="round" filter="url(#gl)"/>`;
    s += `<path d="M${x2 - h * Math.cos(ang - 0.5)} ${y2 - h * Math.sin(ang - 0.5)} L${x2} ${y2} L${x2 - h * Math.cos(ang + 0.5)} ${y2 - h * Math.sin(ang + 0.5)}" fill="none" stroke="#FDB33E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)"/>`; }
  svg.innerHTML = s;
  let fs = 150; hl.style.fontSize = fs + 'px'; while (hl.scrollWidth > hl.clientWidth + 2 && fs > 80) { fs -= 4; hl.style.fontSize = fs + 'px'; }
  const r = hl.getBoundingClientRect(); kick.style.top = (r.bottom + 26) + 'px';
  window.READY = true;
};
document.fonts.ready.then(() => { window.STAGE_LOADED = true; });
</script>
</body></html>
