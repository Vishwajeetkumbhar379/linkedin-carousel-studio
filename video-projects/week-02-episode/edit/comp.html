<!doctype html>
<html><head><meta charset="utf-8"><title>week 1 comp</title>
<!-- Week 1 compositor, v3 (Vish, 22 Oct: premium, calm, no abrupt moves). Type: Instrument Serif for the emotional
     lines, Inter Tight for facts, Geist Mono for small labels; one warm lamp-amber accent. Motion: words rise in as
     he says them, soft dissolves between shots, a locked camera. -->
<style>
@font-face{font-family:IS;src:url(/home/user/linkedin-carousel-studio/templates/fonts-extra/instrument-serif-latin-400-normal.woff2)}
@font-face{font-family:IS;font-style:italic;src:url(/home/user/linkedin-carousel-studio/templates/fonts-extra/instrument-serif-latin-400-italic.woff2)}
@font-face{font-family:IT;font-weight:500;src:url(/home/user/linkedin-carousel-studio/templates/fonts-extra/inter-tight-latin-500-normal.woff2)}
@font-face{font-family:IT;font-weight:600;src:url(/home/user/linkedin-carousel-studio/templates/fonts-extra/inter-tight-latin-600-normal.woff2)}
@font-face{font-family:IT;font-weight:700;src:url(/home/user/linkedin-carousel-studio/templates/fonts-extra/inter-tight-latin-700-normal.woff2)}
@font-face{font-family:GM;font-weight:500;src:url(/home/user/linkedin-carousel-studio/templates/node_modules/@fontsource/geist-mono/files/geist-mono-latin-500-normal.woff2)}
:root{--ink:#0A0A0B;--bone:#F7F1E6;--amber:#E7A15A;--graphite:#1D1C1A;--paper:#ECE8E0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
.L{position:absolute;inset:0}
#bg>div{position:absolute;inset:0;display:none}
#bg .ink{background:radial-gradient(ellipse 80% 36% at 50% 0%,#211a14 0%,#0A0A0B 72%)}
#bg .paper,.paperbg{background:radial-gradient(ellipse 80% 60% at 50% 45%,#F1EDE5 0%,#E7E2D8 70%,#DAD4C8 100%)}
#bg .black{background:#050505}
#cutbg,#cut{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;display:none}
#cutbg{z-index:5;filter:blur(5px) brightness(.74) saturate(.9)}
#cut{z-index:30}
#frame{position:absolute;overflow:hidden;background:#000;z-index:10}
#frame img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none}
#fb{z-index:2}
#fz{z-index:3}
.cue{position:absolute;display:none}
.serif{font-family:IS;font-weight:400}
.sans{font-family:IT;font-weight:700;letter-spacing:-.035em}
.mono{font-family:GM;font-weight:500;letter-spacing:.24em;text-transform:uppercase}
.am{color:var(--amber)}
.w{display:inline-block;will-change:transform,opacity}
.sh{text-shadow:0 2px 28px rgba(0,0,0,.42),0 1px 2px rgba(0,0,0,.35)}
.band{left:56px;right:56px;bottom:1584px;text-align:center;color:var(--bone)}
.tb{color:var(--bone)}
.band.dark .tb{color:var(--graphite);text-shadow:none}
#cap{position:absolute;left:120px;right:120px;z-index:50;text-align:center;font:600 50px/1.2 IT;letter-spacing:-.01em;color:#fff;
 text-shadow:0 2px 22px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.5)}
#cap .cw{display:inline-block;color:rgba(255,255,255,.58);transform-origin:50% 100%}
#cap .cw.done{color:#fff}
#cap .box{position:absolute;display:none;border:3px solid var(--amber);border-radius:8px;pointer-events:none}
#cap .box b{position:absolute;width:13px;height:13px;background:var(--bone);border:3px solid var(--amber);border-radius:2px}
#cap .box b:nth-child(1){left:-9px;top:-9px}#cap .box b:nth-child(2){right:-9px;top:-9px}
#cap .box b:nth-child(3){left:-9px;bottom:-9px}#cap .box b:nth-child(4){right:-9px;bottom:-9px}
#fz,#fl{display:none}
#fl{position:absolute;inset:0;background:#fff;z-index:4}
#grain{z-index:70;pointer-events:none;opacity:.12;mix-blend-mode:overlay;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='256' height='256' filter='url(%23n)'/></svg>")}
</style></head><body>
<div id="bg" class="L"><div class="ink"></div><div class="paper"></div><div class="black"></div></div>
<img id="cutbg"><div id="frame"><img id="fa"><img id="fb"><img id="fz"><div id="fl"></div></div><img id="cut">
<div id="cues"></div>
<div id="cap"></div>
<div id="grain" class="L"></div>
<script>
const GEO = {full: {x: 0, y: 0, w: 1080, h: 1920, r: 0}, f45: {x: 40, y: 360, w: 1000, h: 1250, r: 28},
             split: {x: 0, y: 960, w: 1080, h: 960, r: 0}, none: {x: 400, y: 720, w: 280, h: 350, r: 40}};
const CAPY = {full: 1190, f45: 1190, split: 866, none: 1190};  // safe zones (23 Oct): captions above the bottom 35%, in a split above his box
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const eo = u => 1 - Math.pow(1 - u, 3);
const eio = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const prog = (t, t0, d) => clamp((t - t0) / d, 0, 1);
const spring = u => u >= 1 ? 1 : 1 - Math.exp(-7 * u) * Math.cos(11 * u);  // overshoots, then settles
const EM = '../assets/emoji';  // Microsoft Fluent 3D emoji (MIT)
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const pad = n => String(n).padStart(5, '0');
const $ = s => document.querySelector(s);
let TL, CUES = [], ACTIVE = [], CHANGES = [], pending = [];

function setImg(el, src) {
  if (el.dataset.s === src) return Promise.resolve();
  el.dataset.s = src; el.src = src;
  return el.decode().catch(() => {});
}
function el(html, cls, css) { const d = document.createElement('div'); d.className = 'cue ' + (cls || ''); d.innerHTML = html || ''; if (css) d.style.cssText += css; $('#cues').appendChild(d); return d; }
// the one motion: rise + fade + defocus in, fade out
function enter(node, t, t0, d = .45, rise = 22, blur = 8) { const u = eo(prog(t, t0, d));
  node.style.opacity = u; node.style.transform = `translateY(${(1 - u) * rise}px)`; node.style.filter = u < 1 ? `blur(${(1 - u) * blur}px)` : 'none'; }
function flip(node, t, t0, d = .45) { const u = eo(prog(t, t0, d));  // a word turning up into place, in 3D
  node.style.opacity = u; node.style.transformOrigin = '50% 100%';
  node.style.transform = `perspective(700px) translateY(${(1 - u) * 20}px) rotateX(${(1 - u) * -78}deg)`; node.style.filter = u < 1 ? `blur(${(1 - u) * 5}px)` : 'none'; }
function fadeOut(node, t, t1, d = .28) { const v = 1 - prog(t, t1 - d, d); node.style.opacity = (+node.style.opacity || 1) * v; }

// ---------------------------------------------------------------- cue types
const K = {
  next: {  // "Next week, on Build with Vish: did reducing friction work?" Each word lands as the narrator says it
    make(c) { const W = c.words, w = (i, txt) => `<span class="w" data-i="${i}">${txt ?? W[i][0].replace(/[.,:]+$/, '')}</span>`;
      return el(`<div class="paperbg" style="position:absolute;inset:0"></div>
        <div style="position:absolute;left:0;right:0;top:470px;text-align:center;color:#1D1C1A">
          <div style="font:400 170px/.9 IS">${w(0)} ${w(1)}</div>
          <div class="mono" style="font-size:26px;color:#6B675F;margin-top:26px">${[2, 3, 4, 5].map(i => w(i)).join(' ')}</div>
          <div style="font:400 italic 124px/1 IS;color:#B8742F;margin-top:70px">${w(6)} ${w(7)}<br>${w(8)} ${w(9)}</div>
          <div class="bar" style="width:760px;margin:80px auto 0;display:grid;grid-template-columns:repeat(52,1fr);gap:4px">${Array.from({length: 52}, (_, k) => `<i style="height:14px;display:block;border-radius:2px;background:${k < 2 ? '#E7A15A' : 'rgba(29,28,26,.14)'}"></i>`).join('')}</div>
          <div class="mono ft" style="font-size:22px;color:#6B675F;margin-top:30px">Follow for week 3</div></div>`, '', 'inset:0'); },
    upd(d, c, t) { const u = eio(prog(t, c.t0, .5)), last = c.words[c.words.length - 1][2];
      d.style.transform = `translateY(${(1 - u) * 1920}px)`;  // a fresh page slides up
      d.querySelectorAll('.w').forEach(w => flip(w, t, c.words[+w.dataset.i][1] - .05, .38));
      d.querySelector('.bar').children[2].style.background = t >= last - .1 ? '#E7A15A' : 'rgba(29,28,26,.14)';
      enter(d.querySelector('.ft'), t, last + .1, .4, 12, 4); } },
  tags: {  // stickers popping around the freeze-frame: labels and 3D icons
    make(c) { return el(c.items.map(([em, txt, t0, x, y, r, sz]) => `<div class="tg" style="position:absolute;left:${x}px;top:${y}px"><div style="display:flex;align-items:center;gap:12px;background:#fff;border-radius:${sz > 40 ? 26 : 18}px;padding:${em ? '8px 24px 8px 10px' : '12px 26px'};box-shadow:0 12px 34px rgba(0,0,0,.4);transform:rotate(${r}deg)">${em ? `<img src="${EM}/${em}.png" style="width:84px;height:84px">` : ''}<span style="font:700 ${sz}px/1 IT;letter-spacing:-.01em;color:#111;text-transform:uppercase;white-space:nowrap">${txt}</span></div></div>`).join(''), '', 'inset:0'); },
    upd(d, c, t) { d.querySelectorAll('.tg').forEach((g, i) => { const t0 = c.items[i][2], u = prog(t, t0, .4);
      g.style.opacity = t >= t0 ? 1 : 0; g.style.transform = `scale(${spring(u)})`; }); d.style.opacity = 1 - prog(t, c.t1 - .08, .08); } },
  photos: {  // the music stops; his passport photos land on a page one by one, kid to now
    make(c) { const ph = c.files.map(f => `<img class="pp" src="${f}" style="position:absolute;left:0;top:0;width:${c.w}px;box-shadow:0 20px 44px rgba(40,30,20,.3);border-radius:4px">`).join('');
      return el(`<div class="paperbg" style="position:absolute;inset:0"></div>${ph}<div class="c27" style="position:absolute;left:0;right:0;top:1350px;text-align:center;color:#1D1C1A">
        <div style="font:400 170px/.9 IS">27 <i>years</i></div><div class="mono" style="font-size:24px;color:#6B675F;margin-top:24px">in passport photos</div></div>`, '', 'inset:0'); },
    upd(d, c, t) { const R = rng(11);
      d.querySelectorAll('.pp').forEach((p, i) => { const t0 = c.times[i], u = prog(t, t0, .14);
        const x = 540 - c.w / 2 + (R() - .5) * 200, y = 330 + (R() - .5) * 140 + i * 12, r = (R() - .5) * 14;
        p.style.opacity = t >= t0 ? 1 : 0; p.style.zIndex = i + 1; p.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${1.3 - .3 * eo(u)})`; });
      enter(d.querySelector('.c27'), t, c.text_t, .45, 18, 6); d.querySelector('.c27').style.zIndex = 99; } },
  counter: {  // odometer: each digit rolls up and lands (left first), then the suffix slams in
    make(c) { const h = c.size * .86, cell = k => `<span style="display:block;height:${h}px">${k % 10}</span>`;
      const cols = [...c.digits].map(() => `<span class="col" style="display:inline-block;height:${h}px;overflow:hidden;vertical-align:top"><span class="strip" style="display:block">${Array.from({length: 30}, (_, k) => cell(k)).join('')}</span></span>`).join('');
      return el(`<div class="tb sans sh" style="font-size:${c.size}px;line-height:${h}px;color:var(--amber);white-space:nowrap">${cols}<span class="suf" style="display:inline-block;vertical-align:top">${c.suffix || ''}</span></div>`,
        '', `left:0;right:0;top:${c.y}px;text-align:center`); },
    upd(d, c, t) { const h = c.size * .86, tb = d.firstChild;
      d.querySelectorAll('.strip').forEach((s, i) => { const land = c.t0 + c.roll + i * c.stagger, u = prog(t, c.t0, land - c.t0), e = eo(u);
        s.style.transform = `translateY(${-e * (20 + +c.digits[i]) * h}px)`; s.style.filter = u < 1 ? `blur(${(1 - e) * 5}px)` : 'none'; });
      const ts = c.t0 + c.roll + (c.digits.length - 1) * c.stagger, sf = d.querySelector('.suf');
      sf.style.opacity = t >= ts ? 1 : 0; sf.style.transform = `scale(${1.7 - .7 * spring(prog(t, ts, .3))})`;
      tb.style.opacity = prog(t, c.t0, .1); tb.style.filter = 'none';
      tb.style.transform = `scale(${1 + .05 * Math.sin(Math.PI * prog(t, ts, .25))})`;
      fadeOut(tb, t, c.t1, .25); } },
  sticker: {  // a small card that springs on, a 3D emoji bobbing on it
    make(c) { return el(`<div style="display:flex;align-items:center;gap:22px;background:#F7F3EC;border-radius:28px;padding:16px 36px 16px 16px;box-shadow:0 26px 60px rgba(0,0,0,.42);color:#1D1C1A">
        <img class="em" src="${EM}/${c.emoji}.png" style="width:120px;height:120px">
        <div><div style="font:700 52px/1 IT;letter-spacing:-.035em;white-space:nowrap">${c.text}</div><div class="mono" style="font-size:19px;letter-spacing:.14em;color:#7d776d;margin-top:12px;white-space:nowrap">${c.sub || ''}</div></div></div>`,
        '', `left:${c.x}px;top:${c.y}px;transform-origin:15% 50%`); },
    upd(d, c, t) { const u = prog(t, c.t0, .55), a = t - c.t0;
      d.style.opacity = clamp(u * 5, 0, 1); d.style.transform = `scale(${spring(u)}) rotate(${(c.rot || 0) - 10 * (1 - eo(u))}deg)`;
      d.querySelector('.em').style.transform = `translateY(${Math.sin(a * 5) * 5}px) rotate(${Math.sin(a * 3.5) * 6}deg)`;
      fadeOut(d, t, c.t1, .25); } },
  chaos: {  // "life is all over the place": the words land at odd angles, life's stuff spins around them
    make(c) { const ob = c.objs.map(n => `<img class="ob" src="${EM}/${n}.png" style="position:absolute;left:0;top:0;width:150px;height:150px">`).join('');
      const ws = c.words.map(([w, tw, x, y, r, sz, am]) => `<div class="sw" style="position:absolute;left:${x}px;top:${y}px;width:0;white-space:nowrap"><div style="transform:translate(-50%,-50%) rotate(${r}deg);width:max-content"><div class="in" style="font:700 ${sz}px/1 IT;letter-spacing:-.045em;color:${am ? '#E7A15A' : '#F7F1E6'}">${w}</div></div></div>`).join('');
      return el(`${ob}<div class="lead" style="position:absolute;left:0;right:0;top:70px;text-align:center;font:400 italic 96px/1 IS;color:#F7F1E6">Life is</div>${ws}`,
        'sh', 'left:0;top:0;width:1080px;height:960px'); },
    upd(d, c, t) { const oe = eio(prog(t, c.t1 - .35, .35)), R = rng(7);
      const lead = d.querySelector('.lead'); enter(lead, t, c.lead_t, .4, 16, 6); lead.style.opacity = +lead.style.opacity * (1 - oe);
      d.querySelectorAll('.sw').forEach((s, i) => { const tw = c.words[i][1], u = prog(t, tw - .04, .4), inn = s.querySelector('.in');
        inn.style.opacity = t >= tw - .04 ? 1 : 0; inn.style.transform = `scale(${2.1 - 1.1 * spring(u)})`;
        inn.style.filter = u < .35 ? `blur(${(1 - u / .35) * 8}px)` : 'none';
        s.style.opacity = 1 - oe; s.style.transform = `scale(${1 + .25 * oe})`; });
      d.querySelectorAll('.ob').forEach((o, i) => {
        const ph = i / c.objs.length * 6.283 + R() * .3, sp = (.6 + R() * .5) * (i % 3 === 1 ? -1 : 1), rx = 400 + R() * 90, ry = 290 + R() * 90;
        const spin = (R() - .5) * 300, sc = .7 + R() * .45, t0 = c.t0 + i * .07, a = ph + sp * (t - c.t0);
        const k = (1.9 - .9 * eo(prog(t, t0, .7))) * (1 + oe * 1.2);
        o.style.transform = `translate(${540 + Math.cos(a) * rx * k - 75}px,${480 + Math.sin(a) * ry * k - 75}px) rotate(${spin * (t - c.t0) + i * 40}deg) scale(${sc})`;
        o.style.opacity = (t >= t0 ? 1 : 0) * (1 - oe); }); } },
  juggle: {  // "so many interests, so many hobbies": a 3D figure juggling all of it
    make(c) { const ob = c.balls.map(([n]) => `<img class="ball" src="${EM}/${n}.png" style="position:absolute;left:0;top:0;width:130px;height:130px">`).join('');
      return el(`<img class="fig" src="${EM}/${c.fig}.png" style="position:absolute;left:390px;top:610px;width:300px;height:300px">${ob}
        <div class="hd" style="position:absolute;left:0;right:0;top:56px;text-align:center;font:400 96px/1 IS;color:#F7F1E6;white-space:nowrap">So many <span style="display:inline-block;position:relative;width:360px;height:1.1em;overflow:hidden;vertical-align:bottom;text-align:left">${c.heads.map(([w]) => `<i class="hw" style="position:absolute;left:0;top:0;color:#E7A15A">${w}</i>`).join('')}</span></div>`,
        'sh', 'left:0;top:0;width:1080px;height:960px'); },
    upd(d, c, t) { const out = eio(prog(t, c.t1 - .35, .35)), uf = prog(t, c.t0, .5), fig = d.querySelector('.fig');
      fig.style.opacity = clamp(uf * 4, 0, 1) * (1 - out);
      fig.style.transform = `translateY(${(1 - spring(uf)) * 220 + out * 300}px) rotate(${Math.sin((t - c.t0) * 6) * 3}deg)`;
      const hd = d.querySelector('.hd'); enter(hd, t, c.t0, .35, 14, 6); hd.style.opacity = +hd.style.opacity * (1 - out);
      d.querySelectorAll('.hw').forEach((h, i) => { const ti = c.heads[i][1], tn = c.heads[i + 1] ? c.heads[i + 1][1] : 1e9;
        const ui = eo(prog(t, ti - .05, .3)), uo = eo(prog(t, tn - .05, .3));
        h.style.transform = `translateY(${(1 - ui) * 100 - uo * 100}%)`; h.style.opacity = t < ti - .05 ? 0 : 1 - uo; });
      const n = c.balls.length;
      d.querySelectorAll('.ball').forEach((b, i) => { const tb = c.balls[i][1], ub = prog(t, tb - .03, .35);
        const a = ((t - c.t0) / 1.7 + i / n) * 6.283, s = Math.sin(a);  // a tall arc over his head, a flat return through his hands
        const x = 540 + Math.cos(a) * 310 - 65, y = 530 + (s < 0 ? s * 340 : s * 80) - 65, e = eo(ub);
        const X = 475 + (x - 475) * e, Y = 700 + (y - 700) * e + out * 800 * (1 + i * .12);
        b.style.transform = `translate(${X}px,${Y}px) rotate(${(t - c.t0) * (i % 2 ? 140 : -120)}deg) scale(${.35 + .65 * spring(ub)})`;
        b.style.opacity = t >= tb - .03 ? 1 - out * .5 : 0; }); } },
  todo: {  // "so many things I need to achieve": the list, nothing ticked yet
    make(c) { const rows = c.rows.map(([e, txt]) => `<div class="tr" style="display:flex;align-items:center;gap:24px;padding:14px 0;border-top:1px solid rgba(29,28,26,.1)">
          <i style="width:46px;height:46px;border:4px solid #C9873F;border-radius:11px;flex:none"></i><img src="${EM}/${e}.png" style="width:72px;height:72px"><span style="font:600 48px/1 IT;letter-spacing:-.025em">${txt}</span></div>`).join('');
      return el(`<div style="width:920px;background:#F7F3EC;border-radius:34px;padding:30px 46px 20px;box-shadow:0 34px 80px rgba(0,0,0,.45);color:#1D1C1A">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div style="font:400 italic 80px/1 IS">Things to achieve</div><img class="bx" src="${EM}/bullseye.png" style="width:90px;height:90px"></div>${rows}</div>`,
        '', 'left:80px;top:150px'); },
    upd(d, c, t) { const u = prog(t, c.t0, .5), out = eio(prog(t, c.t1 - .3, .3));
      d.style.opacity = clamp(u * 4, 0, 1) * (1 - out);
      d.style.transform = `translateY(${(1 - spring(u)) * 320 - out * 140}px) rotate(${-2.5 * (1 - eo(u))}deg)`;
      d.querySelector('.bx').style.transform = `rotate(${Math.sin((t - c.t0) * 4) * 8}deg)`;
      d.querySelectorAll('.tr').forEach((r, i) => { const ur = prog(t, c.rows[i][2], .35); r.style.opacity = eo(ur); r.style.transform = `translateX(${(1 - eo(ur)) * 70}px)`; }); } },
  debt: {  // "the 40K debt I need to pay": the number counts up and lands; nothing paid yet
    make(c) { const wings = [0, 1, 2].map(() => `<img class="wg" src="${EM}/money_with_wings.png" style="position:absolute;left:0;top:0;width:150px;height:150px">`).join('');
      return el(`${wings}<div style="position:absolute;left:0;right:0;top:140px;text-align:center"><div class="mono" style="font-size:26px;color:rgba(247,241,230,.72)">Debt</div>
        <div class="n" style="font:700 260px/1 IT;letter-spacing:-.05em;color:#E7A15A;margin-top:14px;font-variant-numeric:tabular-nums">0</div>
        <div style="width:760px;margin:44px auto 0;height:16px;border-radius:8px;background:rgba(247,241,230,.12);overflow:hidden"><i style="display:block;height:100%;width:1.2%;background:#E7A15A"></i></div>
        <div class="mono" style="display:flex;justify-content:space-between;width:760px;margin:16px auto 0;font-size:22px;color:rgba(247,241,230,.62)"><span>Paid</span><span>0%</span></div></div>`,
        'sh', 'left:0;top:0;width:1080px;height:960px'); },
    upd(d, c, t) { const u = prog(t, c.t0, .35), out = eio(prog(t, c.t1 - .3, .3)), n = d.querySelector('.n');

        <div class="mono" style="position:absolute;left:80px;top:310px;font-size:32px;color:#F7F1E6;text-shadow:0 2px 12px rgba(0,0,0,.7)">Rewind · Week 01</div>
        <div class="tc mono" style="position:absolute;right:80px;top:310px;font-size:32px;color:#E7A15A;text-shadow:0 2px 12px rgba(0,0,0,.7)"></div>`, '', 'inset:0'); },
    upd(d, c, t) { const k = clamp(Math.floor((t - c.t0) / c.step), 0, c.files.length - 1), im = d.querySelector('.rw'), j = rng(Math.floor(t * 60));
      pending.push(setImg(im, c.files[k]));
      im.style.transform = `translate(${(j() - .5) * 22}px,${(j() - .5) * 10}px) scale(1.05)`; im.style.filter = `saturate(.8) contrast(1.1) blur(${j() < .3 ? 2 : 0}px)`;
      const s = Math.max(0, c.from - (t - c.t0) * c.speed); d.querySelector('.tc').textContent = `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
      d.style.opacity = prog(t, c.t0, .06) * (1 - prog(t, c.t1 - .08, .08)); } },
  kw: {  // the close (his cloned voice): the three rows, then the keyword types into a comment box
    make(c) { const rows = c.rows.map(r => `<div class="kr" style="display:flex;align-items:center;gap:24px;margin-top:26px"><i style="width:56px;height:56px;border:4px solid #C9873F;border-radius:12px"></i><span style="font:600 70px/1 IT;letter-spacing:-.03em">${r[0]}</span></div>`).join('');
      return el(`<div class="paperbg" style="position:absolute;inset:0"></div>
        <div style="position:absolute;left:130px;top:330px;color:#1D1C1A"><div class="kh" style="font:400 italic 116px/1 IS">This week</div>${rows}</div>
        <div class="cb" style="position:absolute;left:110px;top:1000px;width:860px;background:#fff;border-radius:40px;padding:34px 42px 38px;box-shadow:0 30px 70px rgba(40,30,20,.25);color:#1D1C1A">
          <div class="mono" style="font-size:20px;color:#8a857b">Comment</div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:14px;height:96px"><span class="kt" style="font:700 100px/1 IT;letter-spacing:-.02em"></span><i class="cur" style="width:6px;height:86px;background:#E7A15A"></i></div>
          <div class="ks" style="font:400 italic 52px/1.1 IS;color:#B8742F;margin-top:20px">and I'll send you my checklist</div></div>`, '', 'inset:0'); },
    upd(d, c, t) { d.style.transform = `translateY(${(1 - eio(prog(t, c.t0, .45))) * 1920}px)`;
      enter(d.querySelector('.kh'), t, c.t0 + .2, .35, 12, 4);
      d.querySelectorAll('.kr').forEach((r, i) => enter(r, t, c.rows[i][1], .35, 16, 4));
      const n = c.key.length, kk = Math.floor(clamp((t - c.key_t) / .09 + 1, 0, n)); d.querySelector('.kt').textContent = t >= c.key_t ? c.key.slice(0, kk) : '';

  grid: {  // "every video on this account so far": his real reels as phone tiles, one shutter each
    make(c) { const tiles = c.files.map((f, k) => `<div class="gt" style="position:absolute;left:${90 + (k % 3) * 310}px;top:${330 + Math.floor(k / 3) * 520}px;width:280px;height:498px;border-radius:30px;border:8px solid #15130F;overflow:hidden;background:#000;box-shadow:0 30px 60px rgba(40,30,20,.3)"><img src="${f}" style="width:100%;height:100%;object-fit:cover"></div>`).join('');
      return el(`<div class="paperbg" style="position:absolute;inset:0"></div>${tiles}
        <div class="gl" style="position:absolute;left:0;right:0;top:1420px;text-align:center;font:400 italic 92px/1 IS;color:#1D1C1A">Shot on my <span style="color:#B8742F">phone.</span></div>`, '', 'inset:0'); },
    upd(d, c, t) { d.style.transform = `translateY(${(1 - eio(prog(t, c.t0, .4))) * 1920}px)`;
      d.querySelectorAll('.gt').forEach((g, k) => { const u = prog(t, c.times[k], .35); g.style.opacity = t >= c.times[k] ? 1 : 0; g.style.transform = `scale(${1.25 - .25 * spring(u)}) rotate(${(k % 2 ? 2 : -2) * eo(u)}deg)`; });
      enter(d.querySelector('.gl'), t, c.label_t, .4, 14, 6); } },
  choice: {  // "what would you buy first? A tripod, or a mic?": two buttons, the cursor goes to each as it's said
    make(c) { const b = (txt, k) => `<div class="cb" style="position:absolute;left:${k ? 570 : 110}px;top:820px;width:400px;height:260px;border-radius:40px;background:#fff;box-shadow:0 30px 70px rgba(40,30,20,.25);display:flex;align-items:center;justify-content:center;font:700 92px/1 IT;letter-spacing:-.03em;color:#1D1C1A">${txt}</div>`;
      return el(`<div class="paperbg" style="position:absolute;inset:0"></div>
        <div class="q" style="position:absolute;left:0;right:0;top:420px;text-align:center;font:400 112px/1 IS;color:#1D1C1A">What would you<br><i style="color:#B8742F">buy first?</i></div>
        ${b('Tripod', 0)}${b('Mic', 1)}
        <svg class="cur" width="70" height="90" viewBox="0 0 70 90" style="position:absolute;left:0;top:0"><path d="M6 4 L6 70 L22 54 L34 84 L46 79 L34 50 L58 50 Z" fill="#15130F" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg>
        <div class="mono ft" style="position:absolute;left:0;right:0;top:1180px;text-align:center;font-size:24px;color:#6B675F">Tell me in the comments</div>`, '', 'inset:0'); },
    upd(d, c, t) { d.style.transform = `translateY(${(1 - eio(prog(t, c.t0, .4))) * 1920}px)`;
      enter(d.querySelector('.q'), t, c.t0 + .15, .4, 14, 6);
      const bs = d.querySelectorAll('.cb'), hits = [c.a_t, c.b_t];
      bs.forEach((bb, k) => { const on = t >= hits[k] && (k === 1 || t < hits[1]); bb.style.background = on ? '#E7A15A' : '#fff';
        bb.style.transform = `scale(${on ? 1 + .05 * Math.sin(Math.PI * prog(t, hits[k], .25)) : 1})`; enter(bb, t, c.t0 + .25 + k * .12, .4, 30, 4); });
      const x = t < c.a_t ? 540 : t < c.b_t ? 300 + 40 * (1 - eo(prog(t, c.a_t - .3, .3))) : 760 - 460 * (1 - eo(prog(t, c.b_t - .3, .3)));
      d.querySelector('.cur').style.transform = `translate(${x}px,${t < c.a_t ? 1250 - 250 * eo(prog(t, c.t0, .6)) : 960}px)`;
      enter(d.querySelector('.ft'), t, c.b_t + .4, .4, 10, 4); } },
};

function init(tl) {
  TL = tl;
  TL.geoms.sort((a, b) => a[0] - b[0]);
  TL.cues.forEach(c => { const d = K[c.type].make(c); d.style.zIndex = c.z || 40; CUES.push([c, d]); });
  // which picture is on screen at every frame, and where it changes (for dissolves)
  const n = Math.round(TL.dur * TL.fps);
  for (let k = 0; k < n; k++) { const t = k / TL.fps; let a = -1; TL.items.forEach((i, j) => { if (i.t0 <= t + 1e-6 && t < i.t1 - 1e-6) a = j; }); ACTIVE.push(a); }
  for (let k = 1; k < n; k++) if (ACTIVE[k] !== ACTIVE[k - 1]) CHANGES.push(k);
  return true;
}

function geoAt(t) {
  let prev = 'full', cur = 'full', t0 = -1, dur = 0;
  for (const [tk, name, d] of TL.geoms) { if (tk <= t) { prev = cur; cur = name; t0 = tk; dur = d; } }
  const u = dur > 0 ? eio(prog(t, t0, dur)) : 1, A = GEO[prev], B = GEO[cur], g = {name: cur, u};
  for (const k of ['x', 'y', 'w', 'h', 'r']) g[k] = A[k] + (B[k] - A[k]) * u;
  if (cur === 'none') { g.fade = 1 - u; g.hide = u >= 1; }
  return g;
}
function zAt(it, t) {
  let z = it.z || 1;
  if (it.zk) { const [[a, z0], [b, z1]] = it.zk; z = z0 + (z1 - z0) * eio(prog(t, a, Math.max(.01, b - a))); }
  if (it.zc) { let p = 1; for (const [tc, zz] of it.zc) if (tc <= t + 1e-4) p = zz; z *= p; }  // a static punch-in on each jump cut
  return z;
}
function txFx(img, kind, u, g) {  // an extra push on the incoming picture (zoom: through a blur; punch: a small settle on a beat cut)
  const e = eo(u), s = 1 + (kind === 'zoom' ? .16 : .06) * (1 - e);
  img.style.transform = `translate(${g.w / 2}px,${g.h / 2}px) scale(${s}) translate(${-g.w / 2}px,${-g.h / 2}px) ` + img.style.transform;
  img.style.filter = kind === 'zoom' && u < 1 ? `blur(${(1 - e) * 9}px)` : 'none';
}
function frozen(it, t) { return it.freeze && t >= it.freeze[0] && t < it.freeze[1]; }
function frameIdx(it, t) { if (frozen(it, t)) return it.freeze[2]; return clamp((it.off || 0) + Math.floor((t - it.t0) * TL.fps + 1e-4), 0, it.n - 1); }
function dissolveFor(inc, out) {
  if (!inc || !out) return 0;
  if (inc.kind === 'cut' || out.kind === 'cut') return 0;
  if (inc.dx !== undefined) return inc.dx;
  if (out.shot && inc.shot === out.shot) return 0;  // the same take continues: no transition needed
  if (inc.kind === 'talk' && out.kind === 'talk') return 0;  // him to him: a clean cut at the sentence, never a ghosted face
  return .32;
}
// place an image (talk crop around the locked head position, or cover-fit B-roll) into the frame box
function place(img, it, idx, t, g) {
  const iw = img.naturalWidth || 1920, ih = img.naturalHeight || 1080, z = zAt(it, t);
  let sc, ox, oy;
  if (it.kind === 'talk') {
    const [hx, hy] = it.track[Math.min(idx, it.track.length - 1)];
    let ch = ih / z, cw = ch * g.w / g.h; if (cw > iw) { cw = iw; ch = cw * g.h / g.w; }
    const cx = clamp(hx, cw / 2, iw - cw / 2), cy = clamp(hy + ch * (.5 - .37), ch / 2, ih - ch / 2);
    sc = g.w / cw; ox = -(cx - cw / 2) * sc; oy = -(cy - ch / 2) * sc;
  } else {
    const kz = it.kb ? it.kb[0] + (it.kb[1] - it.kb[0]) * prog(t, it.t0, it.t1 - it.t0) : 1;
    sc = Math.max(g.w / iw, g.h / ih) * kz; ox = (g.w - iw * sc) / 2; oy = (g.h - ih * sc) * (it.fy ?? .5);
  }
  img.style.width = iw + 'px'; img.style.height = ih + 'px'; img.style.transform = `translate(${ox}px,${oy}px) scale(${sc})`;
}

async function render(t) {
  pending = [];
  const k = Math.round(t * TL.fps), x = {k, t};
  let bg = 'ink'; for (const [a, b, kind] of TL.bgs) if (a <= t && t < b) bg = kind;
  x.bg = bg; document.querySelectorAll('#bg>div').forEach(d => d.style.display = d.className === bg ? 'block' : 'none');
  const g = geoAt(t); x.geo = g;
  const ai = ACTIVE[Math.min(k, ACTIVE.length - 1)], it = ai >= 0 ? TL.items[ai] : null;
  // the outgoing picture during a dissolve
  let out = null, ou = 1;
  let ck = -1; for (const c of CHANGES) if (c <= k) ck = c;
  if (ck > 0 && it) { const o = TL.items[ACTIVE[ck - 1]], dx = dissolveFor(it, o), u = (k - ck) / TL.fps;
    if (o && dx > 0 && u < dx) { out = o; ou = eio(u / dx); } }
  const since = ck >= 0 ? (k - ck) / TL.fps : 1e9;
  const F = $('#frame'), FA = $('#fa'), FB = $('#fb'), C = $('#cut'), CB = $('#cutbg'), FZ = $('#fz'), FL = $('#fl');
  F.style.display = 'none'; C.style.display = 'none'; CB.style.display = 'none'; FB.style.display = 'none'; FZ.style.display = 'none'; FL.style.display = 'none';
  if (it && it.kind === 'cut') {
    const idx = frameIdx(it, t), [hx, hy] = it.track[Math.min(idx, it.track.length - 1)], S = 1.778 * zAt(it, t);
    await Promise.all([setImg(C, `${it.dir}/cut/${pad(idx + 1)}.webp`), setImg(CB, `${it.dir}/${pad(idx + 1)}.jpg`)]);
    const left = clamp(540 - hx * S, 1080 - 1920 * S, 0), top = clamp(860 - hy * S, 1920 - 1080 * S, 0);
    for (const im of [C, CB]) { im.style.display = 'block'; im.style.width = 1920 * S + 'px'; im.style.height = 1080 * S + 'px'; im.style.transform = `translate(${left}px,${top}px)`; }
  } else if (it && !g.hide && g.w > 2) {
    const idx = frameIdx(it, t);
    const jobs = [setImg(FA, `${it.dir}/${pad(idx + 1)}.jpg`)];
    if (out) jobs.push(setImg(FB, `${out.dir}/${pad(frameIdx(out, t) + 1)}.jpg`));
    const fz = frozen(it, t); if (fz) jobs.push(setImg(FZ, it.fz));
    await Promise.all(jobs);
    F.style.display = 'block'; F.style.opacity = g.fade ?? 1; F.style.filter = g.fade !== undefined ? `blur(${(1 - g.fade) * 10}px)` : 'none';
    Object.assign(F.style, {left: g.x + 'px', top: g.y + 'px', width: g.w + 'px', height: g.h + 'px', borderRadius: g.r + 'px',
      boxShadow: g.name === 'full' ? 'none' : (bg === 'paper' ? '0 30px 70px rgba(40,30,20,.24)' : '0 0 0 1px rgba(247,241,230,.08)')});
    place(FA, it, idx, t, g); FA.style.filter = 'none';
    if (it.tx && since < (it.txd || .3)) txFx(FA, it.tx, since / (it.txd || .3), g);
    if (fz) { const u = prog(t, it.freeze[0], .4), s = 1 + .035 * spring(u);
      FA.style.filter = `brightness(${1 - .62 * eo(prog(t, it.freeze[0], .2))}) saturate(.7) blur(${2 * eo(u)}px)`;
      FZ.style.display = 'block'; FZ.style.width = FA.style.width; FZ.style.height = FA.style.height;
      FZ.style.transform = `translate(${g.w / 2}px,${g.h * .45}px) scale(${s}) translate(${-g.w / 2}px,${-g.h * .45}px) ` + FA.style.transform;
      FL.style.display = 'block'; FL.style.opacity = .85 * (1 - prog(t, it.freeze[0], .16)); }
    if (out) { FB.style.display = 'block'; FB.style.opacity = 1 - ou; place(FB, out, frameIdx(out, t), t, g);
      if (it.tx === 'zoom') FB.style.transform = `translate(${g.w / 2}px,${g.h / 2}px) scale(${1 + .1 * ou}) translate(${-g.w / 2}px,${-g.h / 2}px) ` + FB.style.transform; }
  }
  for (const [c, d] of CUES) { const on = c.t0 <= t && t < c.t1; d.style.display = on ? 'block' : 'none'; if (on) K[c.type].upd(d, c, t, x); }
  // captions: the line in clean sentence case, spoken words fully white
  const cap = $('#cap'); let cc = null; for (const c of TL.caps) if (c.t0 <= t && t < c.t1) cc = c;
  if (cc) { cap.style.display = 'block'; const ov = (TL.capy || []).find(([a, b]) => a <= t && t < b); cap.style.top = (ov ? ov[2] : (CAPY[g.name] || 1440)) + 'px';  // per-shot override: above a tight face
    if (cap._c !== cc) { cap._c = cc; cap.innerHTML = cc.w.map(([w]) => `<span class="cw">${w}</span>`).join(' ') + '<i class="box"><b></b><b></b><b></b><b></b></i>'; }
    const ws = cap.querySelectorAll('.cw'); let cur = -1;
    ws.forEach((sp, i) => { const a = cc.w[i][1], e = eo(prog(t, cc.t0 + i * .035, .3));
      sp.style.opacity = e; sp.style.transform = `perspective(500px) translateY(${(1 - e) * 22}px) rotateX(${(1 - e) * -80}deg)`;
      sp.classList.toggle('done', t >= a); if (t >= a) cur = i; });
    const bx = cap.querySelector('.box');
    if (cur >= 0) { const R1 = ws[cur], R0 = cur > 0 ? ws[cur - 1] : R1, u = eo(prog(t, cc.w[cur][1], .1)), m = (a, b) => a + (b - a) * u;
      bx.style.display = 'block'; bx.style.left = (m(R0.offsetLeft, R1.offsetLeft) - 10) + 'px'; bx.style.top = (m(R0.offsetTop, R1.offsetTop) - 3) + 'px';
      bx.style.width = (m(R0.offsetWidth, R1.offsetWidth) + 20) + 'px'; bx.style.height = (m(R0.offsetHeight, R1.offsetHeight) + 6) + 'px'; }
    else bx.style.display = 'none';
    cap.style.opacity = prog(t, cc.t0, .12) * (1 - prog(t, cc.t1 - .1, .1)); }
  else cap.style.display = 'none';
  const R = rng(k + 99); $('#grain').style.backgroundPosition = `${Math.floor(R() * 256)}px ${Math.floor(R() * 256)}px`;
  $('#grain').style.mixBlendMode = bg === 'paper' ? 'multiply' : 'overlay';
  await Promise.all(pending);
  return true;
}
