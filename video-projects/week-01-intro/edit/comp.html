  weekstamp: {
    make(c) { return el(`<div style="position:absolute;inset:0;background:rgba(5,5,5,.42)"></div>
      <div class="ws" style="position:absolute;left:0;right:0;top:640px;text-align:center;font-size:270px"><span class="stamp">WEEK 1</span></div>
      <div class="of mono" style="position:absolute;left:0;right:0;top:1000px;text-align:center;font-size:46px;color:#F5F3EE">OF 52</div>
      <div class="bar" style="position:absolute;left:72px;right:72px;top:1090px;display:grid;grid-template-columns:repeat(52,1fr);gap:4px">${Array.from({length: 52}, (_, i) => `<i style="height:30px;display:block;border:2px solid rgba(245,243,238,.5)"></i>`).join('')}</div>`, '', 'inset:0'); },
    upd(d, c, t) { const ws = d.querySelector('.ws'), [dx, dy] = shake(t, c.t0, 16); ws.style.transform = `translate(${dx}px,${dy}px) rotate(-8deg) scale(${slamT(t, c.t0, 2.1, .12)})`;
      d.querySelector('.of').style.opacity = prog(t, c.t0 + .2, .1); const b = d.querySelector('.bar'); b.style.opacity = prog(t, c.t0 + .25, .1);
      b.firstChild.style.background = prog(t, c.t0 + .45, .1) > .5 ? '#E8231C' : 'transparent'; b.firstChild.style.borderColor = '#E8231C'; } },
  mail: {
    make(c) { return el(`<img src="../assets/rejections/img_8646.jpg" style="width:560px;border-radius:40px;border:12px solid #111;box-shadow:0 30px 60px rgba(0,0,0,.5)">`, '', 'left:260px;top:430px'); },
    upd(d, c, t) { d.style.transform = `rotate(-5deg) scale(${slamT(t, c.t0, 1.3, .1)})`; } },
  label: {
    make(c) { return el(c.text, '', 'left:70px;top:1440px;font:800 92px/1 BC;color:#F5F3EE;background:#E8231C;padding:8px 26px 12px;box-shadow:8px 8px 0 #000'); },
    upd(d, c, t) { const u = eo(prog(t, c.t0, .12)); d.style.transform = `translateX(${(1 - u) * -500}px) rotate(-3deg)`; } },
  cats: {
    make(c) { return el(`<img class="ci" style="position:absolute;left:-177px;top:-361px;width:1476px">
      <div style="position:absolute;left:150px;top:300px;font:400 italic 150px/1 NR;color:#D9372B">me</div>
      <div style="position:absolute;right:140px;top:300px;font:400 italic 150px/1 NR;color:#D9372B">you</div>
      <svg style="position:absolute;left:0;top:0" width="1080" height="1920"><g fill="none" stroke="#D9372B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
        <path class="a1" pathLength="1" stroke-dasharray="1" d="M245 470 C 236 530, 262 585, 318 625"/><path class="a2" pathLength="1" stroke-dasharray="1" d="M282 600 L 320 627 L 326 584"/>
        <path class="a3" pathLength="1" stroke-dasharray="1" d="M845 470 C 856 530, 826 588, 770 628"/><path class="a4" pathLength="1" stroke-dasharray="1" d="M764 584 L 768 630 L 812 618"/></g></svg>
      <div class="q" style="position:absolute;left:0;right:0;top:1250px;text-align:center;font:700 70px/1.15 GS;color:#1D1C1A">where are you<br><span style="background:#E8231C;color:#fff;padding:0 14px">starting from?</span></div>
      <div class="mono" style="position:absolute;left:0;right:0;top:1460px;text-align:center;font-size:30px;color:#6B675F">WEEK 01 OF 52 &middot; @BUILDWITH.VISH</div>
      <div class="mono" style="position:absolute;left:0;right:0;top:1515px;text-align:center;font-size:22px;color:#8a857b">cats: @meowtakeover</div>`, '', 'inset:0'); },
    upd(d, c, t) { const i = clamp(Math.floor((t - c.t0) * TL.fps), 0, c.n - 1);
      x_pending.push(setImg(d.querySelector('.ci'), `${c.dir}/${pad(i + 1)}.webp`));
      ['a1', 'a2', 'a3', 'a4'].forEach((a, j) => d.querySelector('.' + a).setAttribute('stroke-dashoffset', 1 - eo(prog(t, c.t0 + .15 + (j % 2) * .18 + (j > 1 ? .12 : 0), .2))));
      const q = d.querySelector('.q'), u = eo(prog(t, c.t0 + .5, .3)); q.style.opacity = u; q.style.transform = `translateY(${(1 - u) * 30}px)`; } },
};

let x_pending = [];

function init(tl) {
  TL = tl;
  TL.geoms.sort((a, b) => a[0] - b[0]);
  TL.cues.forEach(c => { const d = K[c.type].make(c); d.style.zIndex = c.z || 40; CUES.push([c, d]); });
  return true;
}

function geoAt(t) {
  let prev = 'full', cur = 'full', t0 = -1, dur = 0;
  for (const [tk, name, d] of TL.geoms) { if (tk <= t) { prev = cur; cur = name; t0 = tk; dur = d; } }
  const u = dur > 0 ? eio(prog(t, t0, dur)) : 1, A = GEO[prev], B = GEO[cur], g = {name: cur, u};
  for (const k of ['x', 'y', 'w', 'h', 'r']) g[k] = A[k] + (B[k] - A[k]) * u;
  if (cur === 'none' || (prev === 'none' && u < 1)) g.hide = true;
  return g;
}

function zAt(it, t) {
  if (!it.zk) return it.z || 1;
  const [[a, z0], [b, z1]] = it.zk; return z0 + (z1 - z0) * eio(prog(t, a, Math.max(.01, b - a)));
}

async function render(t) {
  x_pending = [];
  const k = Math.round(t * TL.fps), x = {k, t};
  // background
  let bg = 'ink'; for (const [a, b, kind] of TL.bgs) if (a <= t && t < b) bg = kind;
  x.bg = bg; document.querySelectorAll('#bg>div').forEach(d => d.style.display = d.className === bg ? 'block' : 'none');
  // picture
  const g = geoAt(t); x.geo = g;
  let it = null; for (const i of TL.items) if (i.t0 <= t + 1e-6 && t < i.t1 - 1e-6) it = i;
  const F = $('#frame'), FI = $('#fimg'), C = $('#cut');
  F.style.display = 'none'; C.style.display = 'none';
  if (it) {
    const idx = clamp(Math.floor((t - it.t0) * TL.fps + 1e-4), 0, it.n - 1), z = zAt(it, t);
    if (it.kind === 'cut') {
      const [hx, hy] = it.track[Math.min(idx, it.track.length - 1)], S = 1.5 * z;
      await setImg(C, `${it.dir}/cut/${pad(idx + 1)}.webp`);
      C.style.display = 'block'; C.style.width = 1920 * S + 'px'; C.style.height = 1080 * S + 'px';
      const top = Math.max(820 - hy * S, 1920 - 1080 * S + 10);
      C.style.transform = `translate(${540 - hx * S}px,${top}px)`;
    } else if (!g.hide && g.w > 2) {
      await setImg(FI, `${it.dir}/${pad(idx + 1)}.jpg`);
      F.style.display = 'block';
      Object.assign(F.style, {left: g.x + 'px', top: g.y + 'px', width: g.w + 'px', height: g.h + 'px', borderRadius: g.r + 'px',
        boxShadow: g.name === 'full' ? 'none' : (bg === 'paper' ? '0 24px 60px rgba(40,30,20,.28)' : '0 0 0 2px rgba(245,243,238,.10)')});
      const iw = FI.naturalWidth || 1920, ih = FI.naturalHeight || 1080;
      let sc, ox, oy;
      if (it.kind === 'talk') {
        const [hx, hy] = it.track[Math.min(idx, it.track.length - 1)];
        let ch = ih / z, cw = ch * g.w / g.h; if (cw > iw) { cw = iw; ch = cw * g.h / g.w; }
        const cx = clamp(hx, cw / 2, iw - cw / 2), cy = clamp(hy + ch * (.5 - .36), ch / 2, ih - ch / 2);
        sc = g.w / cw; ox = -(cx - cw / 2) * sc; oy = -(cy - ch / 2) * sc;
      } else {
        const kz = it.kb ? it.kb[0] + (it.kb[1] - it.kb[0]) * prog(t, it.t0, it.t1 - it.t0) : 1;
        sc = Math.max(g.w / iw, g.h / ih) * kz; ox = (g.w - iw * sc) / 2; oy = (g.h - ih * sc) / 2;
      }
      FI.style.width = iw + 'px'; FI.style.height = ih + 'px'; FI.style.transform = `translate(${ox}px,${oy}px) scale(${sc})`;
    }
  }
  // graphics
  for (const [c, d] of CUES) { const on = c.t0 <= t && t < c.t1; d.style.display = on ? 'block' : 'none'; if (on) K[c.type].upd(d, c, t, x); }
  // captions
  const cap = $('#cap'); let cc = null; for (const c of TL.caps) if (c.t0 <= t && t < c.t1) cc = c;
  if (cc) { cap.style.display = 'block'; cap.style.top = (CAPY[g.name] || 1420) + 'px';
    cap.innerHTML = cc.w.map(([w, a, b]) => `<span class="${a <= t && t < Math.max(b, a + .12) ? 'on' : ''}">${w}</span>`).join(' ');
    const u = prog(t, cc.t0, .08); cap.style.transform = `scale(${1.08 - .08 * u})`; }
  else cap.style.display = 'none';
  // grain moves every frame
  const R = rng(k + 99); $('#grain').style.backgroundPosition = `${Math.floor(R() * 256)}px ${Math.floor(R() * 256)}px`;
  $('#grain').style.mixBlendMode = bg === 'paper' ? 'multiply' : 'overlay';
  await Promise.all(x_pending);
  return true;
}
</script>
