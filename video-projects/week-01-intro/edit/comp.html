<!doctype html>
<html><head><meta charset="utf-8"><title>week 1 comp</title>
<!-- Week 1 compositor, v3 (Vish, 22 Oct: premium, calm, no abrupt moves). Type: Instrument Serif for the emotional
     lines, Inter Tight for facts, Geist Mono for small labels; one warm lamp-amber accent. Motion: words rise in as
     he says them, soft dissolves between shots, a locked camera. -->
<style>

@font-face{font-family:IS;font-style:italic;src:url(/home/user/linkedin-carousel-studio/templates/fonts-extra/instrument-serif-latin-400-italic.woff2)}
@font-face{font-family:IT;font-weight:500;src:url(/home/user/linkedin-carousel-studio/templates/fonts-extra/inter-tight-latin-500-normal.woff2)}

@font-face{font-family:IT;font-weight:700;src:url(/home/user/linkedin-carousel-studio/templates/fonts-extra/inter-tight-latin-700-normal.woff2)}
@font-face{font-family:GM;font-weight:500;src:url(/home/user/linkedin-carousel-studio/templates/node_modules/@fontsource/geist-mono/files/geist-mono-latin-500-normal.woff2)}
:root{--ink:#0A0A0B;--bone:#F7F1E6;--amber:#E7A15A;--graphite:#1D1C1A;--paper:#ECE8E0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
.L{position:absolute;inset:0}
#bg>div{position:absolute;inset:0;display:none}
#bg .ink{background:radial-gradient(ellipse 80% 36% at 50% 0%,#211a14 0%,#0A0A0B 72%)}

.mono{font-family:GM;font-weight:500;letter-spacing:.24em;text-transform:uppercase}
.am{color:var(--amber)}
.w{display:inline-block;will-change:transform,opacity}
.sh{text-shadow:0 2px 28px rgba(0,0,0,.42),0 1px 2px rgba(0,0,0,.35)}
.band{left:56px;right:56px;bottom:1584px;text-align:center;color:var(--bone)}
.tb{color:var(--bone)}

#cap{position:absolute;left:120px;right:120px;z-index:50;text-align:center;font:600 50px/1.2 IT;letter-spacing:-.01em;color:#fff;
 text-shadow:0 2px 22px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.5)}
#cap span{color:rgba(255,255,255,.58)}
#cap span.on,#cap span.done{color:#fff}
#grain{z-index:70;pointer-events:none;opacity:.12;mix-blend-mode:overlay;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='256' height='256' filter='url(%23n)'/></svg>")}
</style></head><body>
<div id="bg" class="L"><div class="ink"></div><div class="paper"></div><div class="black"></div></div>
<img id="cutbg"><div id="frame"><img id="fa"><img id="fb"></div><img id="cut">

<div id="cap"></div>

<script>
const GEO = {full: {x: 0, y: 0, w: 1080, h: 1920, r: 0}, f45: {x: 40, y: 360, w: 1000, h: 1250, r: 28},
             split: {x: 0, y: 960, w: 1080, h: 960, r: 0}, none: {x: 400, y: 720, w: 280, h: 350, r: 40}};
const CAPY = {full: 1500, f45: 1440, split: 1560, none: 1500};
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const eo = u => 1 - Math.pow(1 - u, 3);
const eio = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const prog = (t, t0, d) => clamp((t - t0) / d, 0, 1);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const pad = n => String(n).padStart(5, '0');
const $ = s => document.querySelector(s);
let TL, CUES = [], ACTIVE = [], CHANGES = [], pending = [];

function setImg(el, src) {
  if (el.dataset.s === src) return Promise.resolve();
  el.dataset.s = src; el.src = src;
  return el.decode().catch(() => {});
}
function el(html, cls, css) { const d = document.createElement('div'); d.className = 'cue ' + (cls || ''); d.innerHTML = html || ''; if (css) d.style.cssText += css; $('#cues').appendChild(d); return d; }
// the one motion: rise + fade + defocus in, fade out
function enter(node, t, t0, d = .45, rise = 22, blur = 8) { const u = eo(prog(t, t0, d));
  node.style.opacity = u; node.style.transform = `translateY(${(1 - u) * rise}px)`; node.style.filter = u < 1 ? `blur(${(1 - u) * blur}px)` : 'none'; }
function fadeOut(node, t, t1, d = .28) { const v = 1 - prog(t, t1 - d, d); node.style.opacity = (+node.style.opacity || 1) * v; }

// ---------------------------------------------------------------- cue types
const K = {
  // text block; words appear as he says them when c.words is given ([html, t] pairs)
  title: {
    make(c) { const inner = c.words ? c.words.map(([w], i) => w === '\n' ? '<br>' : `<span class="w" data-i="${i}">${w}</span>`).join(' ') : c.html;
      const pos = c.band ? '' : `left:${c.x ?? 0}px;right:${c.x ?? 0}px;top:${c.y}px;text-align:${c.align || 'center'};`;
      return el(`<div class="tb ${c.font} ${c.shadow === 0 ? '' : 'sh'}" style="font-size:${c.size}px;line-height:${c.lh || (c.font === 'serif' ? .94 : .92)};${c.color ? 'color:' + c.color + ';' : ''}${c.ls ? 'letter-spacing:' + c.ls + ';' : ''}${c.italic ? 'font-style:italic;' : ''}">${inner}</div>`,
        c.band ? 'band' : '', pos); },
    upd(d, c, t, x) {
      if (c.band) d.classList.toggle('dark', x.bg === 'paper');
      const tb = d.firstChild;
      if (c.words) { tb.style.opacity = 1; tb.style.filter = 'none'; tb.style.transform = 'none';
        d.querySelectorAll('.w').forEach(w => enter(w, t, Math.max(c.t0, c.words[+w.dataset.i][1] - .06), .42, 18, 6)); }
      else enter(tb, t, c.t0, c.din || .5, c.rise ?? 22, 8);
      if (c.push) tb.style.transform += ` scale(${1 + c.push * prog(t, c.t0, c.t1 - c.t0)})`;
      fadeOut(tb, t, c.t1, c.dout || .3); } },
  week: {
    make(c) { return el(`<div class="mono" style="font-size:22px;color:rgba(247,241,230,.72)">Week 01 <span style="opacity:.55">of 52</span></div>
      <div style="width:240px;height:3px;margin:12px auto 0;background:rgba(247,241,230,.18);border-radius:2px;overflow:hidden"><i style="display:block;height:100%;width:1.92%;background:#E7A15A"></i></div>`, '',
      'left:0;right:0;top:92px;text-align:center'); },
    upd(d, c, t, x) { const hid = (c.hide || []).some(([a, b]) => a <= t && t < b);
      d.style.display = (['f45', 'full'].includes(x.geo.name) && x.geo.u >= 1 && !hid) ? 'block' : 'none';
      d.firstElementChild.style.color = x.bg === 'paper' ? 'rgba(29,28,26,.7)' : 'rgba(247,241,230,.72)'; d.style.opacity = prog(t, c.t0, .5); } },
  pass: {
    make(c) { return el(`<div style="width:860px;background:#F7F3EC;border-radius:30px;padding:38px 46px 34px;box-shadow:0 40px 90px rgba(0,0,0,.45);color:#1D1C1A">
      <div class="mono" style="display:flex;justify-content:space-between;font-size:20px;color:#7d776d"><span>Boarding pass</span><span>Week 01</span></div>
      <div style="display:flex;gap:70px;margin-top:26px"><div><div class="mono" style="font-size:18px;color:#9a948a">Passenger</div><div style="font:700 54px/1.1 IT;letter-spacing:-.03em">Vish</div></div>
      <div><div class="mono" style="font-size:18px;color:#9a948a">Status</div><div style="font:700 54px/1.1 IT;letter-spacing:-.03em">Booked</div></div></div>
      <div class="mono" style="font-size:18px;color:#9a948a;margin-top:26px">To</div><div style="font:400 italic 150px/.95 IS;letter-spacing:-.01em">Sri Lanka</div>
      <div style="height:56px;margin-top:24px;opacity:.85;background:repeating-linear-gradient(90deg,#1D1C1A 0 3px,transparent 3px 8px,#1D1C1A 8px 13px,transparent 13px 16px,#1D1C1A 16px 18px,transparent 18px 24px)"></div></div>`, '', 'left:110px;top:1040px'); },
    upd(d, c, t) { const u = eo(prog(t, c.t0, .6)); d.style.opacity = u; d.style.transform = `translateY(${(1 - u) * 120}px)`; fadeOut(d, t, c.t1, .3); } },
  age: {
    make(c) { return el(`<div class="mono" style="font-size:20px;color:rgba(247,241,230,.8)">Age</div><div class="n" style="font:700 150px/.9 IT;letter-spacing:-.04em;color:#F7F1E6"></div>`, 'sh', 'left:92px;top:1330px'); },
    upd(d, c, t) { d.querySelector('.n').textContent = String(Math.round(1 + 26 * eio(prog(t, c.t0, (c.t1 - c.t0) * .9)))); enter(d, t, c.t0, .3, 10, 0); fadeOut(d, t, c.t1, .2); } },
  underline: {  // a hand-drawn amber line under a word in the band
    make(c) { return el(`<svg width="${c.w}" height="40" viewBox="0 0 300 40" preserveAspectRatio="none" style="overflow:visible"><path pathLength="1" d="M4 24 C 70 12, 190 10, 296 18" fill="none" stroke="#E7A15A" stroke-width="5" stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="1"/></svg>`, '', `left:${c.x}px;top:${c.y}px`); },
    upd(d, c, t) { d.querySelector('path').setAttribute('stroke-dashoffset', 1 - eio(prog(t, c.t0, .5))); fadeOut(d, t, c.t1, .3); } },
  wall: {
    make(c) { const ph = [[70, 560, -6], [480, 600, 5], [190, 720, 2], [440, 790, -4]].map(([x, y, r], i) =>
        `<img class="ph" src="../assets/rejections/img_864${4 + i}.jpg" style="position:absolute;left:${x}px;top:${y}px;width:520px;border-radius:44px;border:10px solid #121212;box-shadow:0 40px 80px rgba(0,0,0,.28);transform:rotate(${r}deg)" data-r="${r}">`).join('');
      return el(`<div class="paperbg" style="position:absolute;inset:0"></div>${ph}
        <div class="hd" style="position:absolute;left:0;right:0;top:150px;text-align:center"><div class="cnt" style="font:700 300px/.85 IT;letter-spacing:-.06em;color:#1D1C1A"></div>
        <div style="font:400 italic 76px/1 IS;color:#1D1C1A;margin-top:8px">job rejections</div></div>
        <div class="us" style="position:absolute;left:0;right:0;top:1440px;text-align:center"><span style="font:400 italic 110px/1 IS;color:#1D1C1A;background:linear-gradient(transparent 58%,rgba(231,161,90,.75) 58%);padding:0 18px">Unfortunately,</span></div>`, '', 'inset:0'); },
    upd(d, c, t) { const u0 = eo(prog(t, c.t0, .4)); d.style.opacity = u0 * (1 - prog(t, c.t1 - .45, .45));
      d.querySelector('.cnt').textContent = Math.round(220 * eo(prog(t, c.count_t, c.count_d)));
      d.querySelectorAll('.ph').forEach((p, i) => { const u = eo(prog(t, c.count_t + i * .22, .5)); p.style.opacity = u;
        p.style.transform = `translateY(${(1 - u) * 60}px) rotate(${p.dataset.r}deg)`; });
      enter(d.querySelector('.us'), t, c.stamp_t, .5, 18, 6); } },
  stats: {
    make(c) { const rows = c.fills.map(([n, v, note]) => `<div class="row">
        <div style="display:flex;justify-content:space-between;font:500 27px IT;letter-spacing:-.005em;color:${v <= 1 ? '#E7A15A' : 'rgba(247,241,230,.92)'}"><span>${n}</span><span class="val" style="font:500 20px GM;letter-spacing:.12em">${note || v + ' / 10'}</span></div>
        <div style="height:4px;margin-top:10px;background:rgba(247,241,230,.12);border-radius:2px;overflow:hidden"><i style="display:block;height:100%;width:0;background:${v <= 1 ? '#E7A15A' : '#F7F1E6'};border-radius:2px"></i></div></div>`).join('');
      return el(`<div style="background:rgba(20,18,16,.82);border:1px solid rgba(247,241,230,.14);border-radius:28px;padding:36px 44px 38px;color:#F7F1E6;box-shadow:0 30px 80px rgba(0,0,0,.35)">
        <div style="display:flex;justify-content:space-between;align-items:baseline"><div style="font:400 italic 92px/.9 IS">Vish</div><div class="mono" style="font-size:20px;color:rgba(247,241,230,.6)">Level 27 · Week 01</div></div>
        <div style="display:grid;gap:22px;margin-top:30px">${rows}</div>
        <div style="margin-top:30px;font:400 italic 40px/1.1 IS;color:rgba(247,241,230,.86)">Main quest: <span style="color:#E7A15A">work remotely, travel the world.</span></div></div>`, '', 'left:56px;right:56px;top:96px'); },
    upd(d, c, t) { enter(d.firstChild, t, c.t0, .5, 20, 6); fadeOut(d.firstChild, t, c.t1, .35);
      d.querySelectorAll('.row').forEach((r, i) => { const [n, v, note, ft] = c.fills[i], weak = v <= 1;
        r.style.opacity = .3 + .7 * eo(prog(t, ft, .35));
        r.querySelector('i').style.width = (Math.max(weak ? 1.5 : 0, v * 10) * eio(prog(t, ft, .7))) + '%'; }); } },
  chips: {
    make(c) { return el(c.items.map(s => `<div class="p" style="position:absolute;white-space:nowrap;font:600 38px IT;letter-spacing:-.01em;color:#F7F1E6;background:rgba(20,18,16,.62);border:1px solid rgba(247,241,230,.22);padding:10px 22px 12px;border-radius:40px;backdrop-filter:blur(6px)"><span style="color:#E7A15A">+1</span> ${s}</div>`).join(''), '', 'inset:0'); },
    upd(d, c, t) { d.querySelectorAll('.p').forEach((p, i) => { const t0 = c.t0 + i * c.step, u = prog(t, t0, 1.6);
      p.style.display = (t >= t0 && u < 1) ? 'block' : 'none'; p.style.left = (i % 2 ? 560 : 120) + 'px';
      p.style.top = (1250 - eo(u) * 140) + 'px'; p.style.opacity = Math.min(eo(prog(t, t0, .3)), 1 - prog(t, t0 + 1.1, .5)); }); } },
  weekcard: {
    make(c) { return el(`<div class="scrim" style="position:absolute;inset:0;background:radial-gradient(ellipse 90% 60% at 50% 48%,rgba(5,5,5,.72),rgba(5,5,5,.86))"></div>
      <div class="wk" style="position:absolute;left:0;right:0;top:700px;text-align:center;color:#F7F1E6">
        <div style="font:700 250px/.85 IT;letter-spacing:-.06em">Week 1</div>
        <div style="font:400 italic 92px/1 IS;margin-top:12px;color:rgba(247,241,230,.86)">of 52</div>
        <div class="bar" style="width:760px;margin:46px auto 0;display:grid;grid-template-columns:repeat(52,1fr);gap:4px">${Array.from({length: 52}, () => '<i style="height:14px;display:block;border-radius:2px;background:rgba(247,241,230,.16)"></i>').join('')}</div></div>`, '', 'inset:0'); },
    upd(d, c, t) { d.querySelector('.scrim').style.opacity = eo(prog(t, c.t0, .4)) * (1 - prog(t, c.t1 - .4, .4));
      const wk = d.querySelector('.wk'), u = eo(prog(t, c.t0 + .05, .6)); wk.style.opacity = u * (1 - prog(t, c.t1 - .35, .35));
      wk.style.transform = `scale(${1.04 - .04 * u})`; wk.style.filter = u < 1 ? `blur(${(1 - u) * 8}px)` : 'none';
      d.querySelector('.bar').firstChild.style.background = prog(t, c.t0 + .6, .3) > .5 ? '#E7A15A' : 'rgba(247,241,230,.16)'; } },
  mail: {
    make(c) { return el(`<img src="../assets/rejections/img_8646.jpg" style="width:520px;border-radius:44px;border:10px solid #121212;box-shadow:0 40px 80px rgba(0,0,0,.5)">`, '', 'left:280px;top:440px'); },
    upd(d, c, t) { enter(d, t, c.t0, .3, 30, 0); d.style.transform += ' rotate(-3deg)'; } },
  label: {
    make(c) { return el(`<div style="width:56px;height:3px;background:#E7A15A;margin-bottom:16px"></div><div style="font:700 74px/1 IT;letter-spacing:-.04em;color:#F7F1E6">${c.text}</div>`, 'sh', 'left:96px;top:1390px'); },
    upd(d, c, t) { enter(d, t, c.t0, .3, 14, 4); fadeOut(d, t, c.t1, .15); } },
  cats: {
    make(c) { return el(`<div class="paperbg" style="position:absolute;inset:0"></div><img class="ci" style="position:absolute;left:-177px;top:-361px;width:1476px">
      <div class="lb" style="position:absolute;left:150px;top:300px;font:400 italic 140px/1 IS;color:#1D1C1A">me</div>
      <div class="lb" style="position:absolute;right:140px;top:300px;font:400 italic 140px/1 IS;color:#1D1C1A">you</div>
      <svg style="position:absolute;left:0;top:0" width="1080" height="1920"><g fill="none" stroke="#E7A15A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <path class="a1" pathLength="1" stroke-dasharray="1" d="M245 470 C 236 530, 262 585, 318 625"/><path class="a2" pathLength="1" stroke-dasharray="1" d="M282 600 L 320 627 L 326 584"/>
        <path class="a3" pathLength="1" stroke-dasharray="1" d="M845 470 C 856 530, 826 588, 770 628"/><path class="a4" pathLength="1" stroke-dasharray="1" d="M764 584 L 768 630 L 812 618"/></g></svg>
      <div class="q" style="position:absolute;left:0;right:0;top:1240px;text-align:center;font:400 84px/1.02 IS;color:#1D1C1A">Where are you<br><i style="color:#B8742F">starting from?</i></div>
      <div class="mono" style="position:absolute;left:0;right:0;top:1470px;text-align:center;font-size:22px;color:#6B675F">Week 01 of 52 · @buildwith.vish</div>
      <div class="mono" style="position:absolute;left:0;right:0;top:1515px;text-align:center;font-size:16px;letter-spacing:.14em;color:#8a857b">cats: @meowtakeover</div>`, '', 'inset:0'); },
    upd(d, c, t) { const i = clamp(Math.floor((t - c.t0) * TL.fps), 0, c.n - 1);
      pending.push(setImg(d.querySelector('.ci'), `${c.dir}/${pad(i + 1)}.webp`));
      const um = eio(prog(t, c.t0, c.morph || .25)); d.style.opacity = um;
      const ci = d.querySelector('.ci'); ci.style.transform = `scale(${1.25 - .25 * um})`; ci.style.transformOrigin = '717px 1261px';
      ci.style.filter = um < 1 ? `blur(${(1 - um) * 14}px)` : 'none';
      d.querySelectorAll('.lb').forEach((l, j) => enter(l, t, c.t0 + .2 + j * .15, .4, 14, 6));
      ['a1', 'a2', 'a3', 'a4'].forEach((a, j) => d.querySelector('.' + a).setAttribute('stroke-dashoffset', 1 - eo(prog(t, c.t0 + .35 + (j % 2) * .2 + (j > 1 ? .15 : 0), .35))));
      enter(d.querySelector('.q'), t, c.t0 + .7, .5, 18, 6); } },
};

function init(tl) {
  TL = tl;
  TL.geoms.sort((a, b) => a[0] - b[0]);
  TL.cues.forEach(c => { const d = K[c.type].make(c); d.style.zIndex = c.z || 40; CUES.push([c, d]); });
  // which picture is on screen at every frame, and where it changes (for dissolves)
  const n = Math.round(TL.dur * TL.fps);
  for (let k = 0; k < n; k++) { const t = k / TL.fps; let a = -1; TL.items.forEach((i, j) => { if (i.t0 <= t + 1e-6 && t < i.t1 - 1e-6) a = j; }); ACTIVE.push(a); }
  for (let k = 1; k < n; k++) if (ACTIVE[k] !== ACTIVE[k - 1]) CHANGES.push(k);
  return true;
}

function geoAt(t) {
  let prev = 'full', cur = 'full', t0 = -1, dur = 0;
  for (const [tk, name, d] of TL.geoms) { if (tk <= t) { prev = cur; cur = name; t0 = tk; dur = d; } }
  const u = dur > 0 ? eio(prog(t, t0, dur)) : 1, A = GEO[prev], B = GEO[cur], g = {name: cur, u};
  for (const k of ['x', 'y', 'w', 'h', 'r']) g[k] = A[k] + (B[k] - A[k]) * u;
  if (cur === 'none') { g.fade = 1 - u; g.hide = u >= 1; }
  return g;
}
function zAt(it, t) {
  if (!it.zk) return it.z || 1;
  const [[a, z0], [b, z1]] = it.zk; return z0 + (z1 - z0) * eio(prog(t, a, Math.max(.01, b - a)));
}
function frameIdx(it, t) { return clamp((it.off || 0) + Math.floor((t - it.t0) * TL.fps + 1e-4), 0, it.n - 1); }
function dissolveFor(inc, out) {
  if (!inc || !out) return 0;
  if (inc.kind === 'cut' || out.kind === 'cut') return 0;
  if (inc.dx !== undefined) return inc.dx;
  if (out.shot && inc.shot === out.shot) return 0;  // the same take continues: no transition needed
  if (inc.kind === 'talk' && out.kind === 'talk') return 0;  // him to him: a clean cut at the sentence, never a ghosted face
  return .32;
}
// place an image (talk crop around the locked head position, or cover-fit B-roll) into the frame box
function place(img, it, idx, t, g) {
  const iw = img.naturalWidth || 1920, ih = img.naturalHeight || 1080, z = zAt(it, t);
  let sc, ox, oy;
  if (it.kind === 'talk') {
    const [hx, hy] = it.track[Math.min(idx, it.track.length - 1)];
    let ch = ih / z, cw = ch * g.w / g.h; if (cw > iw) { cw = iw; ch = cw * g.h / g.w; }
    const cx = clamp(hx, cw / 2, iw - cw / 2), cy = clamp(hy + ch * (.5 - .37), ch / 2, ih - ch / 2);
    sc = g.w / cw; ox = -(cx - cw / 2) * sc; oy = -(cy - ch / 2) * sc;
  } else {
    const kz = it.kb ? it.kb[0] + (it.kb[1] - it.kb[0]) * prog(t, it.t0, it.t1 - it.t0) : 1;
    sc = Math.max(g.w / iw, g.h / ih) * kz; ox = (g.w - iw * sc) / 2; oy = (g.h - ih * sc) * (it.fy ?? .5);
  }
  img.style.width = iw + 'px'; img.style.height = ih + 'px'; img.style.transform = `translate(${ox}px,${oy}px) scale(${sc})`;
}

async function render(t) {
  pending = [];
  const k = Math.round(t * TL.fps), x = {k, t};
  let bg = 'ink'; for (const [a, b, kind] of TL.bgs) if (a <= t && t < b) bg = kind;
  x.bg = bg; document.querySelectorAll('#bg>div').forEach(d => d.style.display = d.className === bg ? 'block' : 'none');
  const g = geoAt(t); x.geo = g;
  const ai = ACTIVE[Math.min(k, ACTIVE.length - 1)], it = ai >= 0 ? TL.items[ai] : null;
  // the outgoing picture during a dissolve
  let out = null, ou = 1;
  let ck = -1; for (const c of CHANGES) if (c <= k) ck = c;
  if (ck > 0 && it) { const o = TL.items[ACTIVE[ck - 1]], dx = dissolveFor(it, o), u = (k - ck) / TL.fps;
    if (o && dx > 0 && u < dx) { out = o; ou = eio(u / dx); } }
  const F = $('#frame'), FA = $('#fa'), FB = $('#fb'), C = $('#cut'), CB = $('#cutbg');
  F.style.display = 'none'; C.style.display = 'none'; CB.style.display = 'none'; FB.style.display = 'none';
  if (it && it.kind === 'cut') {
    const idx = frameIdx(it, t), [hx, hy] = it.track[Math.min(idx, it.track.length - 1)], S = 1.778 * zAt(it, t);
    await Promise.all([setImg(C, `${it.dir}/cut/${pad(idx + 1)}.webp`), setImg(CB, `${it.dir}/${pad(idx + 1)}.jpg`)]);
    const left = clamp(540 - hx * S, 1080 - 1920 * S, 0), top = clamp(860 - hy * S, 1920 - 1080 * S, 0);
    for (const im of [C, CB]) { im.style.display = 'block'; im.style.width = 1920 * S + 'px'; im.style.height = 1080 * S + 'px'; im.style.transform = `translate(${left}px,${top}px)`; }
  } else if (it && !g.hide && g.w > 2) {
    const idx = frameIdx(it, t);
    const jobs = [setImg(FA, `${it.dir}/${pad(idx + 1)}.jpg`)];
    if (out) jobs.push(setImg(FB, `${out.dir}/${pad(frameIdx(out, t) + 1)}.jpg`));
    await Promise.all(jobs);
    F.style.display = 'block'; F.style.opacity = g.fade ?? 1; F.style.filter = g.fade !== undefined ? `blur(${(1 - g.fade) * 10}px)` : 'none';
    Object.assign(F.style, {left: g.x + 'px', top: g.y + 'px', width: g.w + 'px', height: g.h + 'px', borderRadius: g.r + 'px',
      boxShadow: g.name === 'full' ? 'none' : (bg === 'paper' ? '0 30px 70px rgba(40,30,20,.24)' : '0 0 0 1px rgba(247,241,230,.08)')});
    place(FA, it, idx, t, g);
    if (out) { FB.style.display = 'block'; FB.style.opacity = 1 - ou; place(FB, out, frameIdx(out, t), t, g); }
  }
  for (const [c, d] of CUES) { const on = c.t0 <= t && t < c.t1; d.style.display = on ? 'block' : 'none'; if (on) K[c.type].upd(d, c, t, x); }
  // captions: the line in clean sentence case, spoken words fully white
  const cap = $('#cap'); let cc = null; for (const c of TL.caps) if (c.t0 <= t && t < c.t1) cc = c;
  if (cc) { cap.style.display = 'block'; cap.style.top = (CAPY[g.name] || 1440) + 'px';
    cap.innerHTML = cc.w.map(([w, a, b]) => `<span class="${t >= a ? 'done' : ''}">${w}</span>`).join(' ');
    cap.style.opacity = prog(t, cc.t0, .12) * (1 - prog(t, cc.t1 - .1, .1)); }
  else cap.style.display = 'none';
  const R = rng(k + 99); $('#grain').style.backgroundPosition = `${Math.floor(R() * 256)}px ${Math.floor(R() * 256)}px`;
  $('#grain').style.mixBlendMode = bg === 'paper' ? 'multiply' : 'overlay';
  await Promise.all(pending);
  return true;
}
</script>
