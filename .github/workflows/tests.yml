name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,ai]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q
      - name: free-llm-helper tests
        working-directory: free-llm-helper
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: free-llm-helper worker tests
        working-directory: free-llm-helper/worker
        run: npm test
